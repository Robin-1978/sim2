[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2-sandbox"
version = "0.1.0"
description = "LLM-driven sandbox world platform"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.scripts]
sim2 = "sandbox.api.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
