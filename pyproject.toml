[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2"
version = "0.1.0"
description = "LLM-driven simulation world platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "textual>=1.0",
]

[project.optional-dependencies]
bge = [
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
]

[project.scripts]
sim2 = "sim2.api.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sim2*", "worlds", "worlds.*"]
exclude = ["artifacts*", "docs*", "examples*", "scripts*", "tests*"]

[tool.setuptools.package-data]
sim2 = ["world_builder/*.yaml"]
"worlds.starter_village" = ["*.yaml", "prompts/*.yaml"]
"worlds.three_lanterns_town" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
