[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2"
version = "0.1.0"
description = "LLM-driven simulation world platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bge = [
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
]

[project.scripts]
sim2 = "sim2.api.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
