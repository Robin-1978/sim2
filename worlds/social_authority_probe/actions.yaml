actions:
- id: travel_to
  version: 1
  verb: move
  description: Move to a connected known location.
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  requires_destination: true
  completion:
    if_already_at_destination: true
  duration:
    mode: route_distance
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.state.location_id == context.destination_id
    result: arrived
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: withdraw_resource
  version: 1
  verb: transfer_resource
  description: Withdraw one unit from a named shared reserve.
  parameters:
    resource_id: string
    scope: string
  preconditions:
  - actor.alive
  duration:
    minutes: 2
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: resource_withdrawal
    resource_id: context.resource_id
    amount: 1
    scope: context.scope
  success:
    condition: actor.alive
    result: resource_withdrawn
  failure:
    condition: actor.incapacitated
    result: withdrawal_failed
  interrupt_policy: pause
  interaction_policy: deny
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: request_access
  version: 1
  verb: authorize
  description: Request scoped access to the shared reserve after a denial.
  parameters: {}
  preconditions:
  - actor.alive
  duration:
    minutes: 0
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects: []
  success:
    condition: actor.alive
    result: access_requested
  failure:
    condition: actor.incapacitated
    result: request_failed
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: approve_withdrawal
