- id: take_resource
  version: 1
  verb: transfer_resource
  description: Take one unit from a named shared reserve without authorization.
  parameters:
    resource_id: string
    scope: string
  preconditions:
  - actor.alive
  duration:
    minutes: 1
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: resource_take
    resource_id: context.resource_id
