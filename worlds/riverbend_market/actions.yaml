actions:
- id: travel_to
  verb: move
  version: 1
  description: 沿已知路线移动到目标地点。
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  duration:
    minutes: 1
  costs:
    reserve: {}
    per_minute:
      stamina: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.alive
    result: arrived
  failure:
    condition: actor.incapacitated
    result: route_unknown
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: gather_iron_ore
  verb: gather
  version: 1
  description: 在北山矿场敲下两份铁矿石。
  parameters: {}
  preconditions:
  - actor.can_gather
  - actor.alive
  - actor.need.hydration > 15
  - actor.need.satiety > 15
  duration:
    minutes: 60
  costs:
    reserve: {}
    per_minute:
      stamina: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: resource_withdrawal
    resource_id: iron_vein
    amount: 2
    scope: resource_withdrawal
    output_item: iron_ore
  success:
    condition: actor.alive
    result: resource_gathered
  failure:
    condition: actor.incapacitated
    result: gathering_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: resource.gathered
    summary: 在北山铁矿采集了2份iron_ore。
    result: resource_gathered
    data:
      resource_id: iron_vein
      item: iron_ore
      quantity: 2
