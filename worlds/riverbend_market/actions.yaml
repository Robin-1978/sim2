- id: assemble_fair_crate
  verb: trade
  version: 1
  description: 在集市把铁锭、药剂、炖菜、麦酒、香料和十枚金币装进桥市礼箱；旅店也要备好床位。
  parameters: {}
  preconditions:
  - actor.alive
  - location.tag.market
  - world.fair_act >= 4
  - world.inn_ready >= 1
  - world.market_rep >= 0.4
  - world.fair_crate < 1
  - actor.inventory.iron_ingot >= 1
  - actor.inventory.tonic >= 1
  - actor.inventory.stew >= 1
  - actor.inventory.ale >= 1
  - actor.inventory.spice >= 1
  - actor.inventory.coin >= 10
  duration:
    minutes: 120
  costs:
    reserve:
      iron_ingot: 1
      tonic: 1
      stew: 1
      ale: 1
      coin: 10
      spice: 1
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_property_delta
    property: fair_crate
    delta: 1
    maximum: 1
  - type: world_property_delta
    property: market_till
    delta: 10
  - type: world_property_delta
    property: market_rep
    delta: 0.04
    maximum: 1
  - type: world_property_delta
    property: town_prosperity
    delta: 0.1
    maximum: 1
  success:
    condition: actor.alive
    result: crate_assembled
  failure:
    condition: actor.incapacitated
    result: trade_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: fair.crate_assembled
    summary: 铁锭、药剂、炖菜、麦酒、香料和十枚金币被装进桥市礼箱，商队要验的货终于齐了。
    result: crate_assembled
