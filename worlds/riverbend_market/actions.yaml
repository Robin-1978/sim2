actions:
- id: travel_to
  verb: move
  version: 1
  description: 沿已知路线移动到目标地点。
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  duration:
    minutes: 1
  costs:
    reserve: {}
    per_minute:
      stamina: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.alive
    result: arrived
  failure:
    condition: actor.incapacitated
    result: route_unknown
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: drink_water
  verb: consume
  version: 1
  description: 在河边、旅店或井边喝水，恢复水分。
  parameters: {}
  preconditions:
  - actor.alive
  - location.tag.water
  duration:
    minutes: 10
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: need_delta
    need: hydration
    delta: 25
    maximum: 100
  success:
    condition: actor.alive
    result: water_drunk
  failure:
    condition: actor.incapacitated
    result: drinking_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: water.drunk
    summary: 喝下一大口凉水，喉咙终于不干了。
    result: water_drunk
- id: rest_rough
  verb: rest
  version: 1
  description: 在镇口或安全地点将就睡一晚；恢复精力，但会受凉。
  parameters: {}
  preconditions:
  - actor.alive
  - location.tag.safe
  duration:
    minutes: 360
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: attribute_delta
    attribute: stamina
    delta: 40
    maximum: 100
  - type: attribute_delta
    attribute: integrity
    delta: -3
    minimum: 0
  success:
    condition: actor.alive
    result: rested
  failure:
    condition: actor.incapacitated
    result: rest_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: rest.rough
    summary: 在石桥边将就睡了一晚，醒来时肩背发僵。
    result: rested
