- id: sell_ore_to_smith
  verb: trade
  version: 1
  description: 把铁矿石卖给周铁山，换三枚金币。
  parameters: {}
  preconditions:
  - actor.alive
  - location.tag.smithy
  - actor.inventory.iron_ore >= 1
  - world.smithy_till >= 3
  - world.smithy_stock < 30
  duration:
    minutes: 5
  costs:
    reserve:
      iron_ore: 1
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_resource_delta
    resource_id: smithy_stock
    delta: 1
    maximum: 30
  - type: inventory_add
    item: coin
    quantity: 3
  - type: world_property_delta
    property: smithy_till
    delta: -3
    minimum: 0
  - type: world_property_delta
    property: smithy_rep
    delta: 0.08
    maximum: 1
  - type: world_property_delta
    property: town_prosperity
    delta: 0.01
    maximum: 1
  success:
    condition: actor.alive
    result: ore_sold
  failure:
    condition: actor.incapacitated
    result: trade_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: trade.sold
    wake:
    - story
    summary: 把iron_ore卖给smithy，从钱柜拿到3枚金币。
    result: ore_sold
    data:
      shop: smithy
      item: iron_ore
      price: 3
