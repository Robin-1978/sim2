name: 河湾镇
premise: 断桥把河湾镇挡在商路之外一年了。七天后，今年第一支商队会来到渡口验货；铁匠铺、食铺、医馆、旅店和集市必须一起准备好，否则商队会绕道去下游。
genre: 小镇经营与金币循环
locale: zh-CN
ui:
  crisis_metrics:
  - property: days_to_fair
    label: 桥市倒计时
    format: amount
    max: 7
    danger_below: 2
    warning_below: 4
    hint: 七天后商队抵达
  - property: town_prosperity
    label: 小镇繁荣
    format: percent
    danger_below: 0.25
    warning_below: 0.45
    hint: 目标 60%
  - property: fair_ready
    label: 备货店铺
    format: amount
    max: 5
    danger_below: 1
    warning_below: 4
    hint: 目标 4 家
  - property: market_till
    label: 集市钱柜
    format: amount
    danger_below: 8
    warning_below: 20
    hint: 集市钱柜
  tagline: 七天后商队就到。五家店、一个钱袋，桥市只认准备好的镇子。
  cast_order:
  - zhou
  - qin
  - baizhi
  - tao
  - jin
  - ashi
  - xiaohe
  - luhua
  event_kinds:
    economy:
