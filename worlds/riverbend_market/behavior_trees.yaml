behavior_trees:
- id: travel
  agent_label: 移动
  summary: 移动
  description: 沿已知路线前往一个相连的地点。
  purpose: 从当前地点走到另一个已知地点。
  entry_conditions:
  - actor.alive
  estimated_minutes: 1
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  success_results:
  - arrived
  failure_results:
  - route_unknown
  - blocked
  goal_tags:
  - movement
  drive_tags:
  - autonomy
  agent_parameters:
    location_id:
      type: string
      required: true
      max_length: 120
      description: 从当前路线列表中选择一个相连的已知地点。
- id: gather_iron_ore
  agent_label: 采铁矿石
  summary: 采铁矿石
  description: 去北山矿场敲两份铁矿石。
  purpose: 把自然资源变成可卖的原料。
  entry_conditions:
  - actor.can_gather
  - actor.alive
  - actor.need.hydration > 15
  - actor.need.satiety > 15
  estimated_minutes: 70
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: north_mine
  - type: action
    action_id: gather_iron_ore
    parameters: {}
  success_results:
  - resource_gathered
  failure_results:
  - gathering_failed
  - interrupted
  goal_tags:
  - gathering
  - supply
  drive_tags:
  - purpose
  - autonomy
