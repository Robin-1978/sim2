behavior_trees:
- id: travel
  agent_label: 移动
  summary: 移动
  description: 沿已知路线前往一个相连的地点。
  purpose: 从当前地点走到另一个已知地点。
  entry_conditions:
  - actor.alive
  estimated_minutes: 1
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  success_results:
  - arrived
  failure_results:
  - route_unknown
  - blocked
  goal_tags:
  - movement
  drive_tags:
  - autonomy
  agent_parameters:
    location_id:
      type: string
      required: true
      max_length: 120
      description: 从当前路线列表中选择一个相连的已知地点。
- id: drink_water
  agent_label: 喝水
  summary: 喝水
  description: 在河边、旅店或井边喝水，恢复水分。
  purpose: 先把水喝够，再谈赚钱。
  entry_conditions:
  - actor.alive
  - location.tag.water
  estimated_minutes: 10
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: drink_water
    parameters: {}
  success_results:
  - water_drunk
  failure_results:
  - drinking_failed
  goal_tags:
  - recovery
  drive_tags:
  - autonomy
- id: rest_rough
  agent_label: 将就睡一晚
  summary: 将就睡一晚
  description: 在镇口或安全地点将就睡一晚；恢复精力，但会受凉。
  purpose: 没钱住店时，先保住明天的力气。
  entry_conditions:
  - actor.alive
  - location.tag.safe
  - actor.state.stamina < 55
  estimated_minutes: 360
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: rest_rough
    parameters: {}
  success_results:
  - rested
  failure_results:
  - rest_failed
  goal_tags:
  - recovery
  drive_tags:
  - autonomy
- id: rest_at_inn
  agent_label: 在旅店睡一晚
  summary: 在旅店睡一晚
  description: 花五枚金币在老陶的旅店睡一晚，恢复精力和体力。
  purpose: 用金币换一个完整的夜晚。
  entry_conditions:
  - actor.alive
  - location.tag.inn
  - actor.state.stamina < 70
  - actor.inventory.coin >= 5
  estimated_minutes: 480
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: rest_at_inn
    parameters: {}
  success_results:
  - rested
  failure_results:
  - rest_failed
  - interrupted
  goal_tags:
  - recovery
  - social
  drive_tags:
  - autonomy
  - belonging
- id: treat
  agent_label: 在医馆治疗
  summary: 在医馆治疗
  description: 花六枚金币接受白芷的治疗，恢复体力。
  purpose: 把伤口处理掉，别让一场小伤拖垮桥市。
  entry_conditions:
  - actor.alive
  - location.tag.clinic
  - world.clinic_stock >= 1
  - actor.inventory.coin >= 6
  - actor.state.integrity < 70
  estimated_minutes: 90
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: treat
    parameters: {}
  success_results:
  - treated
  failure_results:
  - treatment_failed
  - interrupted
  goal_tags:
  - recovery
  - health
  drive_tags:
  - autonomy
  - belonging
- id: work_tavern
  agent_label: 在食铺帮工
  summary: 在食铺帮工
  description: 在食铺帮工两小时，换三枚金币和一份热饭。
  purpose: 没钱时先挣一顿饭，再谈桥市。
  entry_conditions:
  - actor.alive
  - location.tag.tavern
  - world.tavern_till >= 3
  - actor.state.stamina > 25
  estimated_minutes: 120
  cooldown_minutes: 120
  nodes:
  - type: action
    action_id: work_tavern
    parameters: {}
  success_results:
  - worked
  failure_results:
  - work_failed
  - interrupted
  goal_tags:
  - trade
  - social
  drive_tags:
  - belonging
  - purpose
- id: work_inn
  agent_label: 在旅店帮工
  summary: 在旅店帮工
  description: 在旅店帮工两个半小时，换三枚金币。
  purpose: 用体力换今晚的饭钱。
  entry_conditions:
  - actor.alive
  - location.tag.inn
  - world.inn_till >= 3
  - actor.state.stamina > 25
  estimated_minutes: 150
  cooldown_minutes: 150
  nodes:
  - type: action
    action_id: work_inn
    parameters: {}
  success_results:
  - worked
  failure_results:
  - work_failed
  - interrupted
  goal_tags:
  - trade
  - social
  drive_tags:
  - belonging
  - purpose
- id: work_market
  agent_label: 在集市做短工
  summary: 在集市做短工
  description: 在集市做两小时短工，从救济金换两枚金币；这是没钱时的保底。
  purpose: 没钱也没货时，用两小时劳动换回起步金币。
  entry_conditions:
  - actor.alive
  - location.tag.market
  - world.relief_fund >= 2
  - actor.state.stamina > 20
  estimated_minutes: 120
  cooldown_minutes: 120
  nodes:
  - type: action
    action_id: work_market
    parameters: {}
  success_results:
  - worked
  failure_results:
  - work_failed
  - interrupted
  goal_tags:
  - trade
  - public
  drive_tags:
  - purpose
  - belonging
- id: assemble_fair_crate
  agent_label: 组装桥市礼箱
  summary: 组装桥市礼箱
  description: 在集市把铁锭、药剂、炖菜、麦酒、香料和十枚金币装进桥市礼箱；旅店也要备好床位。
  purpose: 把五家店的成果装进一只箱子，交给商队验货。
  entry_conditions:
  - actor.alive
  - world.fair_act >= 4
  - world.inn_ready >= 1
  - world.market_rep >= 0.4
  - world.fair_crate < 1
  - actor.inventory.iron_ingot >= 1
  - actor.inventory.tonic >= 1
  - actor.inventory.stew >= 1
  - actor.inventory.ale >= 1
  - actor.inventory.spice >= 1
  - actor.inventory.coin >= 10
  estimated_minutes: 130
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: market_square
  - type: action
    action_id: assemble_fair_crate
    parameters: {}
  success_results:
  - crate_assembled
  failure_results:
  - trade_failed
  - interrupted
  goal_tags:
  - trade
  - fair
  - public
  drive_tags:
  - purpose
  - belonging
