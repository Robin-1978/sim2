player_requirement_hints:
  world.site_surveyed == 1: 先到灰脊集口勘测门端
  world.merit_count >= 3: 等白砾完成三个已验收的代班
  world.service_votes >= 2: 等枢门与旧站各提交一份推荐
  world.connected_count >= 1: 先完成一条门线
  world.bridge_surveyed == 1: 先勘测北栈桥步道
  world.market_permit == 1: 先到低城坊市登记建造许可
  world.market_city == 1: 先安装低城坊市门端
  world.market_mine == 1: 先安装灰脊集口门端
  world.market_link == 1: 先启用通往低城坊市的门线
  world.yard_permit == 1: 先到铁轨货场登记建造许可
  world.yard_city == 1: 先安装铁轨货场门端
  world.yard_mine == 1: 先安装灰脊集口门端
  world.yard_link == 1: 先启用通往铁轨货场的门线

resident_conversations:
  default:
    topics:
      greet:
        question: 打个招呼
        lines:
        - when: actor.need.satiety < 45
          text: 你也刚下工？我先找口吃的，空着肚子做不了多少事。
        - when: actor.need.hydration < 45
          text: 我得找些水。等喝过水，我再回去接着干。
        - text: 早。工地开得早，等这一趟忙完了，还能说两句。
      work:
        question: 今天在哪儿上工？
        lines:
        - when: actor.state.job_region == 'mine'
          text: 我多半在灰脊。矿口出多少，货架上才有多少，空车来了也只能等。
        - when: actor.state.job_region == 'yard'
          text: 工钱在货场按班结。有门可走时，搬完一趟常还有下一趟。
        - when: actor.state.job_region == 'low'
          text: 我在低城找活。早一点去农圃，能赶上头一班。
        - text: 我去看今天哪里缺人手。有活就领一班工钱，没活就先回家。
      home:
        question: 一天忙完以后呢？
        lines:
        - when: actor.inventory.coin <= 1
          text: 今天先把饭钱留好。能多攒一枚，就离下个月的床位钱近一点。
        - when: actor.need.belonging < 45
          text: 在这儿认得的人还不多。有空来坐一会儿，我想听听你从哪里来。
        - text: 我会回住处坐一会儿。能跟今天一起干活的人吃口饭，就挺好。
  residents:
    low_resident_02:
      intro: 阮生原先在农圃出工，后来替坊市跑矿料。他算得清每一趟路要走多久，也知道雨天哪一处路面最滑。
      topics:
        work:
          question: 今天跑哪条路？
          lines:
          - when: actor.inventory.paving_ore >= 2
            text: 货已经买下来了，得送回坊市。只要货没入仓，苗原就没料开工。
          - when: world.tender_mode == 2
            text: 旧站买的是送到货场的石料。进了坊市只是到了一半，过门、过桥都得算时间。
          - when: world.tender_mode == 1
            text: 水庭这单在坊市验收。送矿的人交回仓就行，石料留给低城用。
          - when: world.shop_road == 1
            text: 新铺的路现在两分钟就能走完。收工去水庭洗把脸，来回都赶得及。
          - text: 先看有没有工钱买料。没矿可拉的时候，我也会回农圃找活。
        home:
          question: 你想留下来吗？
          lines:
          - text: 我姐在低城种菜。我走过的路多，可干活走再远，还是愿意赶回来同她吃饭。
    low_resident_03:
      intro: 苗原带着一只修了三次的錾子。她不喜欢欠薪，也舍不得扔掉用熟的工具。
      help_behavior: set_up_crew_table
      topics:
        work:
          question: 工坊现在怎么样？
          lines:
          - when: world.market_ore < 2 and world.shop_open == 1
            text: 矿料不够开炉。阮生把货送回来，我才能做下一炉。
          - when: world.tender_mode == 2
            text: 旧站要把货运走。做完得装箱，我最担心的是路上耽搁。
          - when: world.shop_open == 1
            text: 料够就开工。每批两份矿料，还有一枚工钱，账都要记清。
          - text: 我还在农圃领工钱。坊市那间空工坊若是能开起来，我想再摸摸錾子。
        home:
          question: 收工以后想做什么？
          lines:
          - when: world.crew_table == 1
            text: 我们在长桌吃饭。阮生还想把工钱省下来，换一双能走雨路的靴子。
          - when: world.shop_open == 1
            text: 我想在工坊边支张桌。有些人赶回来时摊都收了，坐下来吃顿热饭比站着等活强。
          - text: 去农圃看看。那儿每天都有人等着领活，我也常赶着天亮去。
    yard_resident_02:
      intro: 姚齐在货场记件领工钱。门线引来了货车，也让他担心干了一天仍分不到工钱。
      topics:
        work:
          question: 铁轨货场的活多吗？
          lines:
          - when: world.tender_hired == 1
            text: 我领了旧站的津贴，在坊市有工位了。先把手艺学好，我还想攒一点钱搬到近处。
          - when: world.yard_wages < 8
            text: 货在动，可领工钱的人越来越多。再没新活，我想去低城看看。
          - when: world.yard_link == 1
            text: 灰脊有货能直接过门。有货要卸的时候，能干到夜里。
          - text: 门没开，货还在走北边的老路。赶路的人多，卸车的活反倒没那么多。
