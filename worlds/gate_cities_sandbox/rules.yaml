minute_effects:
- id: relief_path_sell_farm
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: low_water, delta: -1}
  - {type: world_resource_delta, resource_id: low_food, delta: 3}
  - {type: world_property_delta, property: relief_path_trades, delta: 1}
  condition: world.relief_path_use == 1 and world.low_water >= 17 and world.low_food <= 12
  event_type: gatebuild.relief_path_supply
  event_summary: 近路边的早摊用一份余水，向水庭补了三份饭。
- id: relief_path_supply_workshop
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: yard_ore, delta: -2}
  - {type: world_resource_delta, resource_id: market_ore, delta: 2}
  - {type: world_property_delta, property: relief_path_trades, delta: 1}
  condition: world.relief_path_use == 2 and world.yard_ore >= 8 and world.market_ore < 2
  event_type: gatebuild.relief_path_supply
  event_summary: 新路备料点把旧站的两份余矿送到了坊市仓。
- id: relief_reopen
  scope: world
  every_minutes: 1
  effects:
  - {type: world_property_delta, property: relief_reopen, delta: -1}
  condition: world.relief_reopen > 0
- id: relief_return_reserves
  scope: world
  every_minutes: 1
  effects:
  - {type: world_resource_delta, resource_id: relief_food, delta: -1}
  - {type: world_resource_delta, resource_id: low_food, delta: 1}
  condition: world.relief_phase == 0 and world.relief_food >= 1 and world.low_food < 48
- id: relief_exchange_delivery
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: low_wages, delta: -2}
  - {type: world_resource_delta, resource_id: yard_wages, delta: 2}
  - {type: world_resource_delta, resource_id: yard_food, delta: -3}
  - {type: world_resource_delta, resource_id: low_food, delta: 3}
  - {type: world_property_delta, property: relief_followups, delta: 1}
  condition: world.relief_policy == 1 and world.relief_phase == 0 and world.low_food <= 8 and world.yard_food >= 13 and world.low_wages >= 2 and world.yard_wages <= 168
  event_type: gatebuild.relief_supply
  event_summary: 低城再次按互济契约向旧站付两枚钱，换到三份饭。
- id: relief_growers_delivery
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: low_water, delta: -2}
  - {type: world_resource_delta, resource_id: field_fuel, delta: -1}
  - {type: world_resource_delta, resource_id: low_food, delta: 4}
  - {type: world_property_delta, property: relief_followups, delta: 1}
  condition: world.relief_policy == 2 and world.relief_phase == 0 and world.low_food <= 8 and world.low_water >= 18 and world.field_fuel >= 1
  event_type: gatebuild.relief_supply
  event_summary: 农圃用了余水和燃料，按新约补给水庭四份饭。
- id: tender_clock
  scope: world
  every_minutes: 1
  effects:
  - type: world_property_delta
    property: tender_minutes
    delta: -1
  condition: world.tender_mode > 0 and world.tender_delivered < 3 and world.tender_minutes > 0
- id: tender_unused_hiring
  scope: world
  every_minutes: 1
  effects:
  - type: world_resource_delta
    resource_id: tender_hiring_fund
    delta: -1
  - type: world_resource_delta
    resource_id: settlement_fund
    delta: 1
  condition: world.tender_mode == 0 and world.tender_hiring_fund == 1 and world.settlement_fund < 40
- id: tender_farm_canal
  scope: world
  every_minutes: 60
  effects:
  - type: world_resource_delta
    resource_id: low_water
    delta: -2
  - type: world_resource_delta
    resource_id: farm_water
    delta: 2
  condition: world.tender_irrigate == 1 and world.low_water >= 18 and world.farm_water <= 22
- id: high_spring
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: high_water, delta: 4}
  condition: world.high_water <= 66
- id: city_well
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: low_water, delta: 4}
  condition: world.low_water <= 66
- id: ration_harvest
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: farm_water, delta: -1}
  - {type: world_resource_delta, resource_id: low_food, delta: 3}
  condition: world.farm_water >= 1 and world.low_food <= 45
- id: field_canal
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: low_water, delta: -1}
  - {type: world_resource_delta, resource_id: farm_water, delta: 1}
  condition: world.low_water >= 13 and world.farm_water < 24
- id: rents_pay_workers
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: market_rent, delta: -1}
  - {type: world_resource_delta, resource_id: low_wages, delta: 1}
  condition: world.market_rent >= 1 and world.low_wages < 170
- id: fuel_sales_pay_workers
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: farm_till, delta: -1}
  - {type: world_resource_delta, resource_id: low_wages, delta: 1}
  condition: world.farm_till >= 1 and world.low_wages < 170
- id: grow_mine_seam
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: ore_seam, delta: 4}
  condition: world.ore_seam <= 44
- id: prune_fuel
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: field_fuel, delta: 2}
  condition: world.field_fuel <= 22 and world.farm_water >= 2
- id: separate_crystals
  scope: world
  every_minutes: 240
  effects:
  - {type: world_resource_delta, resource_id: ore_seam, delta: -2}
  - {type: world_resource_delta, resource_id: mine_crystal, delta: 1}
  condition: world.mine_crystal < 8 and world.ore_seam >= 2
- id: medical_delivery
  scope: world
  every_minutes: 240
  effects:
  - {type: world_resource_delta, resource_id: low_water, delta: -1}
  - {type: world_resource_delta, resource_id: clinic_supplies, delta: 1}
  condition: world.clinic_supplies < 15 and world.low_water >= 15
- id: reset_shift
  scope: world
  every_minutes: 40
  effects:
  - {type: world_resource_delta, resource_id: substitute_shift, delta: 1}
  condition: world.substitute_shift < 1
- id: cart_low_food_to_high_food
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: low_food, delta: -2}
  - {type: world_resource_delta, resource_id: high_food, delta: 2}
  condition: world.low_food >= 5 and world.high_food <= 25 and (world.relief_cases == 0 or world.low_food >= 12)
- id: cart_high_water_to_yard_water
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: high_water, delta: -2}
  - {type: world_resource_delta, resource_id: yard_water, delta: 2}
  condition: world.high_water >= 5 and world.yard_water <= 25
- id: cart_high_water_to_mine_water
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: high_water, delta: -2}
  - {type: world_resource_delta, resource_id: mine_water, delta: 2}
  condition: world.high_water >= 5 and world.mine_water <= 25
- id: cart_low_food_to_yard_food
  scope: world
  every_minutes: 90
  effects:
  - {type: world_resource_delta, resource_id: low_food, delta: -2}
  - {type: world_resource_delta, resource_id: yard_food, delta: 2}
  condition: world.low_food >= 5 and world.yard_food <= 25 and (world.relief_cases == 0 or world.low_food >= 12)
- id: cart_low_food_to_mine_food
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: low_food, delta: -2}
  - {type: world_resource_delta, resource_id: mine_food, delta: 2}
  condition: world.low_food >= 5 and world.mine_food <= 25 and (world.relief_cases == 0 or world.low_food >= 12)
- id: thirst
  scope: agent
  every_minutes: 1
  effect: {type: need_delta, need: hydration, delta: -0.05}
- id: hunger
  scope: agent
  every_minutes: 1
  effect: {type: need_delta, need: satiety, delta: -0.035}
- id: deprivation
  scope: agent
  every_minutes: 10
  effect: {type: attribute_delta, attribute: integrity, delta: -3}
  condition: actor.need.hydration <= context.deprivation_limit or actor.need.satiety <= context.deprivation_limit
- id: safe_rest
  scope: agent
  every_minutes: 15
  effect: {type: attribute_delta, attribute: stamina, delta: 3}
  condition: location.safe
- id: danger_wears_safety
  scope: agent
  every_minutes: 30
  effect: {type: need_delta, need: safety, delta: -4}
  condition: location.safe == false
- id: safe_recovery
  scope: agent
  every_minutes: 60
  effect: {type: need_delta, need: safety, delta: 3}
  condition: location.safe
- id: unseen_neighbors
  scope: agent
  every_minutes: 120
  effect: {type: need_delta, need: belonging, delta: -3}
- id: standing_age
  scope: agent
  every_minutes: 240
  effect: {type: need_delta, need: standing, delta: -3}
- id: aspiration
  scope: agent
  every_minutes: 120
  effect: {type: need_delta, need: ambition, delta: -4}
- id: refill_market_slots
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: market_freight, delta: 4}
  condition: world.market_link == 1 and world.market_maintenance > 0 and world.market_freight < 4
- id: wear_market_gate
  scope: world
  every_minutes: 240
  effects:
  - {type: world_resource_delta, resource_id: market_maintenance, delta: -1}
  condition: world.market_link == 1 and world.market_maintenance > 0
- id: fare_funds_maintenance_market
  scope: world
  every_minutes: 180
  effects:
  - {type: world_resource_delta, resource_id: market_tolls, delta: -1}
  - {type: world_resource_delta, resource_id: high_wages, delta: 1}
  - {type: world_resource_delta, resource_id: market_maintenance, delta: 1}
  condition: world.trade_policy == 2 and world.market_tolls >= 1 and world.high_wages < 170 and world.market_maintenance
    < 12
- id: trade_makes_jobs_market
  scope: world
  every_minutes: 30
  effects:
  - {type: world_resource_delta, resource_id: market_orders, delta: 1}
  condition: world.market_sales >= 2 and world.market_sales > world.market_orders + world.moved_workers and world.market_orders
    < 10
- id: refill_yard_slots
  scope: world
  every_minutes: 60
  effects:
  - {type: world_resource_delta, resource_id: yard_freight, delta: 4}
  condition: world.yard_link == 1 and world.yard_maintenance > 0 and world.yard_freight < 4
- id: wear_yard_gate
  scope: world
  every_minutes: 240
  effects:
  - {type: world_resource_delta, resource_id: yard_maintenance, delta: -1}
  condition: world.yard_link == 1 and world.yard_maintenance > 0
- id: fare_funds_maintenance_yard
  scope: world
  every_minutes: 180
  effects:
  - {type: world_resource_delta, resource_id: yard_tolls, delta: -1}
  - {type: world_resource_delta, resource_id: high_wages, delta: 1}
  - {type: world_resource_delta, resource_id: yard_maintenance, delta: 1}
  condition: world.trade_policy == 2 and world.yard_tolls >= 1 and world.high_wages < 170 and world.yard_maintenance
    < 12
- id: yard_orders_from_delivery
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: yard_orders, delta: 1}
  - {type: world_property_delta, property: old_openings, delta: 1}
  condition: world.yard_link == 1 and world.yard_sales >= 1 and world.yard_orders < 6
- id: sanction_wait
  scope: world
  every_minutes: 1
  effects:
  - {type: world_property_delta, property: embargo_countdown, delta: -1}
  condition: world.trade_policy == 3 and world.embargo_countdown > 0
- id: sanction_activation
  scope: world
  every_minutes: 1
  effects:
  - {type: world_property_set, property: lockdown, value: 1}
  condition: world.trade_policy == 3 and world.lockdown == 0 and world.embargo_countdown == 0
- id: public_maintain_market
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: settlement_fund, delta: -1}
  - {type: world_resource_delta, resource_id: high_wages, delta: 1}
  - {type: world_resource_delta, resource_id: market_maintenance, delta: 1}
  - {type: world_property_delta, property: public_contract_deliveries, delta: 1}
  condition: world.trade_policy == 1 and world.settlement_fund > 0 and world.market_link == 1 and world.market_maintenance
    < 11
- id: public_maintain_yard
  scope: world
  every_minutes: 120
  effects:
  - {type: world_resource_delta, resource_id: settlement_fund, delta: -1}
  - {type: world_resource_delta, resource_id: high_wages, delta: 1}
  - {type: world_resource_delta, resource_id: yard_maintenance, delta: 1}
  - {type: world_property_delta, property: public_contract_deliveries, delta: 1}
  condition: world.trade_policy == 1 and world.settlement_fund > 0 and world.yard_link == 1 and world.yard_maintenance
    < 11
decision_policy:
  minimum_drive_score: 0.035
  assignment_urgency_limits: {hydration: 0.72, satiety: 0.72, safety: 0.68}
  resident_model_wakes_only: true
  max_model_residents: 8
  resident_sessions_per_day: 32
  resident_session_iterations: 3
  wait_backoff_minutes:
  - 20
  - 45
  - 90
  empty_catalog_retry_minutes: 35
progression:
- id: fix_market_yard
  priority: 1.1
  label: 你装的两个门端没有配成一对
  summary: 灰脊端接低城，另一端装在旧站。可把灰脊端直接改接旧站，或者拆回城里端点，拿回两份框架件。
  visible_when: world.market_mine == 1 and world.market_city == 0 and world.yard_city == 1 and world.yard_mine == 0 and
    world.market_link == 0 and world.yard_link == 0
  target_behaviors:
  - retarget_market_to_yard
  - reclaim_yard_city
- id: fix_yard_market
  priority: 1.1
  label: 你装的两个门端没有配成一对
  summary: 灰脊端接旧站，另一端装在低城。可把灰脊端直接改接低城，或者拆回城里端点，拿回两份框架件。
  visible_when: world.yard_mine == 1 and world.yard_city == 0 and world.market_city == 1 and world.market_mine == 0 and
    world.yard_link == 0 and world.market_link == 0
  target_behaviors:
  - retarget_yard_to_market
  - reclaim_market_city
- id: raise_shop
  priority: 0.83
  label: 接下水庭的第一笔订单
  summary: 投入两枚钱开铺路工坊。卖一批路石收三枚，矿料和工钱各一枚。
  visible_when: world.site_surveyed == 1 and world.shop_open == 0 and (world.connected_count >= 1 or world.bridge_improved
    == 1 or actor.inventory.frame < 2)
  target_behaviors:
  - open_paving_shop
- id: start_shop
  priority: 1.0
  label: 交付工坊的第一批路石
  summary: 你可以亲自做第一批，也可以委托居民。有人在处理时，等一班或继续建门都能推进订单。
  visible_when: world.shop_open == 1 and world.shop_batches == 0 and world.shop_road == 0
  target_behaviors:
  - shop_receive
  - shop_process
  - shop_supply
  - appoint_shop_crew
  support_behaviors:
  - wait_for_shop
- id: shop_yield
  priority: 0.97
  label: 工坊开始赚钱了
  summary: 取走一枚已结算的利润，或者让两批路石变成一条真正缩短的公共道路。
  visible_when: world.shop_road == 0 and world.shop_open == 1 and world.shop_batches >= 1 and world.shop_dividends == 0
  target_behaviors:
  - shop_pay_dividend
  - shop_pave_market_road
  - shop_process
  - shop_supply
  - appoint_shop_crew
  support_behaviors:
  - wait_for_shop
- id: shop_roadworks
  priority: 0.96
  label: 让两批路石铺出一条新路
  summary: 第一笔分红已经到手。再备一批路石，可把坊市去水庭的路缩短到两分钟。
  visible_when: world.shop_dividends >= 1 and world.shop_road == 0
  target_behaviors: [shop_pave_market_road, shop_process, shop_supply, appoint_shop_crew]
  support_behaviors: [wait_for_shop]
- id: relief_source
  priority: 1.1
  label: 低城的锅快空了
  summary: 旧站愿意卖饭，但要拿真工钱。也可以保住工钱，用井水和燃料抢收。先决定用哪笔资源换今晚的饭。
  visible_when: world.shop_road == 1 and world.relief_phase == 0 and world.relief_reopen == 0 and world.low_food <= 6
  target_behaviors: [relief_buy_yard, relief_early_harvest]
  support_behaviors: []
- id: relief_allocation
  priority: 1.2
  label: 这批饭先给谁？
  summary: 先开公粮锅，还是把饭留给修近路的工班？有十份可以两件都做。资源不够时，做过一项就能议定以后的安排。
  visible_when: world.relief_phase == 1 and world.relief_decisions == 0
  target_behaviors: [relief_feed_neighborhood, relief_commission_path]
  support_behaviors: []
- id: relief_charter
  priority: 1.2
  label: 今晚已有安排，下次怎么办？
  summary: 剩饭够用时可完成另一项安排。然后决定未来靠两城互济、农圃补收，还是保留现有办法。
  visible_when: world.relief_phase == 1 and world.relief_decisions > 0
  target_behaviors: [relief_feed_neighborhood, relief_commission_path, relief_ratify_trade, relief_ratify_growers, relief_keep_reserves]
- id: relief_followup
  priority: 1.05
  label: 新路通了，路边留给谁？
  summary: 坊市到农圃只要两分钟。沿路有一块空地，可用来补低城的饭，或补工坊库存。两边都想用。
  visible_when: world.relief_phase == 0 and world.relief_path == 1 and world.relief_path_use == 0
  target_behaviors: [relief_path_market, relief_path_freight]
- id: tender_offer
  priority: 0.96
  label: 两座城都想买你的路石
  summary: 水庭就地验收。旧站工资和预付更多，货却必须送到货场。合同会锁住出资，只能同时接一份。
  visible_when: world.shop_road == 1 and world.tender_mode == 0
  target_behaviors:
  - sign_court_tender
  - sign_yard_tender
- id: tender_active
  priority: 0.99
  label: 正在履行三批路石的合同
  summary: 班组会自行买料、做货和配送。你可亲自补上任一环，也能在等待时去做别的事。
  visible_when: world.tender_mode > 0 and world.tender_delivered < 3
  target_behaviors:
  - tender_wait
  - tender_supply
  - tender_unload
  - tender_mason_court
  - tender_mason_yard
  - tender_receive_yard
  - tender_haul
- id: tender_final
  priority: 1.0
  label: 三批路石全数验收
  summary: 回坊市结清合同。交付的路石可以盖成一项有长期作用的公共工程。
  visible_when: world.tender_mode > 0 and world.tender_delivered == 3
  target_behaviors:
  - tender_close
- id: tender_works
  priority: 0.98
  label: 为城市留下有用的工程
  summary: 决定交付的路石要做什么。引水渠会补给农圃，装货道会缩短旧站步程。
  visible_when: world.tender_mode == 0 and ((world.court_tender_stones >= 6 and world.tender_irrigate == 0) or
    (world.yard_tender_stones >= 6 and world.tender_resurface == 0))
  target_behaviors:
  - tender_irrigate
  - tender_resurface
  - sign_court_tender
  - sign_yard_tender
- id: shop_followup
  priority: 0.67
  label: 下一班生产与城市维护
  summary: 用货款继续周转，用路石维护门线。你也可以暂停班组，把时间留给下一条路线。
  visible_when: world.shop_road == 1 and world.shop_dividends >= 1
  target_behaviors:
  - shop_use_paving_stock
  - shop_pay_dividend
  - shop_process
  - shop_supply
  - appoint_shop_crew
  - pause_shop_crew
  support_behaviors:
  - wait_for_shop
- id: survey
  priority: 0.6
  label: 先看看城外能接到哪里
  summary: 到灰脊集口勘测门端，或勘测北栈桥，给未来保留备用路。
  visible_when: world.site_surveyed == 0
  target_behaviors:
  - survey_exchange
  - survey_bridge
  support_behaviors:
  - open_paving_shop
- id: bridge_works
  priority: 0.7
  label: 让北栈桥能走重货
  summary: 加固只需两份框架件。竣工后可以把矿料走陆路运进低城，或回头继续建门。
  visible_when: world.bridge_surveyed == 1 and world.bridge_improved == 0
  target_behaviors:
  - improve_bridge
- id: choose
  priority: 0.9
  label: 接通第一条门线
  summary: 选低城坊市或铁轨货场，用同一线路的两个门端和一枚门芯开门。
  visible_when: world.site_surveyed == 1 and world.connected_count == 0
  target_behaviors:
  - pair_market
  - pair_yard
  - permit_market
  - permit_yard
  - fit_market_city
  - fit_yard_city
  - fit_market_mine
  - fit_yard_mine
  - improve_bridge
  - reclaim_market_city
  - reclaim_yard_city
  support_behaviors:
  - open_paving_shop
- id: charter
  priority: 0.8
  label: 新门归谁维护
  summary: 回低城议事水庭，决定公开竞争、共同维护或通知限行。
  visible_when: (world.connected_count > 0 or world.bridge_improved == 1) and world.trade_policy == 0
  target_behaviors:
  - sign_public_access
  - sign_open_market
- id: hire
  priority: 0.3
  label: 班组要选自己的班长
  summary: 白砾验收三个代班，拿到两份签名后，可以到枢门邀请她接任。
  visible_when: world.merit_count >= 1 and world.appointment == 0
  target_behaviors:
  - authorize_appointment
