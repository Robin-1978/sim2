locations:
- id: high_gate
  name: 高地枢门
  description: 井台、工作桌和旧门架围着一块施工空地。
  safe: true
  public: true
  tags:
  - anchor
  - craft
  routes:
  - high_lodges
  - north_trestle
  - low_city
  - old_yard
  route_distances: {high_lodges: 3, north_trestle: 10, low_city: 12, old_yard: 18}
  map_position: {x: 43, y: 18}
- id: high_lodges
  name: 高地宿铺
  description: 宿铺有租床、杂工和夜班后的热饭。
  safe: true
  public: true
  tags:
  - housing
  routes:
  - high_gate
  route_distances: {high_gate: 3}
  map_position: {x: 22, y: 17}
- id: north_trestle
  name: 北栈桥
  description: 栈桥对岸是矿口。勘测后可开步道，加固后才适合运重货。
  safe: true
  public: true
  tags:
  - survey
  routes:
  - high_gate
  route_distances: {high_gate: 10}
  map_position: {x: 61, y: 13}
- id: low_city
  name: 低城议事水庭
  description: 水务议事员在石阶旁登记配额与居住申请。
  safe: true
  public: true
  tags:
  - council
  routes:
  - high_gate
  - low_fields
  - low_market
  - low_clinic
  route_distances: {high_gate: 12, low_fields: 4, low_market: 4, low_clinic: 5}
  map_position: {x: 21, y: 47}
- id: low_fields
  name: 河滩农圃
  description: 水渠供应粮食和燃料枝条，断水会推迟下一批收成。
  safe: true
  public: true
  tags:
  - farm
  routes:
  - low_city
  route_distances: {low_city: 4}
  map_position: {x: 8, y: 35}
- id: low_market
  name: 低城坊市
  description: 这里可以买矿、卖矿、租铺，或在坊市外架一座新门。
  safe: true
  public: true
  tags:
  - anchor
  - market
  - housing
  routes:
  - low_city
  route_distances: {low_city: 4}
  map_position: {x: 15, y: 65}
- id: low_clinic
  name: 低城街诊所
  description: 床位和药材都有限，开放通行关系到谁能及时到这里。
  safe: true
  public: true
  tags:
  - clinic
  routes:
  - low_city
  route_distances: {low_city: 5}
  map_position: {x: 31, y: 62}
- id: old_yard
  name: 铁轨货场
  description: 旧路上的矿石在这里过磅。新门可以让货车直达。
  safe: true
  public: true
  tags:
  - anchor
  - market
  routes:
  - high_gate
  - old_station
  - old_dorm
  - mine_exchange
  route_distances: {high_gate: 18, old_station: 4, old_dorm: 4, mine_exchange: 28}
  map_position: {x: 58, y: 55}
- id: old_station
  name: 旧站工坊
  description: 工坊加工矿料、工具和门芯，也接收学徒。
  safe: true
  public: true
  tags:
  - craft
  routes:
  - old_yard
  route_distances: {old_yard: 4}
  map_position: {x: 70, y: 65}
- id: old_dorm
  name: 旧站宿舍
  description: 工坊附近的床位为轮班工人节省通勤。
  safe: true
  public: true
  tags:
  - housing
  routes:
  - old_yard
  route_distances: {old_yard: 4}
  map_position: {x: 54, y: 78}
- id: mine_pit
  name: 灰脊矿口
  description: 矿石和晶片从这里运到集口挂牌。
  safe: false
  public: true
  tags:
  - mine
  routes:
  - mine_exchange
  route_distances: {mine_exchange: 6}
  map_position: {x: 87, y: 25}
- id: mine_exchange
  name: 灰脊集口
  description: 矿户、买家和驮工在此交货，留有两处可施工的门端。
  safe: true
  public: true
  tags:
  - anchor
  - market
  - housing
  routes:
  - old_yard
  - mine_pit
  route_distances: {old_yard: 28, mine_pit: 6}
  map_position: {x: 87, y: 48}
