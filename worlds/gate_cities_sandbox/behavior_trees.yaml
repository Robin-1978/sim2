behavior_trees:
- id: travel
  version: 1
  agent_label: 步行到相邻地点
  summary: 步行到相邻地点
  description: 步行到相邻地点
  entry_conditions:
  - actor.alive
  nodes:
  - type: action
    action_id: travel_to
    parameters: {location_id: context.location_id}
  cooldown_minutes: 0
  goal_tags:
  - movement
- id: survey_exchange
  version: 1
  agent_label: 前往灰脊勘测门端
  summary: 确认灰脊集口的施工位置，解锁两座城的建门许可。
  description: 前往灰脊勘测门端
  entry_conditions:
  - actor.alive
  - world.site_surveyed == 0
  nodes:
  - type: action
    action_id: travel_to
    parameters: {location_id: mine_exchange}
  - type: action
    action_id: survey_exchange
    parameters: {}
  cooldown_minutes: 0
- id: survey_bridge
  version: 1
  agent_label: 前往北栈桥勘测步道
  summary: 先开一条通往矿口的步道，留作施工和限行时的备用路。
  description: 前往北栈桥勘测步道
  entry_conditions:
  - actor.alive
  - world.bridge_surveyed == 0
  nodes:
  - type: action
    action_id: travel_to
    parameters: {location_id: north_trestle}
  - type: action
    action_id: survey_bridge
    parameters: {}
  cooldown_minutes: 0
- id: improve_bridge
  version: 1
  agent_label: 加固北栈桥货路
  summary: 用两份框架件开通重货路线，保留门芯。
  description: 加固北栈桥货路
  entry_conditions:
  - actor.alive
  - world.bridge_surveyed == 1
  - world.bridge_improved == 0
  - actor.inventory.frame >= 2
