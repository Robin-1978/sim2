    on_failure: {}
    refund: {}
  effects:
  - {type: route_edit, mode: unlink, from: north_trestle, to: mine_pit}
  - {type: route_edit, from: north_trestle, to: mine_pit, distance: 8}
  - {type: world_property_set, property: bridge_improved, value: 1}
