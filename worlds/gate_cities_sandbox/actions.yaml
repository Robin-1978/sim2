actions:
- id: travel_to
  version: 1
  verb: move
  description: 沿当前可通行的道路前往指定地点。
  parameters: {location_id: string}
  preconditions:
  - actor.alive
  - route.known
  - actor.mobile
  - destination.reachable
  duration: {mode: route_distance}
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: location_set, location_id: context.location_id}
  success: {condition: actor.alive, result: travel_to}
  failure: {condition: actor.incapacitated, result: interrupted}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
  requires_destination: true
  completion: {if_already_at_destination: true}
- id: survey_exchange
  version: 1
  verb: explore
  description: 勘测灰脊集口、矿户协议与两处门端。
  parameters: {}
  preconditions:
  - actor.alive
  - actor.state.location_id == 'mine_exchange'
  - world.site_surveyed == 0
  duration: {minutes: 10}
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_set, property: site_surveyed, value: 1}
  - type: public_event
    event: gatebuild.surveyed
    summary: 灰脊集口的门端已经过勘测。
    data: {}
  success: {condition: actor.alive, result: survey_exchange}
  failure: {condition: actor.incapacitated, result: interrupted}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: survey_bridge
  version: 1
  verb: explore
  description: 沿北栈桥检查到矿口的步道。
  parameters: {}
  preconditions:
  - actor.alive
  - actor.state.location_id == 'north_trestle'
  - world.bridge_surveyed == 0
  duration: {minutes: 10}
  costs:
    reserve: {}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: route_edit, from: north_trestle, to: mine_pit, distance: 14}
  - {type: world_property_set, property: bridge_surveyed, value: 1}
  - type: public_event
    event: gatebuild.trail_opened
    summary: 勘测队开通了北栈桥到矿口的步道。
    data: {}
  success: {condition: actor.alive, result: survey_bridge}
  failure: {condition: actor.incapacitated, result: interrupted}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: improve_bridge
  version: 1
  verb: repair
  description: 消耗两份框架件加固北栈桥
  parameters: {}
  preconditions:
  - actor.alive
  - actor.state.location_id == 'north_trestle'
  - world.bridge_surveyed == 1
  - world.bridge_improved == 0
  duration: {minutes: 30}
