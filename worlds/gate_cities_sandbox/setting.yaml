name: 诸城之门 · 建造经营版
locale: zh-CN
genre: 城邦建造 · 开放社会模拟
premise: 旧驮路勉强维持四地生计。你有一枚门芯和四份框架件，第一扇门会改变商路、岗位和谁需要谁。
calendar:
  minutes_per_day: 1440
  day_phases:
  - {id: workday, start_minute: 360, end_minute: 1200}
  - {id: night, start_minute: 1200, end_minute: 360}
world_clock: {start_day: 1, start_minute: 480, season: 架门季}
ui:
  tagline: 每开一扇门，就有一条旧路会改变。
  entry_action: 接手高地工坊
  cover_art: assets/freight-gate.webp
  scene_art: {high_gate: assets/freight-gate.webp}
  result_labels:
    retarget_market_to_yard: 灰脊门端已改接铁轨货场
    retarget_yard_to_market: 灰脊门端已改接低城坊市
    open_paving_shop: 你的工坊已经开始经营
    appoint_shop_crew: 坊市班组接下了供货和生产
    shop_receive_ore: 两份矿料已入坊市仓
    shop_fabricate_paving: 卖出两份路石，工坊收到三枚钱
    shop_pay_dividend: 已领取一枚分红
    shop_pave_market_road: 坊市到水庭的短路开通
    holding_hire_farm: 江遥已接下炊坊的供餐委托
    holding_pause_farm: 炊坊已暂停接新班
  resident_actions:
    travel_to: 赶路
    holding_serve_guest: 在玩家的驿舍吃饭休息
    holding_manage_farm_wood: 在河滩炊坊做水庭的订单
    holding_manage_farm_kiln: 在河滩炊坊做水庭的订单
    relief_path_first: 为农圃修第一段近路
    relief_path_finish: 为农圃打通第二段近路
    wait: 在这儿歇脚
    work_low: 在低城上工
    work_yard: 在旧站当班
    shop_fabricate_paving: 在工坊打制路石
    shop_purchase_ore: 在灰脊采购矿料
    shop_receive_ore: 往坊市仓里卸矿料
    crew_supper: 在工坊长桌吃饭
    tender_buy_ore: 在灰脊为合同备矿
    tender_unload_ore: 在坊市卸下合同矿料
    tender_pack_stones: 在工坊制石装箱
    tender_load_stones: 装车送往旧站
    tender_yard_advance: 在旧站验收第一箱路石
    tender_yard_payment: 在旧站验收并收货款
    tender_court_advance: 制作水庭的第一批路石
    tender_court_payment: 给水庭制石并收货款
    tender_hire: 在坊市领取工位津贴
    cross_market_out: 从灰脊穿门去低城
    cross_yard_out: 从灰脊穿门去旧站
  city_watch:
    signals:
    - {place: 低城水庭, when: world.low_food <= 8, text: 公共饭食紧张，晚到的人可能领不到。}
    - {place: 铁轨货场, when: world.yard_wages < 8, text: 旧站工钱见底，愿意接活的人还在等。}
    - {place: 坊市工坊, when: world.shop_open == 1 and world.market_ore < 2, text: 工坊缺矿料，下一批路石要等入仓。}
    - {place: 低城, when: world.shop_road == 1, text: 坊市到水庭的新路只需两分钟。}
    - {place: 灰脊, when: world.lockdown == 1, text: 货门限行已生效，跨城货运须另找陆路。}
    - {place: 坊市工坊, when: world.crew_table == 1, text: 工坊晚班有地方坐下来吃饭了。}
    events:
      gatebuild.resident_moved: 有人搬进了低城
      gatebuild.appointed: 工人接任新岗位
      gatebuild.opened: 新的门线贯通
      gatebuild.agreement: 城市改签通行约定
      gatebuild.shop_road_opened: 坊市短路竣工
      gatebuild.holding_opened: 新产业开业
      gatebuild.holding_network: 玩家的产业改变了路线或工艺
      gatebuild.holding_goods: 产业完成一笔交割
      gatebuild.holding_guest: 住客在高地驿舍付费
      gatebuild.holding_management: 炊坊委托有变动
      gatebuild.holding_managed_sale: 江遥为炊坊结算了一班
      gatebuild.crew_table: 工人在坊市支起长桌
      gatebuild.tender_signed: 工坊签下采购合同
      gatebuild.tender_hired: 工人从旧站来到坊市
      gatebuild.tender_delivery: 新合同交货
      gatebuild.tender_closed: 工坊完成合同
      gatebuild.tender_public_work: 城里用上了新路石
      gatebuild.relief_open: 水庭筹到本轮粮食
      gatebuild.relief_handout: 水庭开了公粮锅
      gatebuild.relief_path_commissioned: 低城发出两班修路委托
      gatebuild.relief_path_open: 农圃近路通了
      gatebuild.relief_supply: 供粮契约再次履行
      gatebuild.relief_path_supply: 近路完成一笔补给
      gatebuild.relief_charter: 水庭议事已有结果
      gatebuild.relief_path_use: 新路旁有了生意
      story.beat.activated: 城市有了新的进展
  chronicle_events:
  - world.created
  - gatebuild.opening
  - gatebuild.permit
  - gatebuild.terminal_fitted
  - gatebuild.terminal_reclaimed
  - gatebuild.terminal_retargeted
  - gatebuild.opened
  - gatebuild.bridge_ready
  - gatebuild.agreement
  - gatebuild.embargo_notice
  - gatebuild.resident_moved
  - gatebuild.appointed
  - resident.controller_changed
  - gatebuild.shop_opened
  - gatebuild.shop_staffed
  - gatebuild.shop_supply_arrived
  - gatebuild.shop_batch_sold
  - gatebuild.shop_dividend
  - gatebuild.shop_road_opened
  - gatebuild.holding_opened
  - gatebuild.holding_network
  - gatebuild.holding_goods
  - gatebuild.holding_guest
  - gatebuild.holding_management
  - gatebuild.holding_managed_sale
  - gatebuild.crew_table
  - gatebuild.tender_signed
  - gatebuild.tender_hired
  - gatebuild.tender_delivery
  - gatebuild.tender_closed
  - gatebuild.tender_public_work
  - gatebuild.relief_open
  - gatebuild.relief_handout
  - gatebuild.relief_path_commissioned
  - gatebuild.relief_path_open
  - gatebuild.relief_supply
  - gatebuild.relief_path_supply
  - gatebuild.relief_charter
  - gatebuild.relief_path_use
  - story.beat.activated
  - story.beat.completed
  - entity.created
  - world.change.rule
  player_summary_attributes:
  - integrity
  - stamina
  - hydration
  - satiety
  venture:
    title: 经营你的高地工坊
    purpose: 接单赚钱，雇人替你生产，再把商路接到下一座城。
    metrics:
    - {label: 随身现金, item: coin, suffix: ' 枚'}
    - {label: 已开门线, property: connected_count, suffix: ' 条'}
    - {label: 框架件, item: frame, suffix: ' 份', hide_when: shop_open}
    - {label: 工坊周转金, property: shop_cash, suffix: ' 枚', show_when: shop_open}
    - {label: 已结订单, property: shop_batches, suffix: ' 批', show_when: shop_open}
    - {label: 接单入账, property: shop_sales, suffix: ' 枚', show_when: shop_open}
    - {label: 已付成本, property: shop_spent, suffix: ' 枚', show_when: shop_open}
    - {label: 合同交货, property: tender_delivered, suffix: ' / 3', show_when: tender_mode}
    - {label: 准时奖还剩, property: tender_minutes, suffix: ' 分钟', show_when: tender_mode}
    - {label: 坊市待运, property: tender_yard_ready, suffix: ' 箱', show_when: tender_yard_ready}
  holdings:
    title: 你的产业
    summary: 卖货、供给自己的产业，或把产出投进工程。账上每枚城币等于一百分。
    metrics:
    - {label: 随身, item: coin, suffix: ' 枚', decimals: 2}
    - {label: 共同经营金, property: holding_fund, suffix: ' 枚', decimals: 2}
    - {label: 累计营业收入, property: holding_sales, suffix: ' 枚'}
    treasury_actions:
    - {id: holding_reinvest, label: 存一枚进经营账}
    - {id: holding_draw, label: 取一枚经营金}
    plots:
    - id: farm
      name: 河滩炊坊
      location: low_fields
      opened: holding_farm
      cost: 3
      description: 做饭，然后决定卖给水庭、远销旧站、自己吃，或养活驿舍。
      management:
        property: holding_farm_managed
        label: 江遥代管中
        detail: 水庭缺粮时可接班。水庭付六枚并留五枚周转，井水至少十八份。每班净入三枚五十分。每次可取一枚经营金，取后须留两枚。
      upgrade: holding_kiln
      upgrade_label: 改炉已完成 · 一炉五份，免燃料
      metrics:
      - {label: 待分配饭食, property: holding_food, suffix: ' 份'}
      - {label: 水庭公粮, property: low_food, suffix: ' 份'}
      - {label: 水庭采购账, property: low_wages, suffix: ' 枚'}
      - {label: 井水, property: low_water, suffix: ' 份'}
      - {label: 途中饭食, item: holding_food_crate, suffix: ' 份', when_nonzero: true}
      - {label: 已付代管工钱, property: holding_manager_wages, suffix: ' 枚', when_nonzero: true}
      - {label: 代管累计净利, property: holding_manager_profit, suffix: ' 枚', when_nonzero: true}
      build: {id: holding_open_farm, label: 开办河滩炊坊}
      actions:
      - {id: holding_hire_farm, label: 委托江遥经营炊坊, hide_when: holding_farm_managed}
      - {id: holding_pause_farm, label: 暂停江遥接单, show_when: holding_farm_managed}
      - {id: holding_cook, label: 开一炉饭}
      - {id: holding_deliver_court, label: 卖给水庭}
      - {id: holding_deliver_yard, label: 卖给旧站}
      - {id: holding_deliver_inn, label: 送进自己的驿舍, show_when: holding_inn}
      - {id: holding_take_meal, label: 领一份饭随身带}
      - {id: holding_unpack_food, label: 把在途饭食放回炊坊, when_item: holding_food_crate}
    - id: yard
      name: 旧站修具台
      location: old_station
      opened: holding_yard
      cost: 3
      description: 把矿料做成修具。可以卖掉周转，可以改炉、保养货门，也可以铺一条自己用得上的新路。
      upgrade: holding_road
      upgrade_label: 辙道已开通 · 农圃至旧站七分钟
      metrics:
      - {label: 修具在库, property: holding_tools, suffix: ' 件'}
      - {label: 旧站矿料, property: yard_ore, suffix: ' 份'}
      - {label: 随身修具, item: holding_kit, suffix: ' 件', when_nonzero: true}
      build: {id: holding_open_yard, label: 开办旧站修具台}
      actions:
      - {id: holding_forge, label: 做一件修具}
      - {id: holding_forge_pair, label: 一炉打两件修具}
      - {id: holding_sell_tool, label: 把修具卖给旧站}
      - {id: holding_bridge, label: 修农圃到旧站的辙道, hide_when: holding_road}
      - {id: holding_fit_kiln, label: 给炊坊改炉, show_when: holding_farm, hide_when: holding_kiln}
      - {id: holding_fix_gate, label: 用修具补低城的门, show_when: market_link}
    - id: inn
      name: 高地驿舍
      location: high_lodges
      opened: holding_inn
      cost: 2
      description: 在路上安个落脚点。备好饭，附近的居民会自己来付钱吃饭休息。
      metrics:
      - {label: 柜台饭食, property: holding_guest_food, suffix: ' 份'}
      - {label: 已接待, property: holding_guests, suffix: ' 人次'}
      build: {id: holding_open_inn, label: 开办高地驿舍}
      actions:
      - {id: holding_stock_inn, label: 把随身饭留在驿舍}
      - {id: holding_sleep, label: 在自己的驿舍歇脚}
  decision_report:
    show_when: relief_cases
    hide_when: relief_phase
    title: 上次议事已经结案
    event_types: [gatebuild.relief_path_supply, gatebuild.relief_supply, gatebuild.relief_path_use, gatebuild.relief_path_open, gatebuild.relief_charter]
    metrics:
    - {label: 公粮, property: low_food, suffix: ' 份'}
    - {label: 按约续供, property: relief_followups, suffix: ' 次'}
    - {label: 修路完工, property: relief_path_shifts, suffix: ' / 2 班', show_when: relief_work}
    - {label: 新路补给, property: relief_path_trades, suffix: ' 次', show_when: relief_path_use}
  spotlights:
    relief_source:
      desk: true
      stage: 筹粮
      blocker: 旧站需留十份饭。本地抢收需保留饮用水并备两份燃料。等公粮缺口改善前，也可以继续工坊业务。
      metrics:
      - {label: 低城公粮, property: low_food, suffix: ' 份'}
      - {label: 旧站饭食, property: yard_food, suffix: ' 份'}
      - {label: 低城薪金, property: low_wages, suffix: ' 枚'}
      - {label: 低城净水, property: low_water, suffix: ' 份'}
    relief_allocation:
      desk: true
      stage: 分粮
      metrics:
      - {label: 可拨储备, property: relief_food, suffix: ' 份'}
      - {label: 低城公粮, property: low_food, suffix: ' 份'}
    relief_charter:
      desk: true
      stage: 立约
      metrics:
      - {label: 剩余储备, property: relief_food, suffix: ' 份'}
      - {label: 农圃水量, property: farm_water, suffix: ' 份'}
      - {label: 低城薪金, property: low_wages, suffix: ' 枚'}
      - {label: 已修, property: relief_path_shifts, suffix: ' / 2 班', show_when: relief_work}
    relief_followup:
      desk: true
      stage: 新路经营
      metrics:
      - {label: 水庭净水, property: low_water, suffix: ' 份'}
      - {label: 工坊周转金, property: shop_cash, suffix: ' 枚'}
      - {label: 旧站矿料, property: yard_ore, suffix: ' 份'}
    tender_offer: {blocker: 水庭须预留十枚，旧站须有两枚工钱和十枚公共基金。查看公共账上的资金。}
    tender_active:
      metrics:
      - {label: 已验收, property: tender_delivered, suffix: ' / 3 批'}
      - {label: 坊市矿料, property: market_ore, suffix: ' 份'}
      - {label: 工坊周转金, property: shop_cash, suffix: ' 枚'}
    tender_final: {}
    tender_works: {}
    fix_market_yard: {}
    fix_yard_market: {}
    survey: {}
    bridge_works: {}
    choose: {blocker: 每对门端必须接向同一座城。配对还需要一枚门芯。可从施工点拆回未配对的门端。}
    charter: {}
    hire: {}
    raise_shop: {blocker: 开工坊需要两枚钱。先交付一份矿料，或在城里取得一笔工钱。}
    start_shop: {blocker: 工坊每批要两份矿料和一枚工钱。查看周转金，或待正在配送的原料入仓。}
    shop_yield: {blocker: 账上须留两枚周转金才能分红。铺路要攒够四份路石。}
    shop_roadworks: {blocker: 铺路要四份路石。可自加工一批，也可等班组交货。}
    shop_followup: {}
    shop_contract_maintenance: {}
ui_text: {travel_choice: '前往{name}', travel_summary: '沿当前道路前往{name}。', travel_time: '约 {minutes} 分钟', world_label: 城邦}
