context_properties:
  connected_count: 已建成门线
  trade_policy: 当前通行议约（1 共担维护，2 公开竞争，3 已发限行通知）
  embargo_countdown: 距货门限制生效的分钟数
  lockdown: 货门限制是否已经生效（1 已生效）
  relief_phase: 粮食议事是否仍开放（1 开着，0 结案）
  relief_policy: 长期供粮条款（1 两城互济，2 农圃补收）
  relief_path: 农圃近路是否竣工（1 已可走）
  relief_path_use: 新路去向（0 待议，1 农圃早摊，2 工坊备料）
  tender_mode: 当前合同（0 空闲，1 水庭，2 旧站）
  tender_hired: 姚齐是否已获坊市工位（1 已获）
  tender_irrigate: 农圃引水渠已通（1 已通）
  tender_resurface: 旧站装货道已通（1 已通）
source_context:
  gatebuild.holding_management: &holding_management
    events: [gatebuild.holding_management, gatebuild.holding_managed_sale, gatebuild.holding_opened, gatebuild.holding_network, gatebuild.relief_charter]
    properties:
      holding_farm_managed: 江遥是否受托经营炊坊（1 正在代管）
      holding_manager_wages: 已结算的炊坊代管工钱
      holding_manager_profit: 已结算的炊坊代管净利
      low_food: 水庭实际公粮库存
      low_wages: 水庭实际资金余额
      holding_inn: 高地驿舍是否营业（1 营业）
  gatebuild.holding_managed_sale: *holding_management
beats: []
