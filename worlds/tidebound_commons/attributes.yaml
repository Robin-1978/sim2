attributes:
- id: integrity
  kind: state
  label: 体力
  unit: '%'
  min: 0
  max: 100
  default: 100
  vital: true
  cost_mode: decrease
  prompt: 身体状况；降到 0 就会倒下。
- id: stamina
  kind: state
  label: 精力
  unit: '%'
  min: 0
  max: 100
  default: 88
  capacity: true
  cost_mode: decrease
  prompt: 赶路和重体力工作的短期余量，休息会缓慢恢复。
- id: hydration
  kind: need
  label: 水分
  unit: 点
  min: 0
  max: 100
  default: 78
  prompt: 0 表示严重脱水，100 表示水分充足。取水只是储备，只有喝水行为才会恢复水分。
- id: satiety
  kind: need
  label: 饱食
  unit: 点
  min: 0
  max: 100
  default: 70
  prompt: 0 表示饥饿，100 表示吃饱。生贝类只是食材，只有进食行为才会恢复饱食。
- id: belonging
  kind: need
  label: 归属
  unit: 点
  min: 0
  max: 100
  default: 58
  prompt: 与公社和同伴之间的连接感。
- id: purpose
  kind: need
  label: 意义
  unit: 点
  min: 0
  max: 100
  default: 62
  prompt: 对公共目标做出贡献的踏实感。
