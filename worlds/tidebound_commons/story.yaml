# Situation anchors are a zero-LLM narration fallback, not a plot branch.
# They never mutate state, unlock behavior or gate goals.  An emergent Story
# beat for the player always takes precedence; anchors only describe the
# current validated situation when no such beat exists.
# Situation anchors are only the opening safety net.  After this window the
# player chapter comes exclusively from agent-generated Story beats.
situation_anchor_window_minutes: 10080
situation_anchors:
- id: storm_watch
  title: 风暴季警戒
  summary: 潮门只剩两成多完整度，第一场风暴正在靠近。先测量，再决定材料用在哪儿。
  goal_hint: 测量潮门，并把完整性修到八成以上。
  trigger_events:
  - storm.watch_begun
- id: gate_ready
  title: 潮门已加固
  summary: 潮门完整性回到八成以上。接下来要看它能不能真的挡住风暴。
  goal_hint: 等风暴结算，或者趁余量补全海图。
  trigger_events:
  - tide_gate.ready
- id: storm_held
  title: 潮门守住了
  summary: 风暴过去，潮门没有失守。公社第一次证明，公开维护的代价能换来真实的安稳。
  goal_hint: 趁下一轮风暴前补全海图，或继续加固潮门。
  trigger_events:
  - storm.held
- id: storm_breached
  title: 潮门被撕开
  summary: 风暴撕开了潮门缺口。闸室还能站人，但下一次风暴会从同一个地方进来。
  goal_hint: 先补潮门，再谈海图和信号。
  trigger_events:
  - storm.breached
- id: storm_warning
  title: 风暴压力越过警戒线
  summary: 风暴压力已经越过警戒线。公社还能再修一次潮门，或先让居民休养；再拖下去，第一道缺口就会变成洪水。
  goal_hint: 先确认潮门完整性，再决定今天是否抢修。
  trigger_events:
  - storm.warning
- id: rain_catcher_working
  title: 集雨器开始工作
  summary: 工坊屋顶的集雨器把雨水引进储水槽。公社第一次有了不靠沼泽也能补充的淡水。
  goal_hint: 趁淡水有余量，补全海图或校准信号。
  trigger_events:
  - rainwater.harvested
- id: outer_route_reopened
  title: 外海航路重开
  summary: 季节信号越过海面，另一处聚落沿着低潮通道抵达公社。第一季的公共维护没有白付。
  goal_hint: 第一季结束；世界会继续运行，下一轮风暴季仍需要有人维护潮门和集雨器。
  trigger_events:
  - signal.route_open
- id: storm_flooded
  title: 潮水进了码头
  summary: 风暴潮越过失守的潮门，码头和粮仓进了水。公社必须先把潮门修到能挡水。
  goal_hint: 从最低处开始修复，别让下一场风暴再灌进来。
  trigger_events:
  - storm.flooded
# A configured ending is a read-only epilogue card.  It does not stop the
# world: the next storm cycle and generated Story beats continue to run.
endings:
- id: outer_route_reopened
  title: 第一季：外海航路重开
  summary: 季节信号越过海面，另一处聚落沿着低潮通道抵达公社。潮门、集雨器和公共工具架一起撑过了第一季；接下来是下一轮风暴季。
  goal_hint: 第一季已完成。世界继续运行：守住下一轮风暴，补全海图，或让新来的聚落加入公共维护。
  condition: world.signal_reach >= 0.7
  trigger_event: signal.route_open
  kind: ending
  stats:
  - {property: tide_gate_integrity, label: 潮门完整性}
  - {property: public_confidence, label: 公共信心}
  - {property: signal_reach, label: 信号覆盖}
  - {property: storm_cycle, label: 风暴轮次}
# Story chapters are not pre-authored here.  The Story Agent receives verified
# source events and proposes emergent beats from those facts.  Keeping this list
# empty prevents the runtime from cycling through a fixed plot after the first
# few discoveries.
beats: []
