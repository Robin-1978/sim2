behavior_trees:
- id: inspect_gate
  agent_label: 测量潮门
  summary: 测量潮门
  description: 在投入公共材料之前，先确认闸门的真实受损程度。
  entry_conditions:
  - actor.can_inspect
  - actor.alive
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 31
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: gatehouse
  - type: action
    action_id: inspect_object
    parameters:
      object_id: tide_gate
  success_results:
  - inspection_completed
  failure_results:
  - denied
  - interrupted
  outcome_events:
  - event_type: gate.measurement_recorded
    summary: 一次实地测量被记入公社的维护账目。
  goal_tags:
  - infrastructure
  - safety
  drive_tags:
  - purpose
  - belonging
- id: repair_gate
  agent_label: 修复潮门
  summary: 修复潮门
  description: 带着修理工具包赶到闸室，把材料真正用在缺口上。
  entry_conditions:
  - actor.can_repair
  - actor.alive
  - actor.inventory.repair_kit >= 1
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 77
  cooldown_minutes: 720
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: gatehouse
  - type: action
    action_id: repair_tide_gate
    parameters: {}
  success_results:
  - tide_gate_repaired
  failure_results:
  - repair_failed
  - interrupted
  outcome_events:
  - event_type: tide_gate.repaired
    summary: 一个修理工具包被消耗，潮门完整性上升。
  goal_tags:
  - repair
  - safety
  - public
  drive_tags:
  - purpose
  - belonging
- id: tune_signal
  agent_label: 校准季节信号
  summary: 校准季节信号
  description: 在潮门能撑住之后，用工具包重新校准屋顶的信号透镜。
  entry_conditions:
  - actor.can_repair
  - actor.alive
  - actor.inventory.repair_kit >= 1
  - world.tide_gate_integrity >= 0.56
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 62
  cooldown_minutes: 720
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: gatehouse
  - type: action
    action_id: tune_signal
    parameters: {}
  success_results:
  - signal_tuned
  failure_results:
  - tuning_failed
  - interrupted
  outcome_events:
  - event_type: signal.tuned
    summary: 一个修理工具包被消耗，季节信号透镜重新校准。
  goal_tags:
  - signal
  - route
  drive_tags:
  - purpose
  - belonging
- id: gather_water
  agent_label: 取淡水
  summary: 取淡水
  description: 从沼泽水洼带回两份可再生淡水。
  purpose: 把淡水带在身上备用；取水本身不会恢复水分。
  entry_conditions:
  - actor.can_gather
  - actor.alive
  estimated_minutes: 95
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: marsh_edge
  - type: action
    action_id: gather_resource
    parameters:
      resource_tag: fresh_water
      location_id: marsh_edge
  success_results:
  - resource_collected
  failure_results:
  - resource_empty
  - gathering_failed
  outcome_events:
  - event_type: resource.gathered
    summary: 淡水从沼泽水洼被真正取回。
    data:
      resource_id: fresh_water
      result_kind: water_collected
  goal_tags:
  - water
  - supply
  drive_tags:
  - purpose
  supports_drive_tags:
  - hydration
- id: gather_shellfish
  agent_label: 采贝类
  summary: 采贝类
  description: 在不采空贝滩的前提下，带回一小筐贝类。
  purpose: 贝类是腌制口粮的原料；生吃贝类不会恢复饱食。
  entry_conditions:
  - actor.can_gather
  - actor.alive
  - actor.need.hydration > 40
  estimated_minutes: 95
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: marsh_edge
  - type: action
    action_id: gather_resource
    parameters:
      resource_tag: shellfish
      location_id: marsh_edge
  success_results:
  - resource_collected
  failure_results:
  - resource_empty
  - gathering_failed
  outcome_events:
  - event_type: resource.gathered
    summary: 贝类从可再生贝滩被真正采回。
    data:
      resource_id: shellfish
      result_kind: food_material_collected
  goal_tags:
  - food
  - supply
  drive_tags:
  - purpose
  supports_drive_tags:
  - satiety
- id: gather_driftwood
  agent_label: 打捞浮木
  summary: 打捞浮木
  description: 趁退潮在码头收集还能用的浮木。
  entry_conditions:
  - actor.can_gather
  - actor.alive
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 80
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: commons_quay
  - type: action
    action_id: gather_resource
    parameters:
      resource_tag: driftwood
      location_id: commons_quay
  success_results:
  - resource_collected
  failure_results:
  - resource_empty
  - gathering_failed
  outcome_events:
  - event_type: resource.gathered
    summary: 浮木被捞起，真正进入某位居民的随身物品。
    data:
      resource_id: driftwood
      result_kind: repair_material_collected
  goal_tags:
  - repair
  - supply
  drive_tags:
  - purpose
  - belonging
- id: gather_reed
  agent_label: 收割芦苇
  summary: 收割芦苇
  description: 从浅滩割下两份芦苇，留出下一季重新长高的余地。
  purpose: 芦苇是搓绳的原料；芦苇本身不能直接当饭吃。
  entry_conditions:
  - actor.can_gather
  - actor.alive
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 95
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: marsh_edge
  - type: action
    action_id: gather_resource
    parameters:
      resource_tag: marsh_reed
      location_id: marsh_edge
  success_results:
  - resource_collected
  failure_results:
  - resource_empty
  - gathering_failed
  outcome_events:
  - event_type: resource.gathered
    summary: 芦苇被割下并带进随身物品。
    data:
      resource_id: marsh_reed
      result_kind: reed_collected
  goal_tags:
  - repair
  - supply
  drive_tags:
  - purpose
- id: craft_repair_kit
  agent_label: 制作修理工具包
  summary: 制作修理工具包
  description: 在工坊用两块浮木和一段芦苇绳做出一个修理工具包。
  entry_conditions:
  - actor.can_craft
  - actor.alive
  - recipe.available
  - inputs.available
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 75
  cooldown_minutes: 720
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: workshop
  - type: action
    action_id: craft_recipe
    parameters:
      recipe_id: repair_kit
      station_id: context.station_id
  success_results:
  - recipe_completed
  failure_results:
  - crafting_failed
  - interrupted
  outcome_events:
  - event_type: repair_kit.crafted
    summary: 一个修理工具包由随身材料制成。
  goal_tags:
  - crafting
  - repair
  drive_tags:
  - purpose
  - belonging
- id: craft_rope
  agent_label: 搓制芦苇绳
  summary: 搓制芦苇绳
  description: 在工坊把两份芦苇搓成一段结实的绳子。
  purpose: 芦苇绳是修理工具包的中间材料，不能直接用于修复潮门。
  entry_conditions:
  - actor.can_craft
  - actor.alive
  - recipe.available
  - inputs.available
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 55
  cooldown_minutes: 240
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: workshop
  - type: action
    action_id: craft_recipe
    parameters:
      recipe_id: reed_rope
      station_id: context.station_id
  success_results:
  - recipe_completed
  failure_results:
  - crafting_failed
  - interrupted
  outcome_events:
  - event_type: rope.crafted
    summary: 一段芦苇绳被搓好并放进随身物品。
  goal_tags:
  - crafting
  - repair
  drive_tags:
  - purpose
- id: craft_rations
  agent_label: 腌制海藻口粮
  summary: 腌制海藻口粮
  description: 用贝类和淡水做成三份随身口粮。
  purpose: 用随身材料腌制口粮；吃口粮是另一个独立行为。
  entry_conditions:
  - actor.can_craft
  - actor.alive
  - recipe.available
  - inputs.available
  - actor.need.hydration > 40
  estimated_minutes: 60
  cooldown_minutes: 360
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: workshop
  - type: action
    action_id: craft_recipe
    parameters:
      recipe_id: preserved_rations
      station_id: context.station_id
  success_results:
  - recipe_completed
  failure_results:
  - crafting_failed
  - interrupted
  outcome_events:
  - event_type: rations.preserved
    summary: 三份口粮由随身材料腌制完成。
  goal_tags:
  - crafting
  - food
  drive_tags:
  - purpose
  - belonging
  supports_drive_tags:
  - satiety
- id: research_chart
  agent_label: 研究沉没海图
  summary: 研究沉没海图
  description: 推进观测台海图的下一个开放阶段。
  no_op_travel_minutes: 0
  parameter_defaults:
    source_id: drowned_chart
  agent_parameters:
    source_id:
      type: string
      required: true
      max_length: 120
      description: 可见研究来源的准确名称。
  entry_conditions:
  - actor.can_research
  - actor.alive
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 121
  cooldown_minutes: 720
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.source_location_id
  - type: action
    action_id: research_source
    parameters:
      source_id: context.source_id
  success_results:
  - research_completed
  failure_results:
  - failed
  - interrupted
  goal_tags:
  - research
  - route
  drive_tags:
  - purpose
- id: explore_observatory
  agent_label: 勘察沉没观测台
  summary: 勘察沉没观测台
  description: 带上一份口粮，测绘观测台下一段暴露的结构。
  entry_conditions:
  - actor.can_explore
  - actor.alive
  - actor.inventory.food_ration >= 1
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 153
  cooldown_minutes: 720
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: drowned_observatory
  - type: action
    action_id: explore_area
    parameters:
      area_id: drowned_observatory
  success_results:
  - exploration_completed
  failure_results:
  - failed
  - interrupted
  goal_tags:
  - exploration
  - route
  drive_tags:
  - purpose
- id: communicate
  agent_label: 交换公社情报
  summary: 交换公社情报
  description: 把一条有依据的观察或请求告诉另一位居民。
  entry_conditions:
  - actor.can_speak
  - actor.alive
  - target.available
  - actor.need.hydration > 40
  - actor.need.satiety > 40
  estimated_minutes: 15
  cooldown_minutes: 240
  agent_parameters:
    topic:
      type: string
      required: true
      max_length: 120
      description: 一个基于当前事实的具体话题。
    message:
      type: string
      required: true
      max_length: 240
      description: 两句基于已观察事件的简洁消息。
  nodes:
  - type: action
    action_id: communicate
    parameters:
      target_id: context.target_id
      topic: context.topic
      message: context.message
  success_results:
  - dialogue_recorded
  failure_results:
  - conversation_refused
  - participant_left
  outcome_events:
  - event_type: commons.conversation_completed
    summary: 一位居民向另一位居民分享了一条有依据的观察。
  goal_tags:
  - coordination
  - belonging
  drive_tags:
  - belonging
  - purpose
- id: eat_ration
  agent_label: 吃一份口粮
  summary: 吃一份口粮
  description: 吃下一份随身口粮，立刻恢复饱食。
  purpose: 现在吃一份随身口粮，恢复饱食。
  entry_conditions:
  - actor.alive
  - actor.inventory.food_ration >= 1
  - actor.need.satiety <= context.satiety_alert_threshold
  estimated_minutes: 5
  nodes:
  - type: action
    action_id: eat_ration
    parameters:
      item_id: context.food_item
  success_results:
  - ration_eaten
  failure_results:
  - eating_failed
  kind: fallback
  goal_tags:
  - food
  - recovery
  drive_tags:
  - satiety
- id: drink_water
  agent_label: 喝一份淡水
  summary: 喝一份淡水
  description: 喝下一份随身淡水，立刻恢复水分。
  purpose: 现在喝一份随身淡水，恢复水分。
  entry_conditions:
  - actor.alive
  - actor.inventory.fresh_water >= 1
  - actor.need.hydration <= context.hydration_alert_threshold
  estimated_minutes: 5
  nodes:
  - type: action
    action_id: drink_water
    parameters:
      item_id: context.water_item
  success_results:
  - water_drunk
  failure_results:
  - drinking_failed
  kind: fallback
  goal_tags:
  - water
  - recovery
  drive_tags:
  - hydration
- id: travel
  agent_label: 移动
  summary: 移动
  description: 沿已知路线前往一个相连的地点。
  entry_conditions:
  - actor.alive
  estimated_minutes: 1
  agent_parameters:
    location_id:
      type: string
      required: true
      max_length: 120
      description: 从当前路线列表中选择一个相连的已知地点。
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  success_results:
  - arrived
  failure_results:
  - route_unknown
  - blocked
  goal_tags:
  - movement
  drive_tags:
  - autonomy
