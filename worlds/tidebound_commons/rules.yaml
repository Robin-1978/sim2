vital_attribute: integrity
capacity_attribute: stamina
research_default_required: 2
incapacitation:
  recovery:
    after_minutes: 720
    vital_fraction: 0.25
fallback_behavior_ids:
- eat_ration
- drink_water
- gather_water
- communicate
- gather_driftwood
- craft_rations
- craft_repair_kit
location_tag_groups:
  safe:
  - safe
  resource_node:
  - resource
capability_aliases:
  inspect:
  - stewardship
  repair:
  - stewardship
  gather:
  - gathering
  craft:
  - crafting
  research:
  - research
  explore:
  - exploration
  speak:
  - conversation
context_values:
  water_item: fresh_water
  food_item: food_ration
  station_id: workshop
  hydration_alert_threshold: 45
  satiety_alert_threshold: 45
item_groups:
  water:
  - fresh_water
  food:
  - food_ration
item_labels:
  fresh_water: 淡水
  food_ration: 海藻口粮
  shellfish: 贝类
  driftwood: 浮木
  marsh_reed: 芦苇
  repair_kit: 修理工具包
  reed_rope: 芦苇绳
world_property_labels:
  tide_gate_integrity: {label: 潮门完整性, unit: percent, max: 1}
  signal_reach: {label: 信号覆盖, unit: percent, max: 1}
  fresh_water_reserve: {label: 淡水储备, unit: amount}
  maintenance_evidence: {label: 维护记录, unit: amount, max: 3}
  storm_pressure: {label: 风暴压力, unit: percent, max: 1}
  storm_eta_hours: {label: 风暴倒计时, unit: hours, max: 48, alert: true}
  public_confidence: {label: 公共信心, unit: percent, max: 1}
  public_decision_open: {label: 公共决策窗口, unit: bool, hidden: true}
context_resolvers: {}
travel:
  minutes_per_distance: 24
  default_speed: 1
resource_regeneration:
- resource_id: fresh_water
  every_minutes: 360
  amount: 8
  cap: 30
- resource_id: shellfish
  every_minutes: 360
  amount: 10
  cap: 36
- resource_id: driftwood
  every_minutes: 480
  amount: 6
  cap: 28
- resource_id: marsh_reed
  every_minutes: 360
  amount: 8
  cap: 30
resource_safety:
- resource_id: fresh_water
  minimum_reserve: 8
  repeat_every_minutes: 360
  event_type: resource.safety_low
resource_property_projections:
  fresh_water: fresh_water_reserve
world_rules:
- id: gate_ready
  condition: world.tide_gate_integrity >= 0.8
  effect: tide_gate.ready
  event_type: tide_gate.ready
  wake:
  - story
  - god
  description: 潮门完整性已足以支撑一条更安全的路线。
- id: signal_route_open
  condition: world.signal_reach >= 0.7
  effect: signal.route_open
  event_type: signal.route_open
  wake:
  - story
  - god
  description: 稳定的信号可以为另一处聚落指路，让他们抵达公社。
- id: storm_warning
  condition: world.storm_pressure >= 0.7
  effect: storm.warning
  event_type: storm.warning
  wake:
  - story
  - god
  description: 风暴压力越过警戒线，公社必须公开回应。
capability_progression:
  stewardship:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  gathering:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  crafting:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  research:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  exploration:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  conversation:
    minimum_completed_outcomes: 4
    max_delta: 0.08
    max_value: 1.0
needs:
- id: hydration
  target: 72
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: satiety
  target: 70
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: belonging
  target: 68
  minimum: 0
  gamma: 1.3
  critical_threshold: 0.5
  critical_gain: 1.0
- id: purpose
  target: 70
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.5
  critical_gain: 1.0
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - safety_and_uncertainty
  - sustenance
  - relatedness
  - competence
  - meaning_and_goal_progress
minute_effects:
- id: stamina_recovery
  scope: agent
  every_minutes: 1
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.45
    maximum: 100
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.03
  events:
  - id: hydration_low
    event_type: need.hydration_low
    condition: actor.need.hydration <= context.hydration_alert_threshold
    edge: enter
    trend: true
    summary: 水分跌破饮水警戒线。
    data:
      need: hydration
      threshold: 45
      signal_only: true
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.025
  events:
  - id: satiety_low
    event_type: need.satiety_low
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: enter
    trend: true
    summary: 饱食跌破进食警戒线。
    data:
      need: satiety
      threshold: 45
      signal_only: true
- id: belonging_decay
  scope: agent
  every_minutes: 20
  effect:
    type: need_delta
    need: belonging
    delta: -0.01
- id: purpose_decay
  scope: agent
  every_minutes: 30
  effect:
    type: need_delta
    need: purpose
    delta: -0.01
- id: storm_clock
  scope: world
  every_minutes: 1
  effect:
    type: world_property_delta
    property: storm_eta_hours
    delta: -0.0166666667
    minimum: 0
- id: storm_pressure_rises
  scope: world
  every_minutes: 60
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: 0.002
    maximum: 1
- id: storm_floods_the_quay
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity < 0.2
  effect:
    type: world_property_delta
    property: public_confidence
    delta: -0.22
    minimum: 0
  event_type: storm.flooded
  event_summary: 风暴潮越过失守的潮门，码头和粮仓进水，公社的信心明显动摇。
  event_data:
    severity: flooded
- id: storm_breaches_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.tide_gate_integrity < 0.8
  effect:
    type: world_property_delta
    property: tide_gate_integrity
    delta: -0.16
    minimum: 0
  event_type: storm.breached
  event_summary: 风暴撕开了潮门缺口。闸室还能站人，但下一次风暴会更危险。
  event_data:
    severity: breached
- id: storm_holds_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.8
  effect:
    type: world_property_delta
    property: public_confidence
    delta: 0.05
    maximum: 1
  event_type: storm.held
  event_summary: 潮门扛住了风暴。公社第一次证明，公开维护的代价没有白付。
  event_data:
    severity: held
- id: storm_pressure_falls
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: -0.7
    minimum: 0.3
- id: storm_clock_resets
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effect:
    type: world_property_delta
    property: storm_eta_hours
    delta: 48
    maximum: 48
- id: public_decision_opens
  scope: world
  every_minutes: 1440
  condition: world.public_decision_open < 1
  effect:
    type: world_property_delta
    property: public_decision_open
    delta: 1
    maximum: 1
  event_type: public_decision.due
  event_summary: 新的一天开始。公社需要做一次公共决定：收紧配给、优先抢修潮门，还是让沼泽和居民休养。
  event_data:
    decision: open
- id: hydration_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.hydration <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: dehydration_damage
    event_type: need.hydration_damage
    edge: each
    trend: true
    summary: 严重脱水正在损害一位居民。
    data:
      need: hydration
      threshold: 5
      attribute: integrity
      delta: -1
- id: hunger_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: hunger_damage
    event_type: need.hunger_damage
    edge: each
    trend: true
    summary: 严重饥饿正在损害一位居民。
    data:
      need: satiety
      threshold: 5
      attribute: integrity
      delta: -1
memory_quality:
  semantic_similarity:
    enabled: false
social_credibility:
  base: 0.5
  trust_weight: 0.35
  reputation_weight: 0.15
  trust_relations:
  - trust
  reputation_attribute: reputation
  reputation_min: -100
  reputation_max: 100
civilization_progress:
  safe_channel_knowledge:
    required: 2
    evidence_value: 2
    description: 两个被验证的海图阶段会形成关于低潮安全通道的公共知识。
    evidence_event_types:
    - research.completed
    evidence_behaviors:
    - research_chart
    wake:
    - story
    - god
progression:
- id: daily_public_decision
  label: 今天的公共决策
  summary: 配给、抢修或休养——今天只能选一件，明早才会重新开启。
  priority: 0.97
  audience:
  - player
  visible_when: world.public_decision_open >= 1
  target_behaviors:
  - ration_today
  - repair_priority_today
  - marsh_rest_today
  support_behaviors: []
- id: steward_first_rope
  label: 搓出第一段公共用绳
  summary: 用两份芦苇搓一段绳子；它会成为下一只修理工具包的骨架。
  priority: 0.945
  audience:
  - player
  origins:
  - steward
  target_behaviors:
  - craft_rope
  support_behaviors:
  - gather_reed
  complete_when:
    event_type: rope.crafted
    self_only: true
    count: 1
- id: forager_first_haul
  label: 带回第一篓贝类
  summary: 去浅滩采两份贝类，让公社看见沼泽还能稳定供食。
  priority: 0.945
  audience:
  - player
  origins:
  - forager
  target_behaviors:
  - gather_shellfish
  support_behaviors: []
  complete_when:
    event_type: resource.gathered
    self_only: true
    match:
      resource_id: shellfish
    count: 1
- id: chart_keeper_first_stage
  label: 验证海图的第一个阶段
  summary: 完成一次研究，让半张海图变成别人也能复核的记录。
  priority: 0.945
  audience:
  - player
  origins:
  - chart_keeper
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    self_only: true
    match:
      source_id: drowned_chart
    count: 1
- id: ferry_runner_first_message
  label: 把倒计时送到第一位住户
  summary: 找一位居民交换消息，让风暴倒计时不只停在码头。
  priority: 0.945
  audience:
  - player
  origins:
  - ferry_runner
  target_behaviors:
  - communicate
  support_behaviors: []
  complete_when:
    event_type: dialogue.recorded
    self_only: true
    count: 1
- id: inspect_tide_gate
  label: 测量潮门
  summary: 先确认潮门的真实状况，为公共修复建立第一条可靠证据。
  priority: 0.95
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - inspect_gate
  support_behaviors: []
  complete_when:
    event_type: gate.inspected
    count: 1
- id: hold_the_first_storm
  label: 让潮门撑过第一场风暴
  summary: 在倒计时结束前把潮门加固到八成以上；只修一次只能挡水，撑不住风暴。
  priority: 0.94
  audience:
  - player
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: storm.held
    count: 1
- id: repair_tide_gate
  label: 修复潮门
  summary: 把采集到的材料做成工具包，真正用在潮门缺口上。
  priority: 0.92
  audience:
  - player
  - 玛拉
  - 塞琳
  - 伊沃
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: tide_gate.repaired
    count: 1
- id: complete_drowned_chart
  label: 补全沉没海图
  summary: 在有人真正沿着海图走进沼泽之前，验证两个阶段。
  priority: 0.88
  audience:
  - player
  - 塞琳
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    match:
      source_id: drowned_chart
    distinct_by:
    - stage_id
    count: 2
- id: tune_seasonal_signal
  label: 校准季节信号
  summary: 利用修好的潮门和省下的工具包，把信号送出海岸。
  priority: 0.82
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - tune_signal
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: signal.tuned
    count: 2
- id: reopen_outer_route
  label: 重开外海航路
  summary: 在公社决定走向外海之前，把公共信号推到配置阈值。
  priority: 0.76
  audience:
  - player
  - 玛拉
  - 伊沃
  - 塞琳
  - 塔罗
  target_behaviors: []
  support_behaviors:
  - tune_signal
  complete_when:
    event_type: signal.route_open
    count: 1
