  conversation:
    minimum_completed_outcomes: 4
    max_delta: 0.08
    max_value: 1.0
needs:
- id: hydration
  target: 72
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: satiety
  target: 70
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: belonging
  target: 68
  minimum: 0
  gamma: 1.3
  critical_threshold: 0.5
