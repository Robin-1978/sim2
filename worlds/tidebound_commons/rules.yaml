  body: 潮门只剩两成多，第一场风暴正在靠近。先确认缺口，再决定今天的材料。
  when: world.maintenance_evidence < 1
  action_ref: behavior:inspect_gate
  goal_id: inspect_tide_gate
- id: first_decision
  title: 今天的公共决定
  body: 配给、抢修或休养，今天只能选一件；明早才会重新开启。
  when: world.maintenance_evidence >= 1 and world.public_decision_open >= 1
  goal_id: daily_public_decision
- id: brace_the_gate
  title: 把潮门修到八成
  body: 只修一次只能挡水。撑过风暴需要把完整性推到 80% 以上。
  when: world.maintenance_evidence >= 1 and world.public_decision_open < 1 and world.tide_gate_integrity < 0.8
  action_ref: behavior:repair_gate
  goal_id: hold_the_first_storm
- id: wait_for_storm
