vital_attribute: integrity
capacity_attribute: stamina
research_default_required: 2
incapacitation:
  recovery:
    after_minutes: 720
    vital_fraction: 0.25
fallback_behavior_ids:
- eat_ration
- drink_water
- gather_water
- communicate
- gather_driftwood
- craft_rations
- craft_repair_kit
location_tag_groups:
  safe:
  - safe
  resource_node:
  - resource
capability_aliases:
  inspect:
  - stewardship
  repair:
  - stewardship
  gather:
  - gathering
  craft:
  - crafting
  research:
  - research
  explore:
  - exploration
  speak:
  - conversation
context_values:
  water_item: fresh_water
  food_item: food_ration
  station_id: workshop
  hydration_alert_threshold: 45
  satiety_alert_threshold: 45
item_groups:
  water:
  - fresh_water
  food:
  - food_ration
item_labels:
  fresh_water: 淡水
  food_ration: 海藻口粮
  shellfish: 贝类
  driftwood: 浮木
  marsh_reed: 芦苇
  repair_kit: 修理工具包
  reed_rope: 芦苇绳
world_property_labels:
  tide_gate_integrity: {label: 潮门完整性, unit: percent, max: 1}
  signal_reach: {label: 信号覆盖, unit: percent, max: 1}
  fresh_water_reserve: {label: 淡水储备, unit: amount}
  maintenance_evidence: {label: 维护记录, unit: amount, max: 3}
  storm_pressure: {label: 风暴压力, unit: percent, max: 1}
  storm_eta_hours: {label: 风暴倒计时, unit: hours, max: 48, alert: true}
  public_confidence: {label: 公共信心, unit: percent, max: 1}
  public_decision_open: {label: 公共决策窗口, unit: bool, hidden: true}
  decision_rationing: {label: 昨日配给, unit: bool, hidden: true}
  decision_repair: {label: 昨日抢修, unit: bool, hidden: true}
  decision_rest: {label: 昨日休养, unit: bool, hidden: true}
context_resolvers: {}
travel:
  minutes_per_distance: 24
  default_speed: 1
context_limits:
  default_chars: 16000
  default_tokens: 6000
  roles:
    agent_decision:
      max_chars: 15000
      max_tokens: 5500
    god:
      max_chars: 24000
      max_tokens: 9000
    story:
      max_chars: 22000
      max_tokens: 8000
resource_regeneration:
- resource_id: fresh_water
  every_minutes: 360
  amount: 8
  cap: 30
- resource_id: shellfish
  every_minutes: 360
  amount: 10
  cap: 36
- resource_id: driftwood
  every_minutes: 480
  amount: 6
  cap: 28
- resource_id: marsh_reed
  every_minutes: 360
  amount: 8
  cap: 30
resource_safety:
- resource_id: fresh_water
  minimum_reserve: 8
  repeat_every_minutes: 360
  event_type: resource.safety_low
resource_property_projections:
  fresh_water: fresh_water_reserve
world_rules:
- id: gate_ready
  condition: world.tide_gate_integrity >= 0.8
  effect: tide_gate.ready
  event_type: tide_gate.ready
  wake:
  - story
  - god
  description: 潮门完整性已足以支撑一条更安全的路线。
- id: signal_route_open
  condition: world.signal_reach >= 0.7
  effect: signal.route_open
  event_type: signal.route_open
  wake:
  - story
  - god
  description: 稳定的信号可以为另一处聚落指路，让他们抵达公社。
- id: storm_warning
  condition: world.storm_pressure >= 0.7
  effect: storm.warning
  event_type: storm.warning
  wake:
  - story
  - god
  description: 风暴压力越过警戒线，公社必须公开回应。
onboarding:
- id: first_measurement
  title: 先测量潮门
  body: 潮门只剩两成多，第一场风暴正在靠近。先确认缺口，再决定今天的材料。
  when: world.maintenance_evidence < 1
  action_ref: behavior:inspect_gate
  goal_id: inspect_tide_gate
- id: first_decision
  title: 今天的公共决定
  body: 配给、抢修或休养，今天只能选一件；明早才会重新开启。
  when: world.maintenance_evidence >= 1 and world.public_decision_open >= 1
  goal_id: daily_public_decision
- id: brace_the_gate
  title: 把潮门修到八成
  body: 只修一次只能挡水。撑过风暴需要把完整性推到 80% 以上。
  when: world.maintenance_evidence >= 1 and world.public_decision_open < 1 and world.tide_gate_integrity < 0.8
  action_ref: behavior:repair_gate
  goal_id: hold_the_first_storm
- id: wait_for_storm
  title: 等待第一场风暴
  body: 潮门已经加固到八成以上。风暴会检验它是否真的守得住。
  when: world.tide_gate_integrity >= 0.8 and world.storm_eta_hours > 0
  goal_id: hold_the_first_storm
progression:
  stewardship:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  gathering:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  crafting:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  research:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  exploration:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  conversation:
    minimum_completed_outcomes: 4
    max_delta: 0.08
    max_value: 1.0
needs:
- id: hydration
  target: 72
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: satiety
  target: 70
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.4
  critical_gain: 1.0
- id: belonging
  target: 68
  minimum: 0
  gamma: 1.3
  critical_threshold: 0.5
  critical_gain: 1.0
- id: purpose
  target: 70
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.5
  critical_gain: 1.0
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - safety_and_uncertainty
  - sustenance
  - relatedness
  - competence
  - meaning_and_goal_progress
minute_effects:
- id: stamina_recovery
  scope: agent
  every_minutes: 1
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.45
    maximum: 100
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.03
  events:
  - id: hydration_low
    event_type: need.hydration_low
    condition: actor.need.hydration <= context.hydration_alert_threshold
    edge: enter
    trend: true
    summary: 水分跌破饮水警戒线。
    data:
      need: hydration
      threshold: 45
      signal_only: true
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.025
  events:
  - id: satiety_low
    event_type: need.satiety_low
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: enter
    trend: true
    summary: 饱食跌破进食警戒线。
    data:
      need: satiety
      threshold: 45
      signal_only: true
- id: belonging_decay
  scope: agent
  every_minutes: 20
  effect:
    type: need_delta
    need: belonging
    delta: -0.01
- id: purpose_decay
  scope: agent
  every_minutes: 30
  effect:
    type: need_delta
    need: purpose
    delta: -0.01
- id: storm_clock
  scope: world
  every_minutes: 1
  effect:
    type: world_property_delta
    property: storm_eta_hours
    delta: -0.0166666667
    minimum: 0
- id: storm_pressure_rises
  scope: world
  every_minutes: 60
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: 0.002
    maximum: 1
- id: storm_floods_the_quay
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity < 0.2
  effects:
  - {type: world_property_delta, property: public_confidence, delta: -0.22, minimum: 0}
  - {type: world_resource_delta, resource_id: driftwood, delta: -8, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: -6, minimum: 0}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: false}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: 风暴潮淹没了码头}
  event_type: storm.flooded
  event_summary: 风暴潮越过失守的潮门，码头和粮仓进水，公社的信心明显动摇。
  event_data:
    severity: flooded
- id: storm_breaches_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.tide_gate_integrity < 0.8
  effects:
  - {type: world_property_delta, property: tide_gate_integrity, delta: -0.16, minimum: 0}
  - {type: world_resource_delta, resource_id: shellfish, delta: -10, minimum: 0}
  - {type: world_resource_delta, resource_id: marsh_reed, delta: -8, minimum: 0}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: false}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: 潮沟被风暴撕开}
  event_type: storm.breached
  event_summary: 风暴撕开了潮门缺口。闸室还能站人，但下一次风暴会更危险。
  event_data:
    severity: breached
- id: storm_holds_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.8
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.05, maximum: 1}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: true}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: ""}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: true}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: ""}
  event_type: storm.held
  event_summary: 潮门扛住了风暴。公社第一次证明，公开维护的代价没有白付。
  event_data:
    severity: held
- id: storm_pressure_falls
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: -0.7
    minimum: 0.3
- id: storm_clock_resets
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effect:
    type: world_property_delta
    property: storm_eta_hours
    delta: 48
    maximum: 48
- id: aftermath_rationing
  scope: world
  every_minutes: 1440
  condition: world.decision_rationing >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: -0.02, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: 2, maximum: 30}
  - {type: world_property_delta, property: decision_rationing, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 昨天的配给让淡水留住了，但住户开始私下抱怨份量。
  event_data:
    decision: rationing
- id: aftermath_repair
  scope: world
  every_minutes: 1440
  condition: world.decision_repair >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.01, maximum: 1}
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.02, maximum: 1}
  - {type: world_property_delta, property: decision_repair, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 昨天的抢修让闸室多撑了一段，公社今天谈起它时语气缓和了一些。
  event_data:
    decision: repair_priority
- id: aftermath_rest
  scope: world
  every_minutes: 1440
  condition: world.decision_rest >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.02, maximum: 1}
  - {type: world_resource_delta, resource_id: shellfish, delta: 4, maximum: 36}
  - {type: world_resource_delta, resource_id: marsh_reed, delta: 4, maximum: 30}
  - {type: world_property_delta, property: decision_rest, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 沼泽休养了一天后，浅滩的贝类和芦苇恢复了一些，人心也松了一寸。
  event_data:
    decision: marsh_rest
- id: public_decision_opens
  scope: world
  every_minutes: 1440
  condition: world.public_decision_open < 1
  effect:
    type: world_property_delta
    property: public_decision_open
    delta: 1
    maximum: 1
  event_type: public_decision.due
  event_summary: 新的一天开始。公社需要做一次公共决定：收紧配给、优先抢修潮门，还是让沼泽和居民休养。
  event_data:
    decision: open
- id: hydration_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.hydration <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: dehydration_damage
    event_type: need.hydration_damage
    edge: each
    trend: true
    summary: 严重脱水正在损害一位居民。
    data:
      need: hydration
      threshold: 5
      attribute: integrity
      delta: -1
- id: hunger_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: hunger_damage
    event_type: need.hunger_damage
    edge: each
    trend: true
    summary: 严重饥饿正在损害一位居民。
    data:
      need: satiety
      threshold: 5
      attribute: integrity
      delta: -1
memory_quality:
  ranking:
    relevance: 0.62
    importance: 0.18
    recency: 0.12
    access: 0.08
    half_life_minutes: 1440
    diversity: 0.12
  semantic_similarity:
    enabled: false
social_credibility:
  base: 0.5
  trust_weight: 0.35
  reputation_weight: 0.15
  trust_relations:
  - trust
  reputation_attribute: reputation
  reputation_min: -100
  reputation_max: 100
civilization_progress:
  safe_channel_knowledge:
    required: 2
    evidence_value: 2
    description: 两个被验证的海图阶段会形成关于低潮安全通道的公共知识。
    evidence_event_types:
    - research.completed
    evidence_behaviors:
    - research_chart
    wake:
    - story
    - god
onboarding_window_minutes: 2880
onboarding:
- id: first_measurement
