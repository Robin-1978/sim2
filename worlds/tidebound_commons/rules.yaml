  body: 潮门已经加固到八成以上。风暴会检验它是否真的守得住。
  when: world.tide_gate_integrity >= 0.8 and world.storm_eta_hours > 0
  goal_id: hold_the_first_storm
progression:
- id: daily_public_decision
  label: 今天的公共决策
  summary: 配给、抢修或休养——今天只能选一件，明早才会重新开启。
  priority: 0.97
  audience:
  - player
  visible_when: world.public_decision_open >= 1
  target_behaviors:
  - ration_today
  - repair_priority_today
  - marsh_rest_today
  support_behaviors: []
- id: steward_first_rope
  label: 搓出第一段公共用绳
  summary: 用两份芦苇搓一段绳子；它会成为下一只修理工具包的骨架。
  priority: 0.945
  audience:
  - player
  origins:
  - steward
  target_behaviors:
  - craft_rope
  support_behaviors:
  - gather_reed
  complete_when:
    event_type: rope.crafted
    self_only: true
    count: 1
- id: forager_first_haul
  label: 带回第一篓贝类
  summary: 去浅滩采两份贝类，让公社看见沼泽还能稳定供食。
  priority: 0.945
  audience:
  - player
  origins:
  - forager
  target_behaviors:
  - gather_shellfish
  support_behaviors: []
  complete_when:
    event_type: resource.gathered
    self_only: true
    match:
      resource_id: shellfish
    count: 1
- id: chart_keeper_first_stage
  label: 验证海图的第一个阶段
  summary: 完成一次研究，让半张海图变成别人也能复核的记录。
  priority: 0.945
  audience:
  - player
  origins:
  - chart_keeper
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    self_only: true
    match:
      source_id: drowned_chart
    count: 1
- id: ferry_runner_first_message
  label: 把倒计时送到第一位住户
  summary: 找一位居民交换消息，让风暴倒计时不只停在码头。
  priority: 0.945
  audience:
  - player
  origins:
  - ferry_runner
  target_behaviors:
  - communicate
  support_behaviors: []
  complete_when:
    event_type: dialogue.recorded
    self_only: true
    count: 1
- id: steward_public_ledger
  label: 让公开维护变成惯例
  summary: 再完成两次公共修复，把“先量、再修、公开代价”变成公社的固定做法。
  priority: 0.86
  audience:
  - player
  origins:
  - steward
  requires_goal: steward_first_rope
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  complete_when:
    event_type: tide_gate.repaired
    self_only: true
    count: 2
- id: forager_rations
  label: 把第一篓贝类变成储备
  summary: 用采回的贝类腌制两份口粮，让沼泽的收成真正留到风暴之后。
  priority: 0.86
  audience:
  - player
  origins:
  - forager
  requires_goal: forager_first_haul
  target_behaviors:
  - craft_rations
  support_behaviors:
  - gather_shellfish
  - gather_water
  complete_when:
    event_type: rations.preserved
    self_only: true
    count: 2
- id: chart_keeper_second_stage
  label: 把海图补到第二个阶段
  summary: 完成海图的第二阶段，让一条低潮通道从传闻变成可复核的记录。
  priority: 0.86
  audience:
  - player
  origins:
  - chart_keeper
  requires_goal: chart_keeper_first_stage
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    self_only: true
    match:
      source_id: drowned_chart
    count: 2
- id: ferry_runner_network
  label: 让消息在公社里转起来
  summary: 再完成三次消息交换，让风暴预警不只停在码头。
  priority: 0.86
  audience:
  - player
  origins:
  - ferry_runner
  requires_goal: ferry_runner_first_message
  target_behaviors:
  - communicate
  support_behaviors: []
  complete_when:
    event_type: dialogue.recorded
    self_only: true
    count: 4
- id: inspect_tide_gate
  label: 测量潮门
  summary: 先确认潮门的真实状况，为公共修复建立第一条可靠证据。
  priority: 0.95
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - inspect_gate
  support_behaviors: []
  complete_when:
    event_type: gate.inspected
    count: 1
- id: hold_the_first_storm
  label: 让潮门撑过第一场风暴
  summary: 在倒计时结束前把潮门加固到八成以上；只修一次只能挡水，撑不住风暴。
  priority: 0.94
  audience:
  - player
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: storm.held
    count: 1
- id: repair_tide_gate
  label: 修复潮门
  summary: 把采集到的材料做成工具包，真正用在潮门缺口上。
  priority: 0.92
  audience:
  - player
  - 玛拉
  - 塞琳
  - 伊沃
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: tide_gate.repaired
    count: 1
- id: complete_drowned_chart
  label: 补全沉没海图
  summary: 在有人真正沿着海图走进沼泽之前，验证两个阶段。
  priority: 0.88
  audience:
  - player
