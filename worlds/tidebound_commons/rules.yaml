  critical_threshold: 0.5
  critical_gain: 1.0
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - safety_and_uncertainty
  - sustenance
  - relatedness
  - competence
  - meaning_and_goal_progress
minute_effects:
- id: stamina_recovery
  scope: agent
  every_minutes: 1
  # Work spends stamina; only an idle or waiting actor recovers it.  Without
  # this guard every action cost (0.02-0.20/min) was weaker than recovery
  # (0.45/min), so the capacity bar always drifted to 100 and never gated.
  condition: action.none
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.2
    maximum: 100
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.03
  events:
  - id: hydration_low
    event_type: need.hydration_low
    condition: actor.need.hydration <= context.hydration_alert_threshold
    edge: enter
    trend: true
    summary: 水分跌破饮水警戒线。
    data:
      need: hydration
      threshold: 45
      signal_only: true
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.025
  events:
  - id: satiety_low
    event_type: need.satiety_low
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: enter
    trend: true
    summary: 饱食跌破进食警戒线。
    data:
      need: satiety
      threshold: 45
      signal_only: true
- id: belonging_decay
  scope: agent
  every_minutes: 10
  effect:
    type: need_delta
    need: belonging
    delta: -0.05
- id: purpose_decay
  scope: agent
  every_minutes: 15
  effect:
    type: need_delta
    need: purpose
    delta: -0.05
- id: storm_clock
  scope: world
  every_minutes: 1
  effect:
    type: world_property_delta
    property: storm_eta_hours
    delta: -0.0166666667
    minimum: 0
- id: storm_pressure_rises
  scope: world
  every_minutes: 60
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: 0.004
    maximum: 1
- id: storm_final_watch_open
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 6 and world.storm_eta_hours > 0 and world.storm_final_watch < 1
  effect:
    type: world_property_delta
    property: storm_final_watch
    delta: 1
    maximum: 1
- id: storm_floods_the_quay
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity < 0.2 and world.storm_prepared < 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: -0.22, minimum: 0}
  - {type: world_resource_delta, resource_id: driftwood, delta: -8, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: -6, minimum: 0}
  - {type: world_property_delta, property: gate_supports, delta: -0.6, minimum: 0}
  - {type: world_property_delta, property: storm_final_watch, delta: -2, minimum: 0}
  - {type: world_property_delta, property: storm_prepared, delta: -1, minimum: 0}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: false}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: 风暴潮淹没了码头}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: damaged}
  event_type: storm.flooded
  event_summary: 风暴潮越过失守的潮门，码头和粮仓进水，公社的信心明显动摇。
  event_data:
    severity: flooded
- id: storm_floods_the_quay_prepared
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity < 0.2 and world.storm_prepared >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: -0.10, minimum: 0}
  - {type: world_resource_delta, resource_id: driftwood, delta: -3, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: -2, minimum: 0}
  - {type: world_property_delta, property: gate_supports, delta: -0.6, minimum: 0}
  - {type: world_property_delta, property: storm_final_watch, delta: -2, minimum: 0}
  - {type: world_property_delta, property: storm_prepared, delta: -1, minimum: 0}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: false}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: 风暴潮淹没了码头}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: damaged}
  event_type: storm.flooded
  event_summary: 风暴潮越过失守的潮门，但公共物资已经搬上高地，损失被压住了。
  event_data:
    severity: flooded_prepared
- id: storm_breaches_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.tide_gate_integrity < 0.8 and world.storm_prepared < 1 or world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.gate_supports < 0.4 and world.storm_prepared < 1
  effects:
  - {type: world_property_delta, property: tide_gate_integrity, delta: -0.16, minimum: 0}
  - {type: world_property_delta, property: gate_supports, delta: -0.5, minimum: 0}
  - {type: world_resource_delta, resource_id: shellfish, delta: -10, minimum: 0}
  - {type: world_resource_delta, resource_id: marsh_reed, delta: -8, minimum: 0}
  - {type: world_property_delta, property: storm_final_watch, delta: -2, minimum: 0}
  - {type: world_property_delta, property: storm_prepared, delta: -1, minimum: 0}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: false}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: 潮沟被风暴撕开}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: damaged}
  event_type: storm.breached
  event_summary: 风暴撕开了潮门缺口。闸室还能站人，但下一次风暴会更危险。
  event_data:
    severity: breached
- id: storm_breaches_the_gate_prepared
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.tide_gate_integrity < 0.8 and world.storm_prepared >= 1 or world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.2 and world.gate_supports < 0.4 and world.storm_prepared >= 1
  effects:
  - {type: world_property_delta, property: tide_gate_integrity, delta: -0.10, minimum: 0}
  - {type: world_property_delta, property: gate_supports, delta: -0.5, minimum: 0}
  - {type: world_resource_delta, resource_id: shellfish, delta: -4, minimum: 0}
  - {type: world_resource_delta, resource_id: marsh_reed, delta: -3, minimum: 0}
  - {type: world_property_delta, property: storm_final_watch, delta: -2, minimum: 0}
  - {type: world_property_delta, property: storm_prepared, delta: -1, minimum: 0}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: false}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: 潮沟被风暴撕开}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: damaged}
  event_type: storm.breached
  event_summary: 潮门被撕开，但提前撤离让公共物资少损失了一半。
  event_data:
    severity: breached_prepared
- id: storm_holds_the_gate
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0 and world.tide_gate_integrity >= 0.8 and world.gate_supports >= 0.4
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.05, maximum: 1}
  - {type: world_property_delta, property: gate_supports, delta: -0.3, minimum: 0}
  - {type: world_property_delta, property: storm_final_watch, delta: -2, minimum: 0}
  - {type: world_property_delta, property: storm_prepared, delta: -1, minimum: 0}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: true}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: ""}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: true}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: ""}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: repaired}
  event_type: storm.held
  event_summary: 潮门扛住了风暴。公社第一次证明，公开维护的代价没有白付。
  event_data:
    severity: held
- id: storm_pressure_falls
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effect:
    type: world_property_delta
    property: storm_pressure
    delta: -0.7
    minimum: 0.3
- id: storm_clock_resets
  scope: world
  every_minutes: 1
  condition: world.storm_eta_hours <= 0
  effects:
  - {type: world_property_delta, property: storm_eta_hours, delta: 48, maximum: 48}
  - {type: world_property_delta, property: storm_cycle, delta: 1, maximum: 3}
- id: aftermath_rationing
  scope: world
  every_minutes: 1440
  condition: world.decision_rationing >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: -0.02, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: 2, maximum: 30}
  - {type: world_property_delta, property: decision_rationing, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 昨天的配给让淡水留住了，但住户开始私下抱怨份量。
  event_data:
    decision: rationing
- id: aftermath_repair
  scope: world
  every_minutes: 1440
  condition: world.decision_repair >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.01, maximum: 1}
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.02, maximum: 1}
  - {type: world_property_delta, property: decision_repair, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 昨天的抢修让闸室多撑了一段，公社今天谈起它时语气缓和了一些。
  event_data:
    decision: repair_priority
- id: aftermath_rest
  scope: world
  every_minutes: 1440
  condition: world.decision_rest >= 1
  effects:
  - {type: world_property_delta, property: public_confidence, delta: 0.02, maximum: 1}
  - {type: world_resource_delta, resource_id: shellfish, delta: 4, maximum: 36}
  - {type: world_resource_delta, resource_id: marsh_reed, delta: 4, maximum: 30}
  - {type: world_property_delta, property: decision_rest, delta: -1, minimum: 0}
  event_type: decision.aftermath
  event_summary: 沼泽休养了一天后，浅滩的贝类和芦苇恢复了一些，人心也松了一寸。
  event_data:
    decision: marsh_rest
- id: public_decision_opens
  scope: world
  every_minutes: 1440
  condition: world.public_decision_open < 1
  effect:
    type: world_property_delta
    property: public_decision_open
    delta: 1
    maximum: 1
  event_type: public_decision.due
  event_summary: 新的一天开始。公社需要做一次公共决定：收紧配给、优先抢修潮门，还是让沼泽和居民休养。
  event_data:
    decision: open
- id: rain_catcher_refills
  scope: world
  every_minutes: 360
  condition: world.rain_catcher_repaired >= 1
  effects:
  - {type: world_resource_delta, resource_id: fresh_water, delta: 6, maximum: 30}
  event_type: rainwater.harvested
  event_summary: 修好的屋顶集雨器把雨水引进储水槽，公社多了一批可分配的淡水。
  event_data:
    amount: 6
- id: confidence_volunteer_repair
  scope: world
  every_minutes: 720
  condition: world.public_confidence >= 0.65 and world.tide_gate_integrity > 0 and world.tide_gate_integrity < 0.8
  effects:
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.01, maximum: 1}
  event_type: commons.volunteer_repair
  event_summary: 公共信心足够高，居民自发轮班加固潮门；没人需要被点名。
  event_data:
    amount: 0.01
- id: hydration_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.hydration <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: dehydration_damage
    event_type: need.hydration_damage
    edge: each
    trend: true
    summary: 严重脱水正在损害一位居民。
    data:
      need: hydration
      threshold: 5
      attribute: integrity
      delta: -1
- id: hunger_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 5
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
  events:
  - id: hunger_damage
    event_type: need.hunger_damage
    edge: each
    trend: true
    summary: 严重饥饿正在损害一位居民。
    data:
      need: satiety
      threshold: 5
      attribute: integrity
      delta: -1
memory_quality:
  ranking:
