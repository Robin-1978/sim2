  storm_cycle: {label: 风暴轮次, unit: amount, max: 3, group: 防线, group_order: 1, order: 7}
  public_confidence: {label: 公共信心, unit: percent, max: 1, group: 防线, group_order: 1, order: 5}
  storm_final_watch: {label: 风暴最后决策, unit: bool, hidden: true}
  storm_prepared: {label: 风暴准备, unit: bool, hidden: true}
  rain_catcher_repaired: {label: 集雨器, unit: bool, max: 1, true_label: 已修复, false_label: 未修复, group: 储备, group_order: 2, order: 3}
  market_trades: {label: 集市交换, unit: amount, group: 储备, group_order: 2, order: 4}
  public_decision_open: {label: 公共决策窗口, unit: bool, hidden: true}
  decision_rationing: {label: 昨日配给, unit: bool, hidden: true}
  decision_repair: {label: 昨日抢修, unit: bool, hidden: true}
  decision_rest: {label: 昨日休养, unit: bool, hidden: true}
