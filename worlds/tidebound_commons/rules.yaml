    evidence_event_types:
    - research.completed
    evidence_behaviors:
    - research_chart
    wake:
    - story
    - god
onboarding_window_minutes: 2880
onboarding:
- id: first_measurement
  title: 先测量潮门
  body: 潮门只剩两成多，第一场风暴正在靠近。先确认缺口，再决定今天的材料。
  when: world.maintenance_evidence < 1
  action_ref: behavior:inspect_gate
  goal_id: inspect_tide_gate
  origin_overrides:
    steward:
      title: 先看账本，再量缺口
      body: 你是潮务学徒。玛拉把维护账本推到你面前：先测量潮门，再决定今天的材料；你随身那只工具包要留给最关键的一次修复。
      action_ref: behavior:inspect_gate
      goal_id: inspect_tide_gate
    forager:
      title: 先量潮门，再看清浅滩
      body: 你是沼泽采集者。潮门只剩两成多，但公社今天也得有吃的：先测量潮门，再去浅滩带回第一篓贝类，别把贝滩采空。
      action_ref: behavior:inspect_gate
      goal_id: inspect_tide_gate
    chart_keeper:
      title: 先量潮门，再验证海图
      body: 你是海图学徒。塞琳要你先确认潮门缺口，再去观测台验证沉没海图的第一阶段；一条路线必须能被别人重复走通。
      action_ref: behavior:inspect_gate
      goal_id: inspect_tide_gate
    ferry_runner:
      title: 先量潮门，再把消息送出去
      body: 你是渡船信使。先测量潮门，再把风暴倒计时带给玛拉；消息不能停在码头。
      action_ref: behavior:inspect_gate
      goal_id: inspect_tide_gate
- id: first_decision
  title: 今天的公共决定
  body: 配给、抢修或休养，今天只能选一件；明早才会重新开启。
  when: world.maintenance_evidence >= 1 and world.public_decision_open >= 1
  goal_id: daily_public_decision
- id: brace_the_gate
  title: 第一道缺口：谁先修？
  body: 一次修复只能把结构抬高 28%。玛拉会从公共工具架取另一只工具包；修复之外，还要有人把临时支撑加到 40%，风暴才会真正被挡住。
  when: world.maintenance_evidence >= 1 and world.public_decision_open < 1 and world.gate_repairs < 1 and world.tide_gate_integrity < 0.8
  action_ref: behavior:repair_gate
  goal_id: hold_the_first_storm
- id: second_gate_repair
  title: 还差一次修复
  body: 潮门已经修复过，但结构还低于 80% 或支撑不到 40%。先去闸室公共工具架取工具包补结构，再用浮木和芦苇绳做支撑件加固；玛拉通常会补其中一道缺口。
  when: world.gate_repairs >= 1 and world.tide_gate_integrity < 0.8
  action_ref: behavior:repair_gate
  goal_id: hold_the_first_storm
- id: raise_gate_supports
  title: 给潮门加临时支撑
  body: 结构到八成还不够，临时支撑也要到四成。用浮木和芦苇绳做支撑件，或让公共劳力选“优先抢修”补 10%。
  when: world.maintenance_evidence >= 1 and world.tide_gate_integrity >= 0.8 and world.gate_supports < 0.4
  action_ref: behavior:craft_gate_brace
  goal_id: hold_the_first_storm
- id: wait_for_storm
  title: 等待第一场风暴
  body: 潮门结构到了八成、临时支撑到了四成。风暴会检验它是否真的守得住。
  when: world.storm_cycle < 1 and world.tide_gate_integrity >= 0.8 and world.gate_supports >= 0.4 and world.storm_eta_hours > 0
  goal_id: hold_the_first_storm
- id: open_outer_route
  title: 把航路消息送出去
  body: 潮门已经稳住，下一步是校准季节信号；信号覆盖到 70% 时，外海航路会重新打开。集雨器可以之后再修。
  when: world.storm_cycle >= 1 and world.tide_gate_integrity >= 0.8 and world.signal_reach < 0.7
  action_ref: behavior:tune_signal
  goal_id: reopen_outer_route
- id: restore_rain_catcher
  title: 修好屋顶集雨器
  body: 航路消息已经送出去，工坊屋顶的集雨器还堵着；修好它能每六小时稳定补一次淡水，为下一季做准备。
  when: world.signal_reach >= 0.7 and world.rain_catcher_repaired < 1
  action_ref: behavior:repair_rain_catcher
  goal_id: restore_rain_catcher
progression:
- id: daily_public_decision
  label: 今天的公共决策
  summary: 配给、抢修或休养——今天只能选一件，明早才会重新开启。
  priority: 0.97
  audience:
  - player
  visible_when: world.public_decision_open >= 1
  target_behaviors:
  - ration_today
  - repair_priority_today
  - marsh_rest_today
  support_behaviors: []
- id: storm_final_watch
  label: 风暴最后六小时
  summary: 通宵抢修、撤走物资，或让居民先避风——只能选一件。
  priority: 0.99
  audience:
  - player
  visible_when: world.storm_final_watch == 1
  target_behaviors:
  - final_night_repair
  - evacuate_supplies
  - shelter_residents
  support_behaviors: []
- id: steward_first_rope
  label: 搓出第一段公共用绳
  summary: 用两份芦苇搓一段绳子；它会成为下一只修理工具包的骨架。
  priority: 0.945
  audience:
  - player
  origins:
  - steward
  target_behaviors:
  - craft_rope
  support_behaviors:
  - gather_reed
  complete_when:
    event_type: rope.crafted
    self_only: true
    count: 1
- id: forager_first_haul
  label: 带回第一篓贝类
  summary: 去浅滩采两份贝类，让公社看见沼泽还能稳定供食。
  priority: 0.945
  audience:
  - player
  origins:
  - forager
  target_behaviors:
  - gather_shellfish
  support_behaviors: []
  complete_when:
    event_type: resource.gathered
    self_only: true
    match:
      resource_id: shellfish
    count: 1
- id: chart_keeper_first_stage
  label: 验证海图的第一个阶段
  summary: 完成一次研究，让半张海图变成别人也能复核的记录。
  priority: 0.945
  audience:
  - player
  origins:
  - chart_keeper
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    self_only: true
    match:
      source_id: drowned_chart
    count: 1
- id: ferry_runner_first_message
  label: 把倒计时送到第一位住户
  summary: 找一位居民交换消息，让风暴倒计时不只停在码头。
  priority: 0.945
  audience:
  - player
  origins:
  - ferry_runner
  target_behaviors:
  - communicate
  support_behaviors: []
  complete_when:
    event_type: dialogue.recorded
    self_only: true
    count: 1
- id: steward_public_ledger
  label: 让公开维护变成惯例
  summary: 再完成两次公共修复，把“先量、再修、公开代价”变成公社的固定做法。
  priority: 0.86
  audience:
  - player
  origins:
  - steward
  requires_goal: steward_first_rope
  target_behaviors:
  - repair_gate
  - brace_gate
  - craft_gate_brace
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  complete_when:
    event_type: tide_gate.repaired
    self_only: true
    count: 2
- id: forager_rations
  label: 把第一篓贝类变成储备
  summary: 用采回的贝类腌制两份口粮，让沼泽的收成真正留到风暴之后。
  priority: 0.86
  audience:
  - player
  origins:
  - forager
  requires_goal: forager_first_haul
  target_behaviors:
  - craft_rations
  support_behaviors:
  - gather_shellfish
  - gather_water
  complete_when:
    event_type: rations.preserved
    self_only: true
    count: 2
- id: chart_keeper_second_stage
  label: 把海图补到第二个阶段
  summary: 完成海图的第二阶段，让一条低潮通道从传闻变成可复核的记录。
  priority: 0.86
  audience:
  - player
  origins:
  - chart_keeper
  requires_goal: chart_keeper_first_stage
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    self_only: true
    match:
      source_id: drowned_chart
    count: 2
- id: ferry_runner_network
  label: 让消息在公社里转起来
  summary: 再完成三次消息交换，让风暴预警不只停在码头。
  priority: 0.86
  audience:
  - player
  origins:
  - ferry_runner
  requires_goal: ferry_runner_first_message
  target_behaviors:
  - communicate
  support_behaviors: []
  complete_when:
    event_type: dialogue.recorded
    self_only: true
    count: 4
- id: inspect_tide_gate
  label: 测量潮门
  summary: 先确认潮门的真实状况，为公共修复建立第一条可靠证据。
  priority: 0.95
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - inspect_gate
  support_behaviors: []
  complete_when:
    event_type: gate.inspected
    count: 1
- id: hold_the_first_storm
  label: 让潮门撑过第一场风暴
  summary: 结构要修到 80%，临时支撑要加到 40%；修复、支撑件和公共抢修决策可以组合使用。
  priority: 0.94
  audience:
  - player
  target_behaviors:
  - repair_gate
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  - deposit_repair_kit
  - withdraw_repair_kit
  complete_when:
    event_type: storm.held
    count: 1
- id: repair_tide_gate
  label: 修复潮门
  summary: 先测量潮门，再把材料做成工具包；公共工具架上的备用工具包可以交给下一位修复者。
  priority: 0.92
  audience:
  - player
  - 玛拉
  - 塞琳
  - 伊沃
  target_behaviors:
  - repair_gate
  support_behaviors:
  - inspect_gate
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  - deposit_repair_kit
  - withdraw_repair_kit
  complete_when:
    event_type: tide_gate.repaired
    count: 1
- id: stock_the_commons_tool_rack
  label: 让公共工具架不断料
  summary: 把修好的工具包放回工坊的公共工具架，让玛拉或下一位居民不用从零开始搓绳。
  priority: 0.9
  audience:
  - player
  - 玛拉
  - 伊沃
  target_behaviors:
  - deposit_repair_kit
  support_behaviors:
  - craft_repair_kit
  - gather_driftwood
  - gather_reed
  - craft_rope
  complete_when:
    event_type: repair_kit.stored
    count: 1
- id: restore_rain_catcher
  label: 修好屋顶集雨器
  summary: 用两块浮木和一段芦苇绳修好工坊屋顶的集雨器，每六小时稳定补充淡水。
  priority: 0.84
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - repair_rain_catcher
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  visible_when: world.tide_gate_integrity >= 0.56
  complete_when:
    event_type: rain_catcher.repaired
    count: 1
- id: hold_the_next_storms
  label: 撑过接下来的风暴季
  summary: 第一场风暴只是开始。公社还要再守住两轮风暴，才能把临时加固变成真正的季节防线。
  priority: 0.7
  audience:
  - player
  target_behaviors:
  - repair_gate
  - brace_gate
  support_behaviors:
  - repair_rain_catcher
  - craft_gate_brace
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  visible_when: world.storm_cycle >= 1
  complete_when:
    event_type: storm.held
    count: 3
- id: complete_drowned_chart
  label: 补全沉没海图
  summary: 在有人真正沿着海图走进沼泽之前，验证两个阶段。
  priority: 0.88
  audience:
  - player
  - 塞琳
  target_behaviors:
  - research_chart
  support_behaviors: []
  complete_when:
    event_type: research.completed
    match:
      source_id: drowned_chart
    distinct_by:
    - stage_id
    count: 2
- id: tune_seasonal_signal
  label: 校准季节信号
  summary: 先把潮门结构修到八成以上，再消耗工具包校准信号；公共信心低于 35% 时，居民不会把航路消息送出去。
  priority: 0.82
  audience:
  - player
  - 玛拉
  - 塞琳
  target_behaviors:
  - tune_signal
  support_behaviors:
  - gather_driftwood
  - gather_reed
  - craft_rope
  - craft_repair_kit
  - gather_shellfish
  complete_when:
    event_type: signal.tuned
    count: 2
- id: reopen_outer_route
  label: 重开外海航路
  summary: 把公共信号推到 70%。航路重开后会进入季末结局，世界仍可继续运行下一轮风暴季。
  priority: 0.76
  audience:
  - player
  - 玛拉
  - 伊沃
  - 塞琳
  - 塔罗
  target_behaviors: []
  support_behaviors:
  - tune_signal
  complete_when:
    event_type: signal.route_open
    count: 1
