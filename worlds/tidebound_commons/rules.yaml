world_rules:
- id: gate_ready
  condition: world.tide_gate_integrity >= 0.8 and world.gate_supports >= 0.4
  effect: tide_gate.ready
  event_type: tide_gate.ready
  wake:
  - story
  - god
  description: 潮门完整性已足以支撑一条更安全的路线。
- id: storm_warning
  condition: world.storm_pressure >= 0.45
  effect: storm.warning
  event_type: storm.warning
  wake:
  - story
  - god
  description: 风暴压力越过警戒线，公社必须公开回应。
- id: storm_final_watch
  condition: world.storm_eta_hours <= 6 and world.storm_eta_hours > 0
  effect: storm.final_watch
  event_type: storm.final_watch
  wake:
  - story
  - god
  description: 风暴进入最后六小时。公社只能再做一件事：通宵抢修、撤走物资，或让居民先避风。
- id: gate_repair_needed
  condition: world.tide_gate_integrity < 0.8 and world.maintenance_evidence >= 1 and world.commons_tool_kits >= 1 or world.gate_supports < 0.4 and world.maintenance_evidence >= 1 and world.commons_tool_kits >= 1
  effect: gate.repair_needed
  event_type: gate.repair_needed
  wake:
  - story
  - god
  description: 潮门结构或临时支撑不足，公共工具架还有工具包；只修结构挡不住风暴，需要有人补支撑。
- id: confidence_crisis
  condition: world.public_confidence < 0.25
  effect: confidence.low
  event_type: confidence.low
  wake:
  - story
  - god
  description: 公共信心跌破协作底线。居民会拒绝需要集体配合的公共工程，先恢复信心再谈外海航路。
- id: confidence_solidarity
  condition: world.public_confidence >= 0.65
  effect: confidence.solidarity
  event_type: confidence.solidarity
  wake:
  - story
  - god
  description: 公共信心足够高，居民开始主动维护公共设施。
- id: season_advanced
  condition: world.storm_cycle >= 1
  effect: season.advanced
  event_type: season.advanced
  wake:
  - story
  - god
  description: 第一场风暴已经过去，公社进入下一轮风暴季。
- id: outer_route_reopened
  condition: world.signal_reach >= 0.7
  effect: signal.route_open
  event_type: signal.route_open
  wake:
  - story
  - god
  description: 稳定的信号可以为另一处聚落指路，让他们抵达公社。
progression:
  stewardship:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  gathering:
    minimum_completed_outcomes: 2
    max_delta: 0.08
