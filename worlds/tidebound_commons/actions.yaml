  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.10, maximum: 1}
  - {type: world_property_delta, property: gate_supports, delta: 0.15, maximum: 1}
  - {type: world_property_delta, property: public_confidence, delta: 0.05, maximum: 1}
  - {type: world_property_delta, property: storm_final_watch, delta: 1}
  - type: public_event
    event: storm.final_repair
    summary: 公社把最后一夜押在潮门上。结构和临时支撑都被重新加固，居民带着疲惫等第一阵风。
    data: {decision: final_repair}
  success: {condition: actor.alive, result: final_repair_decided}
  failure: {condition: actor.incapacitated, result: decision_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: evacuate_supplies
  verb: allocate
  version: 1
  description: 风暴前最后一夜，把公共淡水、口粮和工具搬上高地，减少风暴潮造成的损失。
  parameters: {}
  preconditions: [actor.alive, world.storm_final_watch == 1, location.safe]
  duration: {minutes: 90}
  costs:
    reserve: {}
    per_minute: {stamina: 0.12}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: storm_prepared, delta: 1, maximum: 1}
  - {type: world_property_delta, property: public_confidence, delta: 0.02, maximum: 1}
  - {type: world_property_delta, property: storm_final_watch, delta: 1}
  - {type: need_delta, need: purpose, delta: 0.5}
  - type: public_event
    event: storm.supplies_evacuated
    summary: 公社把淡水、口粮和工具搬上高地。潮门仍要经受风暴，但至少家底不会全泡在水里。
