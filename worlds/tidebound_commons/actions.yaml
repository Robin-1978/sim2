actions:
- id: travel_to
  verb: move
  version: 1
  description: 沿已知路线移动到一处可见地点。
  parameters: {location_id: string}
  preconditions: [route.known, actor.mobile, destination.reachable]
  requires_destination: true
  completion: {if_already_at_destination: true}
  duration: {mode: route_distance}
  costs: {reserve: {}, per_minute: {stamina: 0.12}, on_success: {}, on_failure: {}, refund: {}}
  success: {condition: actor.state.location_id == context.destination_id, result: arrived}
  effects: [{type: location_set, location_id: context.location_id}]
  failure: {condition: actor.incapacitated, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: gather_resource
  verb: gather
  version: 1
  description: 从配置的可再生资源点采集材料，放进随身物品。
  parameters: {resource_tag: string, location_id: string}
  preconditions: [actor.can_gather, actor.alive, location.resource_node, route.known]
  duration: {minutes: 90}
  costs:
    reserve: {resource_parameter: resource_tag, resource_amount: 2}
    per_minute: {stamina: 0.18}
    on_success: {}
    on_failure: {}
    refund: {}
  effects: [{type: inventory_add, item: context.resource_tag, quantity: 2}]
  success: {condition: resource.collected, result: resource_collected}
  failure: {condition: resource.empty or actor.incapacitated, result: gathering_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: research_source
  verb: research
  version: 1
  description: 推进一处研究来源的下一个开放阶段。
  parameters: {source_id: string}
  preconditions: [actor.can_research, actor.alive, research.new_fact_available]
  duration: {minutes: 120}
  costs:
    reserve: {}
    per_minute: {stamina: 0.14}
    on_success: {}
    on_failure: {}
    refund: {}
  effects: [{type: need_delta, need: purpose, delta: 0.5}]
  progress:
    key: research:{source_id}
    scope: world
    amount: 1
    wake: [story]
  success: {condition: research.new_fact_found, result: research_completed}
  failure: {condition: source.destroyed, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: inspect_object
  verb: inspect
  version: 1
  description: 检查一台公共设施，并记录可验证的维护结果。
  parameters: {object_id: string}
  preconditions: [actor.can_inspect, actor.alive, object.available]
  duration: {minutes: 30}
  costs:
    reserve: {}
    per_minute: {stamina: 0.1}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: maintenance_evidence, delta: 1, maximum: 3}
  - {type: need_delta, need: purpose, delta: 0.2}
  success: {condition: actor.alive, result: inspection_completed}
  failure: {condition: location.locked, result: denied}
  information:
    event_type: gate.inspected
    summary: 潮门完成了检查，维护状况被记录在公社账目里。
    source_type: inspection
    confidence: 0.86
    result: inspection_completed
    record_object_discovery: false
    wake: [story]
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: craft_recipe
  verb: craft
  version: 1
  description: 在配置的工坊里按配方加工材料。
  parameters: {recipe_id: string, station_id: string}
  preconditions: [actor.can_craft, actor.alive, recipe.available, station.available, inputs.available]
  duration: {mode: recipe_duration}
  costs:
    reserve: {recipe_inputs: 1}
    per_minute: {stamina: 0.16}
    on_success: {}
    on_failure: {}
    refund: {}
  success: {condition: outputs.created, result: recipe_completed}
  failure: {condition: inputs.lost or station.damaged, result: crafting_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: repair_tide_gate
  verb: repair
  version: 1
  description: 先测量，再消耗一个修理工具包（自己带着，或从闸室的公共工具架取），恢复公共潮门。
  parameters: {resource_id: string}
  parameter_defaults: {resource_id: commons_tool_rack}
  preconditions: [actor.can_repair, actor.alive, location.tag.infrastructure, actor.inventory.repair_kit >= 1 or resource.available, world.maintenance_evidence >= 1, world.tide_gate_integrity < 1]
  duration: {minutes: 75}
  costs:
    reserve: {}
    per_minute: {stamina: 0.2}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: resource_withdrawal, resource_id: context.resource_id, amount: 1, scope: resource_withdrawal, output_item: repair_kit, only_if_missing: true}
  - {type: inventory.consume_item, item: repair_kit, quantity: 1}
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.28, maximum: 1}
  - {type: world_property_delta, property: gate_repairs, delta: 1, maximum: 3}
  - {type: world_property_delta, property: public_confidence, delta: 0.08, maximum: 1}
  - {type: entity_state_set, entity_id: tide_gate, state: repaired, value: true}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: repaired}
  - {type: entity_state_set, entity_id: commons_quay, state: open, value: true}
  - {type: entity_state_set, entity_id: commons_quay, state: closed_reason, value: ""}
  - {type: entity_state_set, entity_id: marsh_edge, state: open, value: true}
  - {type: entity_state_set, entity_id: marsh_edge, state: closed_reason, value: ""}
  success: {condition: actor.alive, result: tide_gate_repaired}
  failure: {condition: actor.incapacitated, result: repair_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: explore_area
  verb: explore
  version: 1
  description: 勘察一处区域，记录新的路线观察。
  parameters: {area_id: string}
  preconditions: [actor.can_explore, actor.alive, route.known, area.not_fully_mapped]
  duration: {minutes: 150}
  costs:
    reserve: {food_ration: 1}
    per_minute: {stamina: 0.2}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: need_delta, need: purpose, delta: 0.5}
  success: {condition: area.survey_complete, result: exploration_completed}
  failure: {condition: actor.incapacitated, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: communicate
  verb: communicate
  version: 1
  description: 与另一位可见居民交换一条有依据的消息。
  parameters: {target_id: string, topic: string, message: string}
  preconditions: [actor.can_speak, actor.alive, target.available, communication.channel_open]
  duration: {minutes: 15}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects: [{type: need_delta, need: belonging, delta: 0.2}]
  success: {condition: dialogue.completed, result: dialogue_recorded}
  failure: {condition: target.refused, result: conversation_refused}
  information:
    event_type: dialogue.recorded
    summary: 两位居民围绕公社的现状交换了一条有依据的消息。
    source_type: testimony
    confidence: 0.65
    result: dialogue_recorded
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: eat_ration
  verb: consume
  version: 1
  description: 吃下一份随身口粮。
  parameters: {item_id: string}
  parameter_defaults: {item_id: {resolver: context_value, key: food_item}}
  preconditions: [actor.alive, actor.inventory.food_ration >= 1]
  duration: {minutes: 5}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: inventory.consume_item, item: context.item_id, quantity: 1}
  - {type: need_delta, need: satiety, delta: 34}
  success: {condition: actor.alive, result: ration_eaten}
  failure: {condition: actor.incapacitated, result: eating_failed}
  interrupt_policy: cancel
  interaction_policy: deny
  kind: atomic
  executor: effect_pipeline
- id: drink_water
  verb: consume
  version: 1
  description: 喝下一份随身淡水。
  parameters: {item_id: string}
  parameter_defaults: {item_id: {resolver: context_value, key: water_item}}
  preconditions: [actor.alive, actor.inventory.fresh_water >= 1]
  duration: {minutes: 5}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: inventory.consume_item, item: context.item_id, quantity: 1}
  - {type: need_delta, need: hydration, delta: 34}
  success: {condition: actor.alive, result: water_drunk}
  failure: {condition: actor.incapacitated, result: drinking_failed}
  interrupt_policy: cancel
  interaction_policy: deny
  kind: atomic
  executor: effect_pipeline
- id: draw_public_water
  verb: gather
  version: 1
  description: 从公社的公共淡水储备里领取一份随身淡水。储备来自沼泽水洼和屋顶集雨器；领取会减少所有人可用的余量。
  parameters: {item_id: string}
  parameter_defaults: {item_id: fresh_water}
  preconditions: [actor.alive, location.safe, world.fresh_water_reserve >= 1, actor.inventory.fresh_water < 2]
  duration: {minutes: 10}
  costs:
    reserve: {}
    per_minute: {stamina: 0.02}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_resource_delta, resource_id: context.item_id, delta: -1, minimum: 0}
  - {type: inventory_add, item: context.item_id, quantity: 1}
  success: {condition: actor.alive, result: water_drawn}
  failure: {condition: actor.incapacitated, result: drawing_failed}
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: tune_signal
  verb: repair
  version: 1
  description: 在潮门稳定、公共信心足够后，消耗一个修理工具包（自己带着，或从闸室工具架取）校准季节信号透镜。
  parameters: {resource_id: string}
  parameter_defaults: {resource_id: commons_tool_rack}
  preconditions: [actor.can_repair, actor.alive, location.tag.infrastructure, actor.inventory.repair_kit >= 1 or resource.available, world.tide_gate_integrity >= 0.8, world.public_confidence >= 0.35, world.signal_reach < 0.7]
  duration: {minutes: 60}
  costs:
    reserve: {}
    per_minute: {stamina: 0.16}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: resource_withdrawal, resource_id: context.resource_id, amount: 1, scope: resource_withdrawal, output_item: repair_kit, only_if_missing: true}
  - {type: inventory.consume_item, item: repair_kit, quantity: 1}
  - {type: world_property_delta, property: signal_reach, delta: 0.26, maximum: 1}
  - {type: entity_state_set, entity_id: signal_lens, state: tuned, value: true}
  - {type: entity_state_set, entity_id: signal_lens, state: status, value: tuned}
  success: {condition: actor.alive, result: signal_tuned}
  failure: {condition: actor.incapacitated, result: tuning_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: deposit_repair_kit
  verb: transfer_resource
  version: 1
  description: 把随身的一件修理材料放回公共工具架，让任何居民都能取用。
  parameters: {item_id: string, quantity: number, resource_id: string}
  parameter_defaults: {item_id: repair_kit, quantity: 1, resource_id: commons_tool_rack}
  preconditions: [actor.alive, inventory.available, world.commons_tool_kits < 3]
  duration: {minutes: 10}
  costs:
    reserve: {item_parameter: item_id, item_quantity_parameter: quantity}
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: resource_transfer, resource_id: context.resource_id, quantity_parameter: quantity, source_item_parameter: item_id}
  success: {condition: actor.alive, result: repair_kit_stored}
  failure: {condition: actor.incapacitated, result: deposit_failed}
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: withdraw_repair_kit
  verb: transfer_resource
  version: 1
  description: 从公共工具架取一个修理工具包；已经带着工具包时不会重复拿取。
  parameters: {resource_id: string}
  parameter_defaults: {resource_id: commons_tool_rack}
  preconditions: [actor.alive]
  duration: {minutes: 10}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: resource_withdrawal, resource_id: context.resource_id, amount: 1, scope: resource_withdrawal, output_item: repair_kit, only_if_missing: true}
  success: {condition: actor.alive, result: repair_kit_withdrawn}
  failure: {condition: actor.incapacitated, result: withdrawal_failed}
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: repair_rain_catcher
  verb: repair
  version: 1
  description: 用浮木和芦苇绳修好工坊屋顶的集雨器，让它每六小时补充淡水。
  parameters: {}
  preconditions: [actor.can_repair, actor.alive, location.tag.craft, actor.inventory.driftwood >= 2, actor.inventory.reed_rope >= 1, world.rain_catcher_repaired < 1]
  duration: {minutes: 60}
  costs:
    reserve: {driftwood: 2, reed_rope: 1}
    per_minute: {stamina: 0.16}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: entity_state_set, entity_id: rain_catcher, state: repaired, value: true}
  - {type: entity_state_set, entity_id: rain_catcher, state: status, value: working}
  - {type: world_property_delta, property: rain_catcher_repaired, delta: 1, maximum: 1}
  - {type: world_property_delta, property: public_confidence, delta: 0.03, maximum: 1}
  - {type: world_resource_delta, resource_id: fresh_water, delta: 4, maximum: 30}
  success: {condition: actor.alive, result: rain_catcher_repaired}
  failure: {condition: actor.incapacitated, result: repair_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: brace_tide_gate
  verb: repair
  version: 1
  description: 用一件潮门支撑件给潮门加一道临时支撑，不消耗修理工具包；主要提高临时支撑，顺带稳住局部结构。
  parameters: {}
  preconditions: [actor.can_repair, actor.alive, location.tag.infrastructure, actor.inventory.gate_brace >= 1, world.gate_supports < 1]
  duration: {minutes: 50}
  costs:
    reserve: {gate_brace: 1}
    per_minute: {stamina: 0.18}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.02, maximum: 1}
  - {type: world_property_delta, property: gate_supports, delta: 0.15, maximum: 1}
  - {type: world_property_delta, property: public_confidence, delta: 0.02, maximum: 1}
  - {type: entity_state_set, entity_id: tide_gate, state: status, value: braced}
  success: {condition: actor.alive, result: gate_braced}
  failure: {condition: actor.incapacitated, result: repair_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: market_barter
  verb: trade
  version: 1
  description: 在公共码头用一份口粮和过往船户换一段现成的芦苇绳。
  parameters: {}
  preconditions: [actor.alive, location.tag.market, actor.inventory.food_ration >= 1]
  duration: {minutes: 20}
  costs:
    reserve: {food_ration: 1}
    per_minute: {}
    on_success: {}
