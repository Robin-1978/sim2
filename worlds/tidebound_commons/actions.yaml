actions:
- id: travel_to
  version: 1
  description: 沿已知路线移动到一处可见地点。
  parameters: {location_id: string}
  preconditions: [route.known, actor.mobile, destination.reachable]
  requires_destination: true
  completion: {if_already_at_destination: true}
  duration: {mode: route_distance}
  costs: {reserve: {}, per_minute: {stamina: 0.12}, on_success: {}, on_failure: {}, refund: {}}
  success: {condition: actor.state.location_id == context.destination_id, result: arrived}
  effects: [{type: location_set, location_id: context.location_id}]
  failure: {condition: actor.incapacitated, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: gather_resource
  version: 1
  description: 从配置的可再生资源点采集材料，放进随身物品。
  parameters: {resource_tag: string, location_id: string}
  preconditions: [actor.can_gather, actor.alive, location.resource_node, route.known]
  duration: {minutes: 90}
  costs:
    reserve: {resource_parameter: resource_tag, resource_amount: 2}
    per_minute: {stamina: 0.18}
    on_success: {}
    on_failure: {}
    refund: {}
  effects: [{type: inventory_add, item: context.resource_tag, quantity: 2}]
  success: {condition: resource.collected, result: resource_collected}
  failure: {condition: resource.empty or actor.incapacitated, result: gathering_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: research_source
  version: 1
  description: 推进一处研究来源的下一个开放阶段。
  parameters: {source_id: string}
  preconditions: [actor.can_research, actor.alive, research.new_fact_available]
  duration: {minutes: 120}
  costs:
    reserve: {}
    per_minute: {stamina: 0.14}
    on_success: {}
    on_failure: {}
    refund: {}
  effects: [{type: need_delta, need: purpose, delta: 0.5}]
  progress:
    key: research:{source_id}
    scope: world
    amount: 1
    wake: [story]
  success: {condition: research.new_fact_found, result: research_completed}
  failure: {condition: source.destroyed, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: inspect_object
  version: 1
  description: 检查一台公共设施，并记录可验证的维护结果。
  parameters: {object_id: string}
  preconditions: [actor.can_inspect, actor.alive, object.available]
  duration: {minutes: 30}
  costs:
    reserve: {}
    per_minute: {stamina: 0.1}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: maintenance_evidence, delta: 1, maximum: 3}
  - {type: need_delta, need: purpose, delta: 0.2}
  success: {condition: actor.alive, result: inspection_completed}
  failure: {condition: location.locked, result: denied}
  information:
    event_type: gate.inspected
    summary: 潮门完成了检查，维护状况被记录在公社账目里。
    source_type: inspection
    confidence: 0.86
    result: inspection_completed
    record_object_discovery: false
    wake: [story]
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: craft_recipe
  version: 1
  description: 在配置的工坊里按配方加工材料。
  parameters: {recipe_id: string, station_id: string}
  preconditions: [actor.can_craft, actor.alive, recipe.available, station.available, inputs.available]
  duration: {mode: recipe_duration}
  costs:
    reserve: {recipe_inputs: 1}
    per_minute: {stamina: 0.16}
    on_success: {}
    on_failure: {}
    refund: {}
  success: {condition: outputs.created, result: recipe_completed}
  failure: {condition: inputs.lost or station.damaged, result: crafting_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: repair_tide_gate
  version: 1
  description: 消耗一个修理工具包，恢复公共潮门。
  parameters: {}
  preconditions: [actor.can_repair, actor.alive, actor.inventory.repair_kit >= 1, world.tide_gate_integrity < 1]
  duration: {minutes: 75}
  costs:
    reserve: {}
    per_minute: {stamina: 0.2}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: inventory.consume_item, item: repair_kit, quantity: 1}
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.28, maximum: 1}
  - {type: world_property_delta, property: public_confidence, delta: 0.08, maximum: 1}
  - {type: entity_state_set, entity_id: tide_gate, state: repaired, value: true}
  success: {condition: actor.alive, result: tide_gate_repaired}
  failure: {condition: actor.incapacitated, result: repair_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: explore_area
  version: 1
  description: 勘察一处区域，记录新的路线观察。
  parameters: {area_id: string}
  preconditions: [actor.can_explore, actor.alive, route.known, area.not_fully_mapped]
  duration: {minutes: 150}
  costs:
    reserve: {food_ration: 1}
    per_minute: {stamina: 0.2}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: need_delta, need: purpose, delta: 0.5}
  success: {condition: area.survey_complete, result: exploration_completed}
  failure: {condition: actor.incapacitated, result: failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: communicate
  version: 1
  description: 与另一位可见居民交换一条有依据的消息。
  parameters: {target_id: string, topic: string, message: string}
  preconditions: [actor.can_speak, actor.alive, target.available, communication.channel_open]
  duration: {minutes: 15}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects: [{type: need_delta, need: belonging, delta: 0.2}]
  success: {condition: dialogue.completed, result: dialogue_recorded}
  failure: {condition: target.refused, result: conversation_refused}
  information:
    event_type: dialogue.recorded
    summary: 两位居民围绕公社的现状交换了一条有依据的消息。
    source_type: testimony
    confidence: 0.65
    result: dialogue_recorded
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: eat_ration
  version: 1
  description: 吃下一份随身口粮。
  parameters: {item_id: string}
  parameter_defaults: {item_id: {resolver: context_value, key: food_item}}
  preconditions: [actor.alive, actor.inventory.food_ration >= 1]
  duration: {minutes: 5}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: inventory.consume_item, item: context.item_id, quantity: 1}
  - {type: need_delta, need: satiety, delta: 34}
  success: {condition: actor.alive, result: ration_eaten}
  failure: {condition: actor.incapacitated, result: eating_failed}
  interrupt_policy: cancel
  interaction_policy: deny
  kind: atomic
  executor: effect_pipeline
- id: drink_water
  version: 1
  description: 喝下一份随身淡水。
  parameters: {item_id: string}
  parameter_defaults: {item_id: {resolver: context_value, key: water_item}}
  preconditions: [actor.alive, actor.inventory.fresh_water >= 1]
  duration: {minutes: 5}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: inventory.consume_item, item: context.item_id, quantity: 1}
  - {type: need_delta, need: hydration, delta: 34}
  success: {condition: actor.alive, result: water_drunk}
  failure: {condition: actor.incapacitated, result: drinking_failed}
  interrupt_policy: cancel
  interaction_policy: deny
  kind: atomic
  executor: effect_pipeline
- id: tune_signal
  version: 1
  description: 在潮门稳定后，消耗一个修理工具包校准季节信号透镜。
  parameters: {}
  preconditions: [actor.can_repair, actor.alive, actor.inventory.repair_kit >= 1, world.tide_gate_integrity >= 0.56, world.signal_reach < 0.7]
  duration: {minutes: 60}
  costs:
    reserve: {}
    per_minute: {stamina: 0.16}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: inventory.consume_item, item: repair_kit, quantity: 1}
  - {type: world_property_delta, property: signal_reach, delta: 0.26, maximum: 1}
  - {type: entity_state_set, entity_id: signal_lens, state: tuned, value: true}
  success: {condition: actor.alive, result: signal_tuned}
  failure: {condition: actor.incapacitated, result: tuning_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: ration_today
  version: 1
  description: 今日公共决策：按人头收紧淡水配给，把余量留给风暴之后。
  parameters: {}
  preconditions: [actor.alive, world.public_decision_open >= 1]
  duration: {minutes: 45}
  costs:
    reserve: {}
    per_minute: {stamina: 0.05}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: public_decision_open, delta: -1, minimum: 0}
  - {type: world_resource_delta, resource_id: fresh_water, delta: 6, maximum: 30}
  - {type: world_property_delta, property: public_confidence, delta: -0.05, minimum: 0}
  - type: public_event
    event: public_decision.made
    summary: 公社决定今天收紧配给。淡水留住了，但住户之间的抱怨也多了起来。
    data: {decision: rationing}
  success: {condition: actor.alive, result: rationing_decided}
  failure: {condition: actor.incapacitated, result: decision_failed}
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: repair_priority_today
  version: 1
  description: 今日公共决策：把劳力集中到潮门，先补最危险的缺口。
  parameters: {}
  preconditions: [actor.alive, world.public_decision_open >= 1]
  duration: {minutes: 90}
  costs:
    reserve: {}
    per_minute: {stamina: 0.12}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: public_decision_open, delta: -1, minimum: 0}
  - {type: world_property_delta, property: tide_gate_integrity, delta: 0.05, maximum: 1}
  - {type: world_resource_delta, resource_id: fresh_water, delta: -4, minimum: 0}
  - type: public_event
    event: public_decision.made
    summary: 公社把今天的劳力集中到潮门。闸室更稳了，但淡水的余量少了一截。
    data: {decision: repair_priority}
  success: {condition: actor.alive, result: repair_priority_decided}
  failure: {condition: actor.incapacitated, result: decision_failed}
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: marsh_rest_today
  version: 1
  description: 今日公共决策：让沼泽和居民休养一天，接受潮门暂时少一点维护。
  parameters: {}
  preconditions: [actor.alive, world.public_decision_open >= 1]
  duration: {minutes: 60}
  costs:
    reserve: {}
    per_minute: {stamina: 0.02}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - {type: world_property_delta, property: public_decision_open, delta: -1, minimum: 0}
  - {type: world_property_delta, property: public_confidence, delta: 0.05, maximum: 1}
  - {type: world_property_delta, property: tide_gate_integrity, delta: -0.02, minimum: 0}
  - {type: need_delta, need: belonging, delta: 4}
  - type: public_event
    event: public_decision.made
    summary: 公社让沼泽和居民休养一天。人心稳了一点，但潮门今天没有变得更结实。
    data: {decision: marsh_rest}
  success: {condition: actor.alive, result: marsh_rest_decided}
  failure: {condition: actor.incapacitated, result: decision_failed}
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
