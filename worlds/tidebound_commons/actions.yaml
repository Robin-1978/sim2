- id: final_night_repair
  verb: repair
  version: 1
  description: 风暴前最后一夜，把所有还能动的人叫到闸室，通宵补结构与临时支撑；代价是所有人的精力。
  parameters: {}
  preconditions: [actor.alive, world.storm_final_watch == 1, location.tag.infrastructure]
  duration: {minutes: 180}
  costs:
    reserve: {}
    per_minute: {stamina: 0.22}
    on_success: {}
    on_failure: {}
    refund: {}
