origins:
  - id: steward
    name: 潮务学徒
    description: 跟着玛拉学习测量与维护，懂得公共材料来之不易。
    starting_goal: 让公社撑过下一次风暴，并让每一次修复的代价都公开。
    traits:
      尽责: 0.72
      谨慎: 0.6
    capabilities:
      stewardship: 0.55
      crafting: 0.45
    inventory:
      food_ration: 1
      repair_kit: 1
    knowledge_seed:
      - 玛拉说过：潮门每次只修一处，先量再修，别把工具包浪费在看不到的裂缝上。
    opening:
      event_type: origin.steward
      summary: 你以潮务学徒的身份加入公社。玛拉把维护账本推到你面前：先测量潮门，再决定今天的材料用在哪儿。
  - id: forager
    name: 沼泽采集者
    description: 熟悉潮沟与贝滩，知道哪一片浅滩还能再采一次。
    starting_goal: 让食物和净水持续流动，同时不把沼泽采空。
    traits:
      机敏: 0.7
      耐劳: 0.65
    capabilities:
      gathering: 0.6
      exploration: 0.45
    inventory:
      shellfish: 2
      fresh_water: 1
    knowledge_seed:
      - 老采集者叮嘱：贝滩每采一轮要留一半，潮沟恢复得比人想的慢。
    opening:
      event_type: origin.forager
      summary: 你以沼泽采集者的身份加入公社。先测量潮门，再去浅滩带回第一篓贝类；潮沟还能再撑一轮，但别把贝滩采空。
  - id: chart_keeper
    name: 海图学徒
    description: 替塞琳整理观测记录，相信一条路线必须能被别人重复走通。
    starting_goal: 补全沉没海图，找到一条真正可走的低潮通道。
    traits:
      好奇: 0.75
      有条理: 0.6
    capabilities:
      research: 0.55
      exploration: 0.5
    inventory:
      food_ration: 1
      marsh_reed: 1
    knowledge_seed:
      - 塞琳说过：一条海图路线必须能被别人重复走通，否则只是传闻。
    opening:
      event_type: origin.chart_keeper
      summary: 你以海图学徒的身份加入公社。先测量潮门，再去观测台验证沉没海图的第一阶段；别急着画完整条航线。
  - id: ferry_runner
    name: 渡船信使
    description: 在码头与闸室之间送信，认识公社里几乎每一个人。
    starting_goal: 把有用的发现带到每一个住户手里，不让消息停在半路。
    traits:
      善谈: 0.72
      胆大: 0.55
    capabilities:
      conversation: 0.65
      exploration: 0.5
    inventory:
      fresh_water: 1
      food_ration: 1
    knowledge_seed:
      - 码头的老规矩：消息先送到闸室，再送到住户手里，不能停在半路。
    opening:
      event_type: origin.ferry_runner
      summary: 你以渡船信使的身份加入公社。先测量潮门，再把风暴倒计时带给玛拉和每一位住户；消息不能停在码头。
