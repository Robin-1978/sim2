name: 潮汐公社
premise: 四名居民守着一段破损的潮门和一座半沉的观测台，必须在修复海堤、补全海图与重开外海航路之间做出选择，并让每一次采集都留给沼泽恢复的余地。
genre: 海岸生存与公共抉择
locale: zh-CN
ui:
  crisis_metrics:
  - {property: tide_gate_integrity, label: 潮门完整性, format: percent, danger_below: 0.2, warning_below: 0.8, hint: 目标 80% · 支撑 40%}
  - {property: gate_supports, label: 临时支撑, format: percent, danger_below: 0.2, warning_below: 0.4, hint: 目标 40%}
  - {property: storm_eta_hours, label: 风暴倒计时, format: hours, danger_below: 3, warning_below: 8, hint: 下一次风暴}
  - {property: public_confidence, label: 公共信心, format: percent, danger_below: 0.25, warning_below: 0.35, hint: 低于 35% 无法校准信号}
  tagline: 风暴季正在逼近。潮门、海图和人心，只能先救一样。
  cast_order: [mara, ivo, selene, taro, dockhand_nia, dockhand_ren]
  event_kinds:
    weather: [storm., weather., season.]
    decision: [public_decision, decision., confidence.]
    dialogue: [dialogue., conversation.]
    resource: [resource., ration, rope.]
    repair: [tide_gate., repair, signal., gate., gate_brace., rain_catcher., rainwater., commons.volunteer]
    trade: [market., trade.]
    story: [story., beat.]
    origin: [origin.]
