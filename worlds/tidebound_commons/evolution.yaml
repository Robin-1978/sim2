# Automatic evolution policy.
#
# This world deliberately ships no fixed plot.  Story and God are woken by
# verified events, and they must turn those facts into new beats, structures or
# definitions.  Cooldowns and distinct keys keep repeated harvests from
# producing the same chapter forever.  Stagnation is the safety net: if the
# commons goes too long without a genuinely new executable option, God is asked
# to evolve the world again instead of letting residents repeat a closed loop.
cadence:
  reflection: 1d
  innovation: 7d
  god: 3d
  god_structural: 7d
stagnation:
  window: 1d
  max_interval: 7d
  growth: structural
  progress_event_types:
  - research.progressed
  - research.completed
  - exploration.completed
  - capability.updated
  - institution.revised
  - tide_gate.repaired
  - signal.tuned
  - signal.route_open
  - civilization.milestone
  - world.change.world_property
  - world.change.rule
  - world.change.relationship
  - world.change.faction
director:
  cadence: 1d
  window: 3d
  targets: [place, verb, social, rule]
  # Use the separately configured `roles.director` model to choose the target.
  # A failed or invalid model answer falls back to the deterministic least-cell
  # policy inside the world tick.
  policy: llm
limits:
  max_ready_god_tasks: 4
contracts:
  # A cadence task has no event trigger, so it needs an explicit contract.
  # This is the structural review: add one new playable dimension, not one
  # more research source.
  god_structural:
    tools:
    - query_history
    - query_knowledge_gaps
    - propose_entity
    - propose_definition
    - propose_world_change
    - wait
    # One growth unit per Director plan.  The session cannot end on a proposal
    # that leaves the target cell at its baseline, and a stray extra proposal
    # cannot keep the turn open indefinitely.
    max_proposals: 3
    required_content:
      growth_cell: true
    purpose: 周期结构审查：按 season_plan 的目标 cell 增加一个新的可玩维度，而不是再写一个研究源。
    result: >-
      读取 <season_plan> 的 target cell 和 <world_growth_ledger> 的空格。只提交一个
      growth unit：如果目标是 place，创建一个可达新地点；如果是 verb，创建一个非研究
      Action 和绑定行为树；如果是 social，创建一个势力/关系并让它改变一个决定；如果是
      rule，创建一条会改变结果的规则。不要提交研究源、档案、账本、表格或任何只能用于
      study_source 的对象。新内容必须让现有角色现在就能执行；证据不足时 wait。
    assign_to:
    - 玛拉
wakes:
- id: research_synthesis
  'on': [research.progressed, research.completed]
  for: god
  count: 2
  every: 1d
  distinct_by: [source_id, stage_id]
  external: true
  tools:
  - query_history
  - query_knowledge_gaps
  - propose_entity
  - propose_world_change
  - wait
  purpose: 两个不同研究阶段已经完成；把新的海图或潮汐证据转成可玩的外部地点、势力关系或公共结构。
  result: >-
    只提交一个有证据支持且能马上进入玩法的变化：如果海图证明了新的路线，优先用
    propose_entity 创建一个连接到现有地点的 location（state.routes 至少包含一个现有
    地点，并提供正的 route_distances）；如果证据显示新的合作或冲突，使用
    propose_entity 创建一个 distinct faction 或 propose_world_change 更新真实关系。
    新内容必须让现有角色拥有可执行的下一步；不能声称尚未走过的新地点已经到达，不能
    重复已有地点、势力或研究问题。证据不足时 wait。
- id: god_after_place
  external: true
  'on': world.location.created
  for: god
  tools:
  - query_history
  - propose_definition
  - wait
  purpose: 新地点已经出现；给它补上一个可执行的非研究活动，避免死地点。
  result: >-
    读取触发证据里的新地点名称。只提交一个非研究 Action 和它的绑定行为树，在这个新地点
    执行，分配给玛拉，并立即可达可执行。不要重复创建地点，也不要创建研究源、档案、账本
    或表格。证据不足时 wait。
  definition_type: action
  assign_to:
  - 玛拉
- id: god_after_resource
  external: true
  'on': world.resource.created
  for: god
  tools:
  - query_history
  - propose_definition
  - wait
  purpose: 新资源节点已经出现；给它补上一个真正改变它的行为，避免只有库存没有玩法。
  result: >-
    读取触发证据里的新资源和地点名称。只提交一个非研究 Action 和它的绑定行为树，在这个
    地点执行，分配给玛拉，用 world_resource_delta 改变该资源，并产生一个新的结果事件。
    不要创建另一个资源、地点或研究源。证据不足时 wait。
  definition_type: action
  assign_to:
  - 玛拉
- id: story_after_verified_change
  'on':
  - gate.inspected
  - research.completed
  - tide_gate.repaired
  - tide_gate.ready
  - signal.tuned
  - signal.route_open
  - storm.warning
  - storm.breached
  - storm.held
  - storm.flooded
  - decision.aftermath
  - civilization.milestone
  - gate.braced
  - repair_kit.stored
  - rain_catcher.repaired
  - rainwater.harvested
  - market.barter_completed
  - gate.repair_needed
  - confidence.low
  - confidence.solidarity
  - season.advanced
  - commons.volunteer_repair
  for: story
  external: true
  every: 6h
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: 把已经提交的世界事实变成下一段可继续行动的公共剧情，不预写结局。
- id: story_after_supply_change
  'on':
  - resource.gathered
  - rations.preserved
  - rope.crafted
  - repair_kit.crafted
  for: story
  count: 4
  every: 12h
  distinct_by:
  - resource_id
  - result_kind
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: 让真实的采集与制作结果推动新的选择，而不是反复讲述同一次收成。
- id: story_after_dialogue
  'on': commons.conversation_completed
  for: story
  count: 4
  every: 6h
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: 把有依据的对话转化为公共问题或新的合作方向。
- id: god_after_public_work
  'on':
  - tide_gate.repaired
  - tide_gate.ready
  - signal.tuned
  - signal.route_open
  - storm.warning
  - storm.breached
  - storm.held
  - storm.flooded
  - decision.aftermath
  - civilization.milestone
  - gate.braced
  - repair_kit.stored
  - rain_catcher.repaired
  - rainwater.harvested
  - market.barter_completed
  - gate.repair_needed
  - confidence.low
  - confidence.solidarity
  - season.advanced
  - commons.volunteer_repair
  for: god
  external: true
  every: 1d
  tools:
  - query_history
  - query_knowledge_gaps
  - propose_entity
  - propose_definition
  - propose_world_change
  - wait
  purpose: 从已验证的公共工程中提出一个可达的新结构或可复用定义；如果现有选项足够就等待。
- id: god_after_supply_pressure
  'on':
  - resource.safety_low
  - resource.gathered
  for: god
  count: 4
  every: 2d
  distinct_by:
  - resource_id
  - result_kind
  tools:
  - query_history
  - propose_definition
  - wait
  purpose: 只在采集压力与当前库存支持时，提出保存、运输或再生方式的改进。
- id: god_on_stagnation
  'on': world.stagnation
  for: god
  tools:
  - query_history
  - query_knowledge_gaps
  - propose_entity
  - propose_definition
  - propose_world_change
  - wait
  purpose: 世界已经太久没有结构性成长；填最空的 growth cell（地点、动词、势力/关系或规则），不要再用一个研究源替代。
