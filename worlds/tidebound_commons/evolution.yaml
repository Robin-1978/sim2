cadence:
  reflection: 1d
wakes:
- id: inspection_story_source
  'on': gate.inspected
  for: story
  manual_only: true
- id: research_story_source
  'on': research.completed
  for: story
  manual_only: true
- id: gate_outcome_review
  'on': tide_gate.repaired
  for: god
  count: 2
  every: 3d
  tools:
  - query_history
  - propose_definition
  - propose_entity
  - wait
  purpose: Repeated repairs are evidence that the commons needs a durable maintenance
    or transport structure.
  result: Propose one conserved, reachable structure or reusable behavior that uses
    existing materials; do not mint stock or repeat the same repair behavior.
- id: marsh_flow_review
  'on': resource.gathered
  for: god
  count: 4
  every: 2d
  distinct_by:
  - resource_id
  - result_kind
  tools:
  - query_history
  - propose_definition
  - wait
  purpose: Repeated renewable harvest outcomes justify improving preservation, storage,
    or safe transport.
  result: Add one executable improvement only if the verified harvest and current
    inventory support it; otherwise wait.
- id: gate_story
  'on': tide_gate.repaired
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: Turn a verified repair into the next grounded public choice.
  result: Connect the repair to one already executable next behavior; never invent
    a storm outcome or a completed journey.
- id: public_milestone_story
  'on': tide_gate.ready
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A verified public threshold deserves a chapter transition.
  result: Describe the threshold and offer one concrete decision already supported
    by the world state.
- id: harvest_story
  'on': resource.gathered
  for: story
  count: 4
  every: 2d
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A physical harvest should connect to food or repair work.
  result: Continue from the conserved material that actually entered an inventory.
- id: kit_story
  'on': repair_kit.crafted
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A repair kit is a real preparation step, not a completed repair.
  result: Offer the repair behavior while preserving that the gate is still damaged.
- id: ration_story
  'on': rations.preserved
  for: story
  count: 2
  every: 12h
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: Preserved food changes the next safe choice.
  result: Mention the carried ration outcome without claiming public stock changed.
- id: conversation_story
  'on': commons.conversation_completed
  for: story
  count: 4
  every: 6h
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A grounded conversation can carry an existing fact to another character.
  result: Preserve testimony as testimony and suggest a behavior that can verify it.
- id: milestone_story
  'on': civilization.milestone
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A verified civic milestone changes the available chapter.
  result: Describe only the milestone that the evidence supports.
- id: gate_ready_god
  'on': tide_gate.ready
  for: god
  tools:
  - query_history
  - propose_entity
  - propose_definition
  - wait
  purpose: A repaired gate crossed a durable public threshold.
  result: Propose one grounded next structure or wait when the existing options suffice.
- id: signal_tuned_story
  'on': signal.tuned
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A real lens adjustment changes the reachable signal, but does not by itself
    open the route.
  result: Describe the measured tuning and preserve the remaining threshold work.
- id: signal_tuned_god
  'on': signal.tuned
  for: god
  count: 2
  tools:
  - query_history
  - propose_definition
  - propose_entity
  - wait
  purpose: Repeated signal tuning is evidence for a route-level continuation.
  result: Wait until the configured signal threshold is crossed, then propose one
    grounded external continuation.
- id: signal_story
  'on': signal.route_open
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A verified signal route opens a new chapter.
  result: Describe the route opportunity and one supported social choice.
- id: signal_god
  'on': signal.route_open
  for: god
  tools:
  - query_history
  - propose_entity
  - propose_definition
  - wait
  purpose: A stable signal can justify an external relationship or route object.
  result: Create at most one reachable structure or wait when no evidence-backed addition
    is needed.
- id: chart_milestone_god
  'on': civilization.milestone
  for: god
  tools:
  - query_history
  - query_knowledge_gaps
  - propose_entity
  - propose_definition
  - wait
  purpose: Verified public chart knowledge can justify a structural continuation.
  result: Continue an open gap or add one distinct world object only when the causal
    evidence supports it.
- id: storm_story
  'on': storm.warning
  for: story
  tools:
  - query_history
  - propose_story_beat
  - wait
  purpose: A verified storm threshold changes the value of preparation.
  result: Offer an executable preparation behavior and do not claim that damage already
    occurred.
- id: storm_god
  'on': storm.warning
  for: god
  tools:
  - query_history
  - propose_definition
  - propose_entity
  - wait
  purpose: A storm threshold is evidence for a structural preparation or route decision.
  result: Propose one reachable preparation only when existing behaviors cannot address
    the observed pressure; otherwise wait.
