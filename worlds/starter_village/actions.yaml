actions:
- id: travel_to
  version: 1
  description: 沿已知路线移动到目标地点
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  requires_destination: true
  completion:
    if_already_at_destination: true
  duration:
    mode: route_distance
  costs:
    reserve: {}
    per_minute:
      energy: 0.1
      exposure: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: actor.state.location_id == context.destination_id
    result: arrived
  effects:
  - type: location_set
    location_id: context.location_id
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: consume_food
  version: 1
  description: Consume one available food item and restore satiety.
  parameters:
    item_id: string
  parameter_defaults:
    item_id: first_food
  preconditions:
  - actor.alive
  - inventory.available
  duration:
    minutes: 1
  costs:
    reserve:
      item_parameter: item_id
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory.consume_item
    item: context.item_id
    quantity: 1
  - type: need_delta
    need: satiety
    delta: 30
  success:
    condition: food.consumed
    result: ate_food
  failure:
    condition: food.unavailable
    result: eating_failed
  interaction_policy: deny
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: withdraw_food
  version: 1
  description: Withdraw one ration from the configured shared food store.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.permission.food_withdrawal
  - location.tag.food_store
  duration:
    minutes: 15
  costs:
    reserve:
      village_food: 1
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: rations
    quantity: 1
  success:
    condition: ration.withdrawn
    result: ration_received
  failure:
    condition: village_food.empty
    result: ration_unavailable
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: buy_food
  version: 1
  description: Buy one ration from a configured market.
  parameters: {}
  preconditions:
  - actor.alive
  - location.tag.market
  duration:
    minutes: 10
  costs:
    reserve:
      coin: 1
      market_rations: 1
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: rations
    quantity: 1
  success:
    condition: ration.purchased
    result: ration_purchased
  failure:
    condition: market.empty
    result: ration_unavailable
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: rest
  version: 1
  description: 在安全地点休息
  parameters:
    location_id: string
  preconditions:
  - actor.at_location
  - location.safe
  duration:
    minutes: 60
  costs:
    reserve: {}
    per_minute:
      time: 1
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: need_delta
    need: energy
    delta: 2.0
  - type: state_delta
    state: exposure
    delta: -1
  - type: state_delta
    state: attention
    delta: -2
  success:
    condition: actor.state.energy >= 80
    result: rested
  failure:
    condition: danger.detected
    result: interrupted
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: gather_resource
  version: 1
  description: 在可见资源节点采集指定类型资源
  parameters:
    resource_tag: string
    location_id: string
  preconditions:
  - actor.can_gather
  - location.resource_node
  - route.known
  parameter_defaults:
    resource_tag: first_available_resource
  duration:
    minutes: 180
  costs:
    reserve:
      resource_parameter: resource_tag
      resource_amount: 2
    per_minute:
      energy: 0.25
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: context.resource_tag
    quantity: 2
  success:
    condition: resource.collected
    result: resource_collected
  failure:
    condition: resource.empty or actor.incapacitated
    result: gathering_failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: patrol_route
  version: 1
  description: 巡逻已知路线并记录发现
  parameters:
    route_id: string
  preconditions:
  - actor.role == watch_captain or actor.can_patrol
  - route.known
  duration:
    minutes: 120
  costs:
    reserve: {}
    per_minute:
      energy: 0.25
      exposure: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: route.completed
    result: patrol_reported
  failure:
    condition: hostile_contact
    result: emergency
  information:
    event_type: security.patrol_reported
    wake: []
    trend: true
    summary: The north gate route was patrolled and a report was recorded.
    fact_key: patrol:north_gate_loop
    fact: The north gate route was patrolled and a report was recorded.
    source_type: patrol
    confidence: 0.9
    result: patrol_reported
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: heal_target
  version: 1
  description: 使用可用治疗资源恢复目标状态
  parameters:
    target_id: string
  preconditions:
  - actor.role == herbalist
  - patient.in_clinic
  - medicine.available
  duration:
    minutes: 90
  costs:
    reserve:
      medicine: 1
    per_minute:
      energy: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: need_delta
    need: belonging
    delta: 0.2
  effects:
  - type: attribute_delta
    attribute: health
    delta: 30
    target: target
  success:
    condition: patient.fever_reduced
    result: patient_stabilized
  failure:
    condition: medicine.failed
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: heal_self
  version: 1
  description: Receive treatment at a configured health service.
  parameters: {}
  preconditions:
  - actor.alive
  - location.health_service
  - medicine.available
  duration:
    minutes: 90
  costs:
    reserve:
      medicine: 1
    per_minute:
      energy: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: attribute_delta
    attribute: health
    delta: 30
  success:
    condition: treatment.completed
    result: self_stabilized
  failure:
    condition: medicine.failed
    result: treatment_failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: core_catalog
  kind: atomic
  executor: effect_pipeline
- id: explore_area
  version: 1
  description: 探索一块尚未充分了解的区域并记录发现
  parameters:
    area_id: string
  preconditions:
  - actor.can_explore
  - route.known
  - area.not_fully_mapped
  duration:
    minutes: 300
  costs:
    reserve:
      rations: 1
    per_minute:
      energy: 0.2
      exposure: 0.3
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: area.survey_complete
    result: exploration_completed
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: communicate
  version: 1
  description: 与目标角色沟通并记录可传播信息
  parameters:
    target_id: string
    topic: string
    message: string
  parameter_defaults:
    topic: general
  preconditions:
  - actor.can_speak
  - target.available
  - communication.channel_open
  duration:
    minutes: 15
  costs:
    reserve: {}
    per_minute:
      attention: 1
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: dialogue.completed
    result: dialogue_recorded
  failure:
    condition: target.refused
    result: conversation_refused
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: research_source
  version: 1
  description: 研究可访问的信息源并记录事实
  parameters:
    source_id: string
  preconditions:
  - actor.can_research
  - source.accessible
  - research.new_fact_available
  duration:
    minutes: 240
  costs:
    reserve: {}
    per_minute:
      energy: 0.2
      attention: 0.4
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: research.new_fact_found
    result: research_completed
  failure:
    condition: source.destroyed
    result: failed
  progress:
    key: research:{source_id}
    scope: world
    amount: 1
    required: 2
    wake: [story, god]
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: inspect_object
  version: 1
  description: 检查可访问的物体、库存或设施
  parameters:
    object_id: string
  preconditions:
  - actor.can_inspect
  - object.available
  duration:
    minutes: 30
  costs:
    reserve: {}
    per_minute:
      attention: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: inventory.read_complete
    result: stock_reported
  failure:
    condition: location.locked
    result: denied
  information:
    event_type: observation.object_inspected
    summary: The configured object or stock was inspected.
    fact_template: "Inspected {name}; current amount is {amount}."
    source_type: inspection
    confidence: 0.85
    result: stock_reported
    record_object_discovery: false
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: negotiate
  version: 1
  description: 与目标角色协商交换或契约
  parameters:
    target_id: string
    topic: string
    message: string
  preconditions:
  - actor.can_negotiate
  - counterparty.available
  duration:
    minutes: 60
  costs:
    reserve: {}
    per_minute:
      attention: 0.6
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: negotiation.recorded
    result: terms_recorded
  failure:
    condition: trust.collapsed
    result: negotiation_failed
  effects:
  - type: relationship_delta
    relation: trust
    delta: 0.02
  information:
    event_type: negotiation.terms_recorded
    summary: Concrete proposed terms were recorded and delivered to the other participant for a separate response.
    result: terms_recorded
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: attack
  version: 1
  description: 使用指定武器攻击可达目标
  parameters:
    target_id: string
    weapon_id: string
  preconditions:
  - actor.alive
  - actor.can_attack
  - target.visible
  - target.reachable
  - combat.allowed
  duration:
    minutes: 6
  costs:
    reserve:
      weapon_durability: 0.1
    per_minute:
      energy: 0.8
      attention: 0.3
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: threat_delta
    delta: 0.2
  success:
    condition: attack.resolved
    result: attack_completed
  failure:
    condition: target.out_of_range
    result: attack_blocked
  effects:
  - type: attribute_delta
    attribute: health
    direction: subtract
    formula: actor.attack_power + weapon.damage - target.defense
    target: target
  - type: relationship_delta
    relation: hostility
    delta: 0.15
  interrupt_policy: cancel
  interaction_policy: deny
  executor: effect_pipeline
- id: defend
  version: 1
  description: 保持防御姿态并保护附近目标
  parameters:
    protected_target_id: string
  preconditions:
  - actor.alive
  - actor.can_defend
  - protected_target.available
  duration:
    minutes: 30
  costs:
    reserve: {}
    per_minute:
      energy: 0.3
      attention: 0.4
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: status_add
    status: guarded
    duration_minutes: 6
  success:
    condition: defense.window_complete
    result: defended
  failure:
    condition: actor.stunned
    result: interrupted
  information:
    event_type: defense.completed
    wake: []
    summary: A defensive response was completed at the configured position.
    result: defended
  interrupt_policy: interruptible
  interaction_policy: allow
  executor: effect_pipeline
- id: flee_to_safety
  version: 1
  description: 沿已知路线撤离到安全地点
  parameters:
    destination_id: string
  preconditions:
  - actor.alive
  - route.known
  - destination.safe_or_defensible
  duration:
    mode: route_distance
  costs:
    reserve: {}
    per_minute:
      energy: 0.5
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: actor.at_safe_location
    result: escaped
  failure:
    condition: actor.exhausted
    result: collapsed
  effects:
  - type: location_set
    location_id: context.destination_id
  information:
    event_type: safety.escaped
    result: escaped
  interrupt_policy: cancel
  interaction_policy: deny
  executor: effect_pipeline
- id: secure_boundary
  version: 1
  description: Carry out a configured boundary defense that reduces the active public threat.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.can_defend
  - location.tag.watch_post
  - world.north_gate_threat_level >= 0.7
  duration:
    minutes: 120
  costs:
    reserve: {}
    per_minute:
      energy: 0.3
      attention: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_property_delta
    property: north_gate_threat_level
    delta: -0.35
    minimum: 0.0
  success:
    condition: world.north_gate_threat_level < 0.7
    result: boundary_secured
  failure:
    condition: actor.incapacitated
    result: defense_interrupted
  information:
    event_type: defense.boundary_secured
    wake: []
    summary: A configured boundary defense reduced the verified public threat.
    result: boundary_secured
  interrupt_policy: pause
  interaction_policy: deny
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: sound_alarm
  version: 1
  description: 向村庄广播边界或战斗警报
  parameters:
    alarm_type: string
    location_id: string
  preconditions:
  - actor.can_sound_alarm
  - location.tag.watch_post
  - world.north_gate_alarm_ready >= 1
  duration:
    minutes: 3
  costs:
    reserve: {}
    per_minute:
      attention: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: alarm.broadcast
    result: alarm_raised
  failure:
    condition: alarm_device.broken
    result: failed
  information:
    event_type: alarm.raised
    wake: [story]
    summary: An alarm was broadcast from a configured watch post.
    result: alarm_raised
  interrupt_policy: cancel
  interaction_policy: allow
  executor: effect_pipeline
- id: craft_recipe
  version: 1
  description: 在可用工作站按配方制作物品
  parameters:
    recipe_id: string
    station_id: string
  preconditions:
  - actor.can_craft
  - recipe.available
  - station.available
  - inputs.available
  duration:
    mode: recipe_duration
  costs:
    reserve:
      recipe_inputs: 1
    per_minute:
      energy: 0.2
      attention: 0.5
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: outputs.created
    result: recipe_completed
  failure:
    condition: inputs.lost or station.damaged
    result: crafting_failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: recover_object
  version: 1
  description: Recover a discovered object from its configured location.
  parameters:
    object_id: string
  preconditions:
  - actor.alive
  - actor.can_investigate
  - object.available
  duration:
    minutes: 240
  costs:
    reserve:
      rations: 1
    per_minute:
      energy: 0.1
      exposure: 0.01
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: entity_state_set
    entity_id: context.object_id
    state: recovered
    value: true
  - type: world_property_delta
    property: public_trust
    delta: 0.04
  - type: public_event
    event: trade.ledger_recovered
  success:
    condition: object.recovered
    result: object_recovered
  failure:
    condition: actor.incapacitated
    result: recovery_failed
  interrupt_policy: pause
  interaction_policy: allow
  information:
    object_parameter: object_id
    record_object_discovery: true
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: install_entity
  version: 1
  description: Install a carried entity at a configured public location.
  parameters:
    entity_id: string
    location_id: string
  preconditions:
  - actor.alive
  - inventory.item_available
  - location.tag.watch_post
  duration:
    minutes: 20
  costs:
    reserve: {}
    per_minute:
      energy: 0.05
      attention: 0.3
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_remove
    item: context.entity_id
    quantity: 1
  - type: entity_state_set
    entity_id: context.entity_id
    state: installed
    value: true
  - type: entity_state_set
    entity_id: context.entity_id
    state: location_id
    value: context.location_id
  - type: world_property_delta
    property: north_gate_alarm_ready
    delta: 1
    maximum: 1
  success:
    condition: entity.installed
    result: entity_installed
  failure:
    condition: actor.incapacitated
    result: installation_failed
  information:
    event_type: entity.installed
    wake: [story, god]
    summary: A configured entity was installed at its target location.
    fact_template: "{name} is installed at {location} and ready for its configured use."
    source_type: deployment
    confidence: 1.0
    result: entity_installed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: mitigate_water
  version: 1
  description: Apply the configured water-safety measure after the contamination finding.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.can_research
  - actor.knowledge.researched:clean_water:contamination
  - world.water_quality < 0.9
  duration:
    minutes: 120
  costs:
    reserve: {}
    per_minute:
      energy: 0.15
      attention: 0.25
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_property_delta
    property: water_quality
    delta: 0.08
    maximum: 1.0
  success:
    condition: world.water_quality >= 0.8
    result: water_measure_applied
  failure:
    condition: actor.incapacitated
    result: water_measure_failed
  information:
    event_type: water.mitigation.applied
    wake: [god]
    summary: A configured water-safety measure was applied and its world result was recorded.
    result: water_measure_applied
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: stabilize_pact
  version: 1
  description: Perform the configured root-gate stabilization measure.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.can_research
  - actor.knowledge.researched:old_pact_tablet:origin
  - world.root_gate_stability < 0.9
  duration:
    minutes: 180
  costs:
    reserve: {}
    per_minute:
      energy: 0.2
      attention: 0.35
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_property_delta
    property: root_gate_stability
    delta: 0.08
    maximum: 1.0
  success:
    condition: world.root_gate_stability >= 0.7
    result: pact_stabilized
  failure:
    condition: actor.incapacitated
    result: pact_stabilization_failed
  information:
    event_type: pact.stability.improved
    wake: [god]
    summary: A configured pact-stabilization measure was completed and its world result was recorded.
    result: pact_stabilized
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: investigate_marks
  version: 1
  description: Investigate and classify a boundary mark instead of merely recording a patrol.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.can_investigate
  - location.tag.watch_post
  duration:
    minutes: 90
  costs:
    reserve: {}
    per_minute:
      energy: 0.2
      exposure: 0.15
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: route.completed
    result: marks_classified
  failure:
    condition: actor.incapacitated
    result: investigation_failed
  information:
    event_type: security.marks_classified
    wake: [story, god]
    summary: The boundary marks were investigated and classified.
    fact_key: security:north_gate_marks
    fact: The boundary marks were investigated and classified.
    source_type: investigation
    confidence: 0.9
    result: marks_classified
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
