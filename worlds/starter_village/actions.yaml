actions:
- id: travel_to
  version: 1
  description: 沿已知路线移动到目标地点
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  requires_destination: true
  duration:
    mode: route_distance
  costs:
    reserve: {}
    per_minute:
      energy: 0.1
      exposure: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: actor.location == target.location
    result: arrived
  effects:
  - type: location_set
    location_id: context.location_id
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: consume_food
  version: 1
  description: Consume one available food item and restore satiety.
  parameters:
    item_id: string
  parameter_defaults:
    item_id: first_food
  preconditions:
  - actor.alive
  - actor.has_food
  duration:
    minutes: 1
  costs:
    reserve:
      item_parameter: item_id
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory.consume_item
    item: context.item_id
    quantity: 1
  - type: need_delta
    need: satiety
    delta: 30
  success:
    condition: food.consumed
    result: ate_food
  failure:
    condition: food.unavailable
    result: eating_failed
  interaction_policy: deny
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: withdraw_food
  version: 1
  description: Withdraw one ration from the configured shared food store.
  parameters: {}
  preconditions:
  - actor.alive
  - actor.food_withdrawal
  - location.food_store
  duration:
    minutes: 10
  costs:
    reserve:
      village_food: 1
    per_minute: {}
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: rations
    quantity: 1
  success:
    condition: ration.withdrawn
    result: ration_received
  failure:
    condition: village_food.empty
    result: ration_unavailable
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: rest
  version: 1
  description: 在安全地点休息
  parameters:
    location_id: string
  preconditions:
  - actor.at_location
  - location.safe
  duration:
    minutes: 48
  costs:
    reserve: {}
    per_minute:
      time: 1
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: need_delta
    need: energy
    delta: 1.5
  - type: state_delta
    state: exposure
    delta: -1
  - type: state_delta
    state: attention
    delta: -2
  success:
    condition: actor.energy >= 80
    result: rested
  failure:
    condition: danger.detected
    result: interrupted
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: gather_resource
  version: 1
  description: 在可见资源节点采集指定类型资源
  parameters:
    resource_tag: string
    location_id: string
  preconditions:
  - actor.can_gather
  - location.resource_node
  - route.known
  parameter_defaults:
    resource_tag: first_available_resource
  duration:
    minutes: 144
  costs:
    reserve:
      resource_parameter: resource_tag
      resource_amount: 2
    per_minute:
      energy: 0.25
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: context.resource_tag
    quantity: 2
  success:
    condition: resource.collected
    result: resource_collected
  failure:
    condition: resource.empty or actor.incapacitated
    result: gathering_failed
  interrupt_policy: pause
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: patrol_route
  version: 1
  description: 巡逻已知路线并记录发现
  parameters:
    route_id: string
  preconditions:
  - actor.is_guard
  - route.known
  duration:
    minutes: 96
  costs:
    reserve: {}
    per_minute:
      energy: 0.25
      exposure: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: route.completed
    result: patrol_reported
  failure:
    condition: hostile_contact
    result: emergency
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: heal_target
  version: 1
  description: 使用可用治疗资源恢复目标状态
  parameters:
    target_id: string
  preconditions:
  - actor.is_healer
  - patient.in_clinic
  - medicine.available
  duration:
    minutes: 72
  costs:
    reserve:
      medicine: 1
    per_minute:
      energy: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: need_delta
    need: belonging
    delta: 0.2
  effects:
  - type: health_restore
    amount: 30
    target: target
  success:
    condition: patient.fever_reduced
    result: patient_stabilized
  failure:
    condition: medicine.failed
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: heal_self
  version: 1
  description: Receive treatment at a configured health service.
  parameters: {}
  preconditions:
  - actor.alive
  - location.health_service
  - medicine.available
  duration:
    minutes: 72
  costs:
    reserve:
      medicine: 1
    per_minute:
      energy: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: health_restore
    amount: 30
  success:
    condition: treatment.completed
    result: self_stabilized
  failure:
    condition: medicine.failed
    result: treatment_failed
  interrupt_policy: pause
  interaction_policy: allow
  definition_source: core_catalog
  kind: atomic
  executor: effect_pipeline
- id: explore_area
  version: 1
  description: 探索一块尚未充分了解的区域并记录发现
  parameters:
    area_id: string
  preconditions:
  - actor.can_explore
  - route.known
  - area.not_fully_mapped
  duration:
    minutes: 240
  costs:
    reserve:
      rations: 1
    per_minute:
      energy: 0.25
      exposure: 0.4
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: area.survey_complete
    result: exploration_completed
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: communicate
  version: 1
  description: 与目标角色沟通并记录可传播信息
  parameters:
    target_id: string
    topic: string
  preconditions:
  - actor.can_speak
  - target.available
  - communication.channel_open
  duration:
    minutes: 6
  costs:
    reserve: {}
    per_minute:
      attention: 1
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: dialogue.completed
    result: dialogue_recorded
  failure:
    condition: target.refused
    result: conversation_refused
  interrupt_policy: cancel
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: research_source
  version: 1
  description: 研究可访问的信息源并记录事实
  parameters:
    source_id: string
  preconditions:
  - actor.can_research
  - source.accessible
  duration:
    minutes: 192
  costs:
    reserve: {}
    per_minute:
      energy: 0.2
      attention: 0.8
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: research.new_fact_found
    result: research_completed
  failure:
    condition: source.destroyed
    result: failed
  interrupt_policy: pause
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: inspect_object
  version: 1
  description: 检查可访问的物体、库存或设施
  parameters:
    object_id: string
  preconditions:
  - actor.can_inspect
  - location.reachable
  duration:
    minutes: 24
  costs:
    reserve: {}
    per_minute:
      attention: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: inventory.read_complete
    result: stock_reported
  failure:
    condition: location.locked
    result: denied
  interrupt_policy: cancel
  interaction_policy: allow
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: negotiate
  version: 1
  description: 与目标角色协商交换或契约
  parameters:
    target_id: string
    topic: string
  preconditions:
  - actor.can_negotiate
  - counterparty.available
  duration:
    minutes: 36
  costs:
    reserve: {}
    per_minute:
      attention: 0.6
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: contract.signed
    result: contract_signed
  failure:
    condition: trust.collapsed
    result: negotiation_failed
  interrupt_policy: cancel
  definition_source: config
  kind: atomic
  executor: effect_pipeline
- id: attack
  version: 1
  description: 使用指定武器攻击可达目标
  parameters:
    target_id: string
    weapon_id: string
  preconditions:
  - actor.alive
  - actor.can_attack
  - target.visible
  - target.reachable
  - combat.allowed
  duration:
    minutes: 6
  costs:
    reserve:
      weapon_durability: 0.1
    per_minute:
      energy: 0.8
      attention: 0.3
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: threat_delta
    delta: 0.2
  success:
    condition: attack.resolved
    result: attack_completed
  failure:
    condition: target.out_of_range
    result: attack_blocked
  effects:
  - type: damage
    formula: actor.attack_power + weapon.damage - target.defense
    target: target
  - type: relationship_delta
    relation: hostility
    delta: 0.15
  interrupt_policy: cancel
  executor: effect_pipeline
- id: defend
  version: 1
  description: 保持防御姿态并保护附近目标
  parameters:
    protected_target_id: string
  preconditions:
  - actor.alive
  - actor.can_defend
  - protected_target.available
  duration:
    minutes: 24
  costs:
    reserve: {}
    per_minute:
      energy: 0.3
      attention: 0.4
    on_success: {}
    on_failure: {}
    refund: {}
  progress_effects:
  - type: status_add
    status: guarded
    duration_minutes: 6
  success:
    condition: defense.window_complete
    result: defended
  failure:
    condition: actor.stunned
    result: interrupted
  interrupt_policy: interruptible
  interaction_policy: allow
  executor: effect_pipeline
- id: flee_to_safety
  version: 1
  description: 沿已知路线撤离到安全地点
  parameters:
    destination_id: string
  preconditions:
  - actor.alive
  - route.known
  - destination.safe_or_defensible
  duration:
    mode: route_distance
  costs:
    reserve: {}
    per_minute:
      energy: 0.5
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: actor.at_safe_location
    result: escaped
  failure:
    condition: actor.exhausted
    result: collapsed
  interrupt_policy: cancel
  executor: effect_pipeline
- id: sound_alarm
  version: 1
  description: 向村庄广播边界或战斗警报
  parameters:
    alarm_type: string
    location_id: string
  preconditions:
  - actor.can_sound_alarm
  - location.watch_post
  duration:
    minutes: 6
  costs:
    reserve: {}
    per_minute:
      attention: 0.2
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: alarm.broadcast
    result: alarm_raised
  failure:
    condition: alarm_device.broken
    result: failed
  effects:
  - type: public_event
    event: alarm.raised
  interrupt_policy: cancel
  interaction_policy: allow
  executor: effect_pipeline
- id: craft_recipe
  version: 1
  description: 在可用工作站按配方制作物品
  parameters:
    recipe_id: string
    station_id: string
  preconditions:
  - actor.can_craft
  - recipe.available
  - station.available
  - inputs.available
  duration:
    mode: recipe_duration
  costs:
    reserve:
      recipe_inputs: 1
    per_minute:
      energy: 0.2
      attention: 0.5
    on_success: {}
    on_failure: {}
    refund: {}
  success:
    condition: outputs.created
    result: recipe_completed
  failure:
    condition: inputs.lost or station.damaged
    result: crafting_failed
  interrupt_policy: pause
  definition_source: config
  kind: atomic
  executor: effect_pipeline
