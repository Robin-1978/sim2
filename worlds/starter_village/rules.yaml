vital_attribute: health
capacity_attribute: energy
perception:
  visible_fields: [role, type, summary, description, public]
  visible_state_fields: [status, quantity, durability, created, readable, recovered, installed]
  audible_event_types: [dialogue.completed, trade.offer_created, trade.countered, trade.completed, alarm.sounded, defense.village_response, clinic.fever_reported]
  global:
    fields: [role, type, summary, description, public]
    state_fields: [status, location_id, quantity, durability, created, readable, recovered, installed]
minute_effects:
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.02
  events:
  - id: satiety_low
    event_type: need.satiety_low
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: enter
    trend: true
    summary: Satiety reached the configured eating threshold.
    data: {need: satiety, threshold: 40, signal_only: true}
  - id: satiety_recovered
    event_type: need.satiety_recovered
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: exit
    trend: true
    summary: Satiety rose above the configured eating threshold.
    data: {need: satiety, threshold: 40, signal_only: true}
- id: starvation_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 5
  effect:
    type: attribute_delta
    attribute: health
    delta: -2
  events:
  - id: starvation_damage
    event_type: need.starvation_damage
    edge: each
    trend: true
    summary: Critical low satiety caused health damage.
    data: {need: satiety, threshold: 5, attribute: health, delta: -2}
- id: energy_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: energy
    delta: 0.5
- id: exposure_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: exposure
    delta: -0.2
- id: attention_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: attention
    delta: -1
- id: relation_decay
  scope: relationship
  every_minutes: 144
  effect:
    relation_strength: -0.01
- id: fog_cycle
  scope: world
  every_minutes: 144
  effect:
    type: world_property_delta
    property: fog_level
    delta: 0.05
    maximum: 1.0
- id: winter_countdown
  scope: world
  every_minutes: 1440
  effect:
    type: world_property_delta
    property: winter_days_remaining
    delta: -1
    minimum: 0
route_minutes_per_hop: 5
public_locations_are_safe: true
location_tag_groups:
  safe: [safe]
  food: [food]
  resource_node: [food, resource, water, mine, forest]
  health_service: [health, clinic]
resource_entity_types: [resource, material]
resource_protected_state: protected
resource_regeneration:
- resource_id: grain
  every_minutes: 1440
  amount: 20
  cap: 80
- resource_id: herb_bundle
  every_minutes: 1440
  amount: 8
  cap: 40
- resource_id: clean_water
  every_minutes: 1440
  amount: 20
  cap: 100
- resource_id: iron_ore
  every_minutes: 10080
  amount: 4
  cap: 80
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - physiological_homeostasis
  - safety_and_uncertainty
  - relatedness
  - competence
  - autonomy
  - meaning_and_goal_progress
  - novelty
  - social_norms_and_external_pressure
capability_progression:
  cooking: {minimum_completed_outcomes: 3, max_delta: 0.08, max_value: 1.0}
  gather: {minimum_completed_outcomes: 3, max_delta: 0.08, max_value: 1.0}
  research: {minimum_completed_outcomes: 2, max_delta: 0.08, max_value: 1.0}
  navigation: {minimum_completed_outcomes: 3, max_delta: 0.08, max_value: 1.0}
civilization_progress:
  governance_capacity: {required: 5, wake: [story, god]}
  public_health: {required: 4, wake: [story, god]}
  trade_network: {required: 4, wake: [story, god]}
  food_system: {required: 5, wake: [story, god]}
capability_modifiers:
  cooking:
    craft_recipe:
      time_multiplier: {base: 1.0, per_value: -0.25, min: 0.75}
  navigation:
    travel_to:
      time_multiplier: {base: 1.0, per_value: -0.25, min: 0.75}
  gather:
    gather_resource:
      time_multiplier: {base: 1.0, per_value: -0.20, min: 0.80}
capability_aliases:
  explore: [exploration]
  speak: [conversation]
  communicate: [conversation]
  craft: [cooking, herbalism, forging]
  attack: [combat]
  defend: [defense]
  gather: [gather, farming, hunting, foraging]
  research: [research]
  inspect: [investigation, lore, accounting, governance]
  investigate: [investigation, tracking, lore, rumor_assessment]
  negotiate: [conversation]
  sound_alarm: [alarm]
  mediate: [conversation]
conflict_relation_types: [conflict]
memory_quality:
  semantic_similarity:
    enabled: true
    backend: onnx
    preload: true
    model: ""
    threshold: 0.88
    retrieval_threshold: 0.06
    embedding_retrieval_threshold: 0.18
world_change_policy:
  god_direct_properties: []
fallback_behavior_ids: [rest_and_recover, recover_at_safe_location, seek_treatment, eat_food, buy_food, get_food, gather_at_known_node, travel]
food_items: [rations, ration, cooked_meal]
satiety_alert_threshold: 40
decision_signals:
- need: satiety
  alert_threshold: 40
  below_message: "Food choices are relevant to this need."
  above_message: "Food is not currently needed. Choose another behavior."
interaction_policy:
  max_rounds: 3
  reply_cooldown_minutes: 120
  thread_window_minutes: 360
decision_policy:
  wait_backoff_minutes: [60, 120, 240, 480, 720]
  wake_events:
  - need.satiety_low
  - need.starvation_damage
  - behavior.failed
  - story.beat.activated
  - trade.offer_created
need_effects:
  dialogue.completed:
    belonging: 1
  trade.completed:
    belonging: 0.5
relationship_effects:
  dialogue.completed:
    - {relation: trust, delta: 0.02}
  trade.completed:
    - {relation: trust, delta: 0.05}
needs:
- id: satiety
  target: 80
  minimum: 0
  gamma: 1.8
  critical_threshold: 0.75
  critical_gain: 1.4
- id: safety
  target: 80
  minimum: 0
  gamma: 2.0
  critical_threshold: 0.7
  critical_gain: 1.8
- id: belonging
  target: 70
  minimum: 0
  gamma: 1.2
  critical_threshold: 0.8
  critical_gain: 0.8
- id: esteem
  target: 65
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.85
  critical_gain: 0.6
- id: self_actualization
  target: 60
  minimum: 0
  gamma: 1.1
  critical_threshold: 0.9
  critical_gain: 0.4
need_gates:
- from: safety
  to: self_actualization
  threshold: 0.8
  multiplier: 0.25
- from: satiety
  to: esteem
  threshold: 0.85
  multiplier: 0.4
world_rules:
- id: old_well_restriction
  condition: actor.faction_id not_in [root_keepers] and actor.permission.old_well == false
    and context.location_id == old_well
  effect: deny_access
  description: Only root keepers may perform actions at the Old Well.
- id: public_ration
  condition: resource.village_food < 120
  effect: council.ration_alert
  wake: [god]
  behavior_names: [Manage ration]
  description: Low public food should be reviewed by the world policy Agent.
