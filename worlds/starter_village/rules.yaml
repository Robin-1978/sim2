minute_effects:
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    need: satiety
    delta: -0.02
- id: energy_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    need: energy
    delta: 0.5
- id: exposure_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    state: exposure
    delta: -0.2
- id: attention_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    state: attention
    delta: -1
- id: relation_decay
  scope: relationship
  every_minutes: 144
  effect:
    relation_strength: -0.01
- id: fog_cycle
  scope: world
  every_minutes: 144
  effect:
    fog_level: 0.05
route_minutes_per_hop: 1
resource_regeneration:
- resource_id: grain
  every_minutes: 1440
  amount: 20
  cap: 80
- resource_id: herb_bundle
  every_minutes: 1440
  amount: 8
  cap: 40
- resource_id: clean_water
  every_minutes: 1440
  amount: 20
  cap: 100
- resource_id: iron_ore
  every_minutes: 10080
  amount: 4
  cap: 80
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - physiological_homeostasis
  - safety_and_uncertainty
  - relatedness
  - competence
  - autonomy
  - meaning_and_goal_progress
  - novelty
  - social_norms_and_external_pressure
fallback_behavior_ids: [rest_and_recover, recover_at_safe_location, seek_treatment, eat_food, get_food, get_food_here, gather_at_known_node, travel]
food_items: [rations, ration, cooked_meal]
need_effects:
  dialogue.completed:
    belonging: 1
  trade.completed:
    belonging: 0.5
needs:
- id: satiety
  target: 80
  minimum: 0
  gamma: 1.8
  critical_threshold: 0.75
  critical_gain: 1.4
- id: safety
  target: 80
  minimum: 0
  gamma: 2.0
  critical_threshold: 0.7
  critical_gain: 1.8
- id: belonging
  target: 70
  minimum: 0
  gamma: 1.2
  critical_threshold: 0.8
  critical_gain: 0.8
- id: esteem
  target: 65
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.85
  critical_gain: 0.6
- id: self_actualization
  target: 60
  minimum: 0
  gamma: 1.1
  critical_threshold: 0.9
  critical_gain: 0.4
need_gates:
- from: safety
  to: self_actualization
  threshold: 0.8
  multiplier: 0.25
- from: satiety
  to: esteem
  threshold: 0.85
  multiplier: 0.4
world_rules:
- id: old_well_restriction
  condition: actor.faction_id not_in [root_keepers] and actor.permission.old_well
    == false
  effect: deny_access
- id: public_ration
  condition: resource.village_food < 120
  effect: council.ration_alert
