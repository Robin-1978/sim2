minute_effects:
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    need: satiety
    delta: -0.02
  events:
  - id: satiety_low
    event_type: need.satiety_low
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: enter
    trend: true
    summary: Satiety reached the configured eating threshold.
    data: {need: satiety, threshold: 40, signal_only: true}
  - id: satiety_recovered
    event_type: need.satiety_recovered
    condition: actor.need.satiety <= context.satiety_alert_threshold
    edge: exit
    trend: true
    summary: Satiety rose above the configured eating threshold.
    data: {need: satiety, threshold: 40, signal_only: true}
- id: starvation_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 5
  effect:
    state: health
    delta: -2
  events:
  - id: starvation_damage
    event_type: need.starvation_damage
    edge: each
    trend: true
    summary: Critical low satiety caused health damage.
    data: {need: satiety, threshold: 5, health_delta: -2}
- id: energy_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    need: energy
    delta: 0.5
- id: exposure_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    state: exposure
    delta: -0.2
- id: attention_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    state: attention
    delta: -1
- id: relation_decay
  scope: relationship
  every_minutes: 144
  effect:
    relation_strength: -0.01
- id: fog_cycle
  scope: world
  every_minutes: 144
  effect:
    fog_level: 0.05
route_minutes_per_hop: 1
public_locations_are_safe: true
location_tag_groups:
  safe: [safe]
  food: [food]
  resource_node: [food, resource, water, mine, forest]
  health_service: [health, clinic]
resource_entity_types: [resource, material]
resource_protected_state: protected
resource_regeneration:
- resource_id: grain
  every_minutes: 1440
  amount: 20
  cap: 80
- resource_id: herb_bundle
  every_minutes: 1440
  amount: 8
  cap: 40
- resource_id: clean_water
  every_minutes: 1440
  amount: 20
  cap: 100
- resource_id: iron_ore
  every_minutes: 10080
  amount: 4
  cap: 80
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - physiological_homeostasis
  - safety_and_uncertainty
  - relatedness
  - competence
  - autonomy
  - meaning_and_goal_progress
  - novelty
  - social_norms_and_external_pressure
capability_aliases:
  explore: [exploration]
  speak: [conversation]
  communicate: [conversation]
  craft: [cooking, herbalism, forging]
  attack: [combat]
  defend: [defense]
  gather: [gather, farming, hunting, foraging]
  research: [research]
  inspect: [investigation, lore, accounting, governance]
  investigate: [investigation, tracking, lore, rumor_assessment]
  negotiate: [conversation]
  sound_alarm: [alarm]
  mediate: [conversation]
conflict_relation_types: [conflict]
memory_quality:
  semantic_similarity:
    enabled: true
    backend: onnx
    preload: true
    model: ""
    threshold: 0.88
    retrieval_threshold: 0.06
    embedding_retrieval_threshold: 0.18
fallback_behavior_ids: [rest_and_recover, recover_at_safe_location, seek_treatment, eat_food, buy_food, get_food, gather_at_known_node, travel]
food_items: [rations, ration, cooked_meal]
satiety_alert_threshold: 40
decision_signals:
- need: satiety
  alert_threshold: 40
  below_message: "Food choices are relevant to this need."
  above_message: "Food choices remain available; weigh their costs against other needs."
need_effects:
  dialogue.completed:
    belonging: 1
  trade.completed:
    belonging: 0.5
relationship_effects:
  dialogue.completed:
    - {relation: trust, delta: 0.02}
  trade.completed:
    - {relation: trust, delta: 0.05}
needs:
- id: satiety
  target: 80
  minimum: 0
  gamma: 1.8
  critical_threshold: 0.75
  critical_gain: 1.4
- id: safety
  target: 80
  minimum: 0
  gamma: 2.0
  critical_threshold: 0.7
  critical_gain: 1.8
- id: belonging
  target: 70
  minimum: 0
  gamma: 1.2
  critical_threshold: 0.8
  critical_gain: 0.8
- id: esteem
  target: 65
  minimum: 0
  gamma: 1.4
  critical_threshold: 0.85
  critical_gain: 0.6
- id: self_actualization
  target: 60
  minimum: 0
  gamma: 1.1
  critical_threshold: 0.9
  critical_gain: 0.4
need_gates:
- from: safety
  to: self_actualization
  threshold: 0.8
  multiplier: 0.25
- from: satiety
  to: esteem
  threshold: 0.85
  multiplier: 0.4
world_rules:
- id: old_well_restriction
  condition: actor.faction_id not_in [root_keepers] and actor.permission.old_well
    == false
  effect: deny_access
- id: public_ration
  condition: resource.village_food < 120
  effect: council.ration_alert
