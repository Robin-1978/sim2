cadence:
  reflection: 1d
  innovation: 1w
  god: 1w
  god_structural: 30d
triggers:
- id: food_crisis
  when: world.village_food < 120
  invoke: [liang_he, lin_bo, god_local]
- id: water_crisis
  when: world.water_quality < 0.50
  invoke: [qiao_ning, su_wu, god_local]
- id: boundary_threat
  when: world.north_gate_threat_level > 0.70
  invoke: [he_yan, lu_xingzhou, god_local]
- id: pact_instability
  when: world.root_gate_stability < 0.35
  invoke: [su_wu, qiao_ning, god_structural]
- id: goal_completed
  when: agent.goal.completed == true
  invoke: [agent_reflection, agent_decision]
limits:
  agent_reflection_calls_per_day: 1
  agent_innovation_calls_per_week: 1
  god_local_candidates_per_week: 3
  god_structural_candidates_per_month: 1
# Safety net for a closed loop: when no character gains a new executable option
# for a whole window and none of these durable-progress events were recorded,
# Platform publishes world.stagnation and God is asked to evolve the world.
stagnation:
  window: 1d
  max_interval: 7d
  progress_event_types:
  - research.progressed
  - research.completed
  - exploration.completed
  - capability.updated
  - institution.revised
  - civilization.milestone
  - world.change.world_property
  - world.change.rule
  - world.change.relationship
  - world.change.faction
wakes:
- "on": civilization.milestone
  for: god
- id: research_synthesis
  "on": research.completed
  for: god
  count: 5
  every: 1w
- id: governance_capacity
  "on": [governance.reviewed, ration.policy_reviewed]
  for: god
  count: 8
  every: 1w
- id: trade_network
  "on": negotiation.terms_recorded
  for: god
  count: 6
  every: 1w
- id: public_incident
  "on": [water.mitigation.applied, pact.stability.improved, security.marks_classified, entity.installed, defense.village_response, defense.position_result]
  for: god
  count: 1
  every: 1d
  tools: [propose_world_change, record_world_progress, wait]
  purpose: Review the grouped validated incident outcomes and submit one typed world change only when the evidence supports it.
  result: Submit one grounded rule, relationship, faction or progress change, or wait when no durable change is justified.
- "on": 'rule:*'
  for: god
- id: god_on_stagnation
  "on": world.stagnation
  for: god
  tools: [query_history, query_knowledge_gaps, propose_entity, propose_definition, wait]
  purpose: No character has gained a new executable option for a full window, so the village may be repeating a closed loop.
  result: Propose one grounded, reachable structure or definition that opens a distinct next step, or wait only when the diagnostics show none is justified.
