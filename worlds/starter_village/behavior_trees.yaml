behavior_trees:
- id: travel
  version: 1
  scope: universal
  summary: Travel to a known connected location.
  description: Move along a known route to the selected destination.
  entry_conditions:
  - actor.mobile
  estimated_minutes: 5
  interrupt_policy: cancel
  goal_tags: [movement, access]
  drive_tags: [autonomy, novelty]
  success_results: [arrived]
  failure_results: [route_unknown, blocked]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: rest_and_recover
  version: 1
  scope: universal
  summary: Recover energy at the current safe location.
  description: Recover energy and regain readiness before choosing another task.
  entry_conditions:
  - actor.alive
  - actor.state.energy < 100
  estimated_minutes: 60
  interrupt_policy: pause
  goal_tags: [recovery, readiness]
  drive_tags: [safety]
  success_results: [energy_restored, readiness_restored]
  failure_results: [unsafe_location, interrupted]
  nodes:
  - type: action
    action_id: rest
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: fallback
- id: govern_village
  version: 1
  scope: village_council
  entry_conditions:
  - actor.role == village_steward
  estimated_minutes: 30
  cooldown_minutes: 720
  goal_tags: [autonomy, stability, population]
  drive_tags: [safety, belonging, esteem]
  interrupt_policy: interruptible
  success_results:
  - rations_reviewed
  - risk_reviewed
  failure_results:
  - council_blocked
  outcome_effects:
  - {type: need_delta, need: esteem, delta: 0.5}
  - {type: need_delta, need: belonging, delta: 0.2}
  outcome_events:
  - event_type: governance.reviewed
    wake: []
    trend: true
    summary: Food reserves and settlement risk were reviewed by the steward.
    data: {results: [rations_reviewed, risk_reviewed]}
  outcome_facts:
  - id: governance_review
    fact_key: governance:latest_review
    fact: Food reserves and settlement risk were reviewed by the steward.
    source_type: governance
    confidence: 0.9
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: granary
  - type: action
    action_id: inspect_object
    parameters:
      object_id: village_food
  definition_source: config
  kind: base
- id: mediate_conflict
  version: 1
  scope: personal
  entry_conditions:
  - conflict.available
  - actor.can_mediate
  estimated_minutes: 15
  agent_parameters:
    topic: {type: string, required: true, max_length: 120, description: The concrete dispute being mediated.}
    message: {type: string, required: true, max_length: 1000, description: The opening mediation statement delivered to the selected participant.}
  success_results: [conflict_resolved, relationship_repaired]
  failure_results: [conflict_escalated, participant_refused]
  outcome_effects:
  - {type: relationship_delta, relation: trust, delta: 0.04}
  outcome_events:
  - event_type: conflict.mediation_completed
    wake: [story]
    trend: true
    summary: A configured conflict mediation result was recorded.
  outcome_facts:
  - id: mediation_result
    fact_key: conflict:latest_mediation
    fact: A conflict mediation result was recorded for later review.
    source_type: mediation
    confidence: 0.8
  nodes:
  - type: action
    action_id: communicate
    parameters:
      target_id: context.target_id
      topic: context.topic
      message: context.message
  - type: condition
    expression: conflict.resolved
  definition_source: config
  kind: base
- id: inspect_granary
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_inspect
  estimated_minutes: 35
  cooldown_minutes: 720
  goal_tags: [food, reserve, winter]
  drive_tags: [safety]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: granary
  - type: action
    action_id: inspect_object
    parameters:
      object_id: village_food
  success_results: [stock_reported]
  failure_results: [denied, interrupted]
  definition_source: config
  kind: base
- id: patrol_route
