- id: eat_food
  version: 1
  scope: universal
  summary: Eat one available food item.
  description: Consume one carried food item to restore satiety before choosing another task.
  entry_conditions:
  - actor.alive
  - actor.has_food
  - actor.satiety <= context.food_trigger_satiety
  estimated_minutes: 1
  requirements: ["Carry one food item: rations, ration, or cooked_meal."]
  goal_tags: [food, recovery, readiness]
  drive_tags: [physiological_homeostasis, safety]
  interrupt_policy: cancel
  success_results: [ate_food]
  failure_results: [eating_failed]
  nodes:
  - type: action
    action_id: consume_food
    parameters:
      item_id: context.item_id
  definition_source: config
  kind: fallback
- id: get_food
  version: 1
  scope: universal
  summary: Travel to the granary and withdraw one ration.
  description: Walk to the shared food store, then complete the configured ration service.
  entry_conditions:
  - actor.alive
  - actor.food_withdrawal
  - route.known
  - actor.satiety <= context.food_trigger_satiety
  requirements: ["A known route to the granary and permission to withdraw food."]
  goal_tags: [food, reserve, survival]
  drive_tags: [physiological_homeostasis, safety]
  interrupt_policy: cancel
  success_results: [ration_received]
  failure_results: [ration_unavailable]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: granary
  - type: action
    action_id: withdraw_food
  definition_source: config
  kind: fallback
- id: buy_food
  version: 1
  scope: universal
  summary: Buy one ration at the local market.
  description: Spend one coin at the market for one ration when carried food is unavailable.
  entry_conditions:
  - actor.alive
  - location.market
  - actor.satiety <= context.food_trigger_satiety
  requirements: ["You are at the market and carry at least one coin; market stock must remain." ]
  goal_tags: [food, survival, trade]
  drive_tags: [physiological_homeostasis, autonomy]
  interrupt_policy: cancel
  success_results: [ration_purchased]
  failure_results: [ration_unavailable]
  nodes:
  - type: action
    action_id: buy_food
  definition_source: config
  kind: fallback
- id: recover_caravan_ledger
  version: 1
  scope: personal
  summary: Recover the missing caravan ledger.
  description: Search the explored Greywood edge and recover the ledger that can reopen the trade route.
  entry_conditions:
  - actor.alive
  - actor.can_investigate
  estimated_minutes: 180
  requirements: ["The Greywood ledger clue has been discovered and you can investigate." ]
  goal_tags: [trade, knowledge, route, autonomy]
  drive_tags: [autonomy, esteem, self_actualization]
  interrupt_policy: pause
  success_results: [ledger_recovered, trade_route_evidence]
  failure_results: [recovery_failed, interrupted]
  nodes:
  - type: action
    action_id: recover_object
    parameters:
      object_id: caravan_ledger
  definition_source: config
  kind: unlocked
