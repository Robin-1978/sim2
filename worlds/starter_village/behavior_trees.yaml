    action_id: travel_to
    parameters:
      location_id: north_gate
  - type: action
    action_id: patrol_route
    parameters:
      route_id: north_gate_loop
  definition_source: config
  kind: base
- id: manage_ration
  version: 1
  scope: personal
  entry_conditions:
  - actor.role == granary_keeper
