behavior_trees:
- id: travel
  version: 1
  scope: universal
  summary: Travel to a known connected location.
  description: Move along a known route to the selected destination.
  entry_conditions:
  - actor.mobile
  estimated_minutes: 1
  interrupt_policy: cancel
  goal_tags: [movement, access]
  drive_tags: [autonomy, novelty]
  success_results: [arrived]
  failure_results: [route_unknown, blocked]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: rest_and_recover
  version: 1
  scope: universal
  summary: Recover energy at the current safe location.
  description: Recover energy and regain readiness before choosing another task.
  entry_conditions:
  - actor.alive
  - actor.energy < 100
  estimated_minutes: 48
  interrupt_policy: pause
  goal_tags: [recovery, readiness]
  drive_tags: [safety]
  success_results: [energy_restored, readiness_restored]
  failure_results: [unsafe_location, interrupted]
  nodes:
  - type: action
    action_id: rest
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: fallback
- id: govern_village
  version: 1
  scope: village_council
  entry_conditions:
  - actor.is_steward
  estimated_minutes: 30
  cooldown_minutes: 720
  goal_tags: [autonomy, stability, population]
  drive_tags: [safety, belonging, esteem]
  interrupt_policy: interruptible
  success_results:
  - rations_reviewed
  - risk_reviewed
  failure_results:
  - council_blocked
  outcome_effects:
  - {type: need_delta, need: esteem, delta: 0.5}
  - {type: need_delta, need: belonging, delta: 0.2}
  nodes:
  - type: action
    action_id: inspect_object
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: mediate_conflict
  version: 1
  scope: personal
  entry_conditions:
  - conflict.available
  - actor.can_mediate
  estimated_minutes: 6
  nodes:
  - type: action
    action_id: communicate
    parameters:
      target_id: context.target_id
      topic: context.topic
  - type: condition
    expression: conflict.resolved
  definition_source: config
  kind: base
- id: inspect_granary
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_inspect_granary
  estimated_minutes: 25
  goal_tags: [food, reserve, winter]
  drive_tags: [safety]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: granary
  - type: action
    action_id: inspect_object
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: patrol_route
  version: 1
  scope: village_watch
  entry_conditions:
  - actor.is_guard
  estimated_minutes: 97
  interrupt_policy: pause
  success_results:
  - patrol_reported
  - marks_classified
  failure_results:
  - emergency
  outcome_effects:
  - {type: need_delta, need: safety, delta: 0.3}
  - {type: need_delta, need: esteem, delta: 0.4}
  goal_tags: [safety, warning, patrol]
  drive_tags: [safety, esteem]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: north_gate
  - type: action
    action_id: patrol_route
    parameters:
      route_id: north_gate_loop
  definition_source: config
  kind: base
- id: manage_ration
  version: 1
  scope: personal
  entry_conditions:
  - actor.is_granary_keeper
  estimated_minutes: 30
  goal_tags: [food, ration, winter]
  drive_tags: [safety, belonging]
  nodes:
  - type: action
    action_id: inspect_object
    parameters:
      location_id: context.location_id
  - type: action
    action_id: communicate
    parameters:
      target_id: lin_bo
      topic: food_ration
  definition_source: config
  kind: base
- id: heal_target
  version: 1
  scope: personal
  entry_conditions:
  - actor.is_healer
  - patient.available
  estimated_minutes: 72
  interrupt_policy: pause
  goal_tags: [health, care]
  drive_tags: [belonging, safety]
  nodes:
  - type: action
    action_id: heal_target
    parameters:
      patient_id: context.patient_id
  definition_source: config
  kind: base
- id: explore_greywood
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_explore
  - actor.alive
  estimated_minutes: 247
  interrupt_policy: pause
  success_results:
  - exploration_completed
  - knowledge_updated
  failure_results:
  - lost
  - injured
  - emergency
  outcome_effects:
  - {type: need_delta, need: self_actualization, delta: 0.8}
  - {type: need_delta, need: esteem, delta: 0.2}
  goal_tags: [exploration, map, knowledge, missing_person]
  drive_tags: [self_actualization, esteem]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
