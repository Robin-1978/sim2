behavior_trees:
- id: travel
  version: 1
  scope: universal
  summary: Travel to a known connected location.
  description: Move along a known route to the selected destination.
  entry_conditions:
  - actor.mobile
  estimated_minutes: 1
  interrupt_policy: cancel
  goal_tags: [movement, access]
  drive_tags: [autonomy, novelty]
  success_results: [arrived]
  failure_results: [route_unknown, blocked]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: rest_and_recover
  version: 1
  scope: universal
  summary: Recover energy at the current safe location.
  description: Recover energy and regain readiness before choosing another task.
  entry_conditions:
  - actor.alive
  - actor.energy < 100
  estimated_minutes: 48
  interrupt_policy: pause
  goal_tags: [recovery, readiness]
  drive_tags: [safety]
  success_results: [energy_restored, readiness_restored]
  failure_results: [unsafe_location, interrupted]
  nodes:
  - type: action
    action_id: rest
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: fallback
- id: govern_village
  version: 1
  scope: village_council
  entry_conditions:
  - actor.is_steward
  estimated_minutes: 30
  cooldown_minutes: 720
  goal_tags: [autonomy, stability, population]
  drive_tags: [safety, belonging, esteem]
  interrupt_policy: interruptible
  success_results:
  - rations_reviewed
  - risk_reviewed
  failure_results:
  - council_blocked
  outcome_effects:
  - {type: need_delta, need: esteem, delta: 0.5}
  - {type: need_delta, need: belonging, delta: 0.2}
  nodes:
  - type: action
    action_id: inspect_object
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: mediate_conflict
  version: 1
  scope: personal
  entry_conditions:
