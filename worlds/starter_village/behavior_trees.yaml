  definition_source: config
  kind: base
- id: research_source
  version: 1
  scope: root_keepers
  entry_conditions:
  - actor.can_research
  - secret.source_available
  estimated_minutes: 192
  interrupt_policy: pause
  success_results:
  - new_pact_fact
  - ritual_candidate
  failure_results:
  - source_lost
  - belief_conflict
  outcome_effects:
  - {type: need_delta, need: self_actualization, delta: 0.8}
  nodes:
  - type: action
    action_id: research_source
    parameters:
      source_id: old_pact_tablet
  - type: condition
    expression: research.new_fact_found
  definition_source: config
  kind: base
- id: inspect_object
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_inspect
  estimated_minutes: 24
  nodes:
  - type: action
    action_id: inspect_object
    parameters:
      location_id: context.location_id
  definition_source: config
  kind: base
- id: defend_village
  version: 1
  scope: village_watch
  entry_conditions:
  - actor.is_guard
  - threat.at_village
  estimated_minutes: 36
  interrupt_policy: interruptible
  success_results:
  - threat_contained
  - civilians_safe
  failure_results:
  - defense_broken
  - retreat_required
  goal_tags: [safety, defense, civilians]
  drive_tags: [safety, belonging]
  nodes:
  - type: action
    action_id: sound_alarm
    parameters:
      alarm_type: village_attack
      location_id: watchtower
  - type: selector
    children:
    - defend_position
    - flee_to_safety
- id: defend_position
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_defend
  - threat.reachable
  estimated_minutes: 30
  interrupt_policy: interruptible
  nodes:
  - type: action
    action_id: defend
    parameters:
      protected_target_id: context.protected_target_id
  - type: action
    action_id: attack
    parameters:
      target_id: context.target_id
      weapon_id: context.weapon_id
- id: flee_to_safety
  version: 1
  scope: personal
  entry_conditions:
  - actor.alive
  - threat.overwhelming
  estimated_minutes: 96
  nodes:
  - type: action
    action_id: flee_to_safety
    parameters:
      destination_id: village_square
- id: sound_alarm
  version: 1
  scope: village_watch
  entry_conditions:
  - actor.can_sound_alarm
  - threat.detected
  estimated_minutes: 6
  nodes:
  - type: action
    action_id: sound_alarm
    parameters:
      alarm_type: boundary
      location_id: watchtower
- id: craft_meal
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_craft
  - recipe.available
  - inputs.available
  estimated_minutes: 60
  goal_tags: [food, cooking, winter]
  drive_tags: [safety, belonging]
  interrupt_policy: pause
  success_results:
  - food_created
  - capability_improved
  failure_results:
  - crafting_failed
  outcome_effects:
  - {type: need_delta, need: esteem, delta: 0.2}
  - {type: need_delta, need: self_actualization, delta: 0.3}
  nodes:
  - type: action
    action_id: craft_recipe
    parameters:
      recipe_id: cooked_meal
      station_id: context.station_id
- id: communicate
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_communicate
  - target.available
  estimated_minutes: 6
  nodes:
  - type: action
    action_id: communicate
    parameters:
      target_id: context.target_id
      topic: context.topic
  definition_source: config
  kind: base
  summary: Exchange information with another character.
- id: negotiate
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_communicate
  - target.available
  estimated_minutes: 36
  nodes:
  - type: action
    action_id: negotiate
    parameters:
      target_id: context.target_id
      topic: context.topic
  definition_source: config
  kind: base
  summary: Reach an agreement with another character.
- id: gather_resource
  version: 1
  scope: personal
  entry_conditions:
  - actor.can_gather
  - resource.available
  estimated_minutes: 144
  interrupt_policy: pause
  success_results:
  - action_completed
  failure_results:
  - action_failed
  nodes:
  - type: action
    action_id: gather_resource
    parameters:
      resource_tag: context.resource_tag
      location_id: context.location_id
  definition_source: config
  kind: base
  summary: Collect a configured resource from a known node.
- id: eat_food
  version: 1
  scope: universal
  summary: Eat one available food item.
  description: Consume one carried food item to restore satiety before choosing another task.
  entry_conditions:
  - actor.alive
  - actor.has_food
  - actor.satiety <= 80
  estimated_minutes: 1
  requirements: ["Carry one food item: rations, ration, or cooked_meal."]
  goal_tags: [food, recovery, readiness]
  drive_tags: [physiological_homeostasis, safety]
  interrupt_policy: cancel
  success_results: [ate_food]
  failure_results: [eating_failed]
  nodes:
  - type: action
    action_id: consume_food
    parameters:
      item_id: context.item_id
  definition_source: config
  kind: fallback
- id: get_food
  version: 1
  scope: universal
  summary: Travel to the granary and withdraw one ration.
  description: Walk to the shared food store, then complete the configured ration service.
  entry_conditions:
  - actor.alive
  - actor.food_withdrawal
  - route.known
  - actor.satiety <= 80
  requirements: ["A known route to the granary and permission to withdraw food."]
  goal_tags: [food, reserve, survival]
  drive_tags: [physiological_homeostasis, safety]
  interrupt_policy: cancel
  success_results: [ration_received]
  failure_results: [ration_unavailable]
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: granary
  - type: action
    action_id: withdraw_food
  definition_source: config
  kind: fallback
- id: get_food_here
  version: 1
  scope: universal
  agent_label: Withdraw one ration here
  summary: Withdraw one ration here.
  description: Complete the configured ration service at the shared food store.
  entry_conditions:
  - actor.alive
  - actor.food_withdrawal
  - location.food_store
  - actor.satiety <= 80
  requirements: ["You are at the granary and the shared food store has supply."]
  goal_tags: [food, reserve, survival]
  drive_tags: [physiological_homeostasis, safety]
  interrupt_policy: cancel
  success_results: [ration_received]
  failure_results: [ration_unavailable]
  nodes:
  - type: action
    action_id: withdraw_food
  definition_source: config
  kind: fallback
