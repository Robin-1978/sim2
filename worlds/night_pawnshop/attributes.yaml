attributes:
- id: integrity
  kind: state
  label: 体力
  unit: '%'
  min: 0
  max: 100
  default: 100
  vital: true
  cost_mode: decrease
  prompt: 身体状况；降到 0 就会倒下。
- id: stamina
  kind: state
  label: 精力
  unit: '%'
  min: 0
  max: 100
  default: 90
  capacity: true
  cost_mode: decrease
  prompt: 行动和赶路的短期余量，休息会恢复。
- id: hydration
  kind: need
  label: 水分
  unit: 点
  min: 0
  max: 100
  default: 78
  prompt: 0 表示严重脱水；喝茶或休息会恢复。
- id: satiety
  kind: need
  label: 饱食
  unit: 点
  min: 0
  max: 100
  default: 72
  prompt: 0 表示饥饿；夜市的茶点会恢复。
- id: belonging
  kind: need
  label: 归属
  unit: 点
  min: 0
  max: 100
  default: 58
  prompt: 与客人和这座城之间的连接感。
- id: purpose
  kind: need
  label: 意义
  unit: 点
  min: 0
  max: 100
  default: 60
  prompt: 对当铺和姑妈留下的谜有掌控感。
