    action_id: upgrade_safe_2
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - craft
  drive_tags:
  - purpose
- id: close_night_basic
  agent_label: 关店，等天亮
  summary: 结束今晚，基本账本恢复 3 个行动
  description: 灯灭之后，新案子会在明天出现；旧案子会过期。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night < 21
  - world.ledger_level == 0
  - world.campaign_over < 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: close_night_basic
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - autonomy
- id: close_night_ledger1
  agent_label: 关店，等天亮
  summary: 结束今晚，厚账本恢复 4 个行动
  description: 灯灭之后，新案子会在明天出现；旧案子会过期。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night < 21
  - world.ledger_level == 1
  - world.campaign_over < 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: close_night_ledger1
    parameters: {}
  success_results: *id001
