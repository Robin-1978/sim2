behavior_trees:
- id: travel
  agent_label: 前往
  summary: 沿已知路线前往一个地点
  description: 在雾港的石板路上换一个地点。
  entry_conditions:
  - route.known
  - actor.mobile
  estimated_minutes: 10
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: travel_to
    parameters:
      location_id: context.location_id
  success_results: &id001
  - completed
  failure_results: &id002
  - action_failed
  - interrupted
  goal_tags:
  - travel
  drive_tags:
  - autonomy
- id: appraise_item
  agent_label: 鉴定物品
  summary: 在账房鉴定一件东西
  description: 把东西放到鉴定镜下，读出刻字、纸边和来路。
  entry_conditions:
  - actor.alive
  - location.tag.appraisal
  estimated_minutes: 20
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: appraise_item
    parameters:
      entry_id: context.entry_id
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - public
  - investigation
  drive_tags:
  - purpose
  catalog: appraise
  agent_parameters:
    entry_id:
      type: string
      required: true
      max_length: 120
      description: 选择一件当前可鉴定的东西。
- id: trade_pawnshop
  agent_label: 当铺柜台
  summary: 在柜台收当、归还或赎回
  description: 在柜台前处理客人的东西：收当、归还、赎回。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  estimated_minutes: 5
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: trade_offer
    parameters:
      entry_id: context.entry_id
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - trade
  drive_tags:
  - purpose
  catalog: trade_offers
  agent_parameters:
    entry_id:
      type: string
      required: true
      max_length: 160
      description: 选择一个当前可见的柜台报价。
- id: trade_watch
  agent_label: 港务局交易
  summary: 在港务局卖出或举报
  description: 把东西交给港务局，或把人和东西一起报上去。
  entry_conditions:
  - actor.alive
  - location.tag.watch
  estimated_minutes: 5
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: trade_offer
    parameters:
      entry_id: context.entry_id
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - trade
  drive_tags:
  - purpose
  catalog: trade_offers
  agent_parameters:
    entry_id:
      type: string
      required: true
      max_length: 160
      description: 选择一个当前可见的港务局报价。
- id: trade_chapel
  agent_label: 修会交易
  summary: 在修会卖出或归还
  description: 把东西交给灰袍修会，换金币或他们的信任。
  entry_conditions:
  - actor.alive
  - location.tag.chapel
  estimated_minutes: 5
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: trade_offer
    parameters:
      entry_id: context.entry_id
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - trade
  drive_tags:
  - purpose
  catalog: trade_offers
  agent_parameters:
    entry_id:
      type: string
      required: true
      max_length: 160
      description: 选择一个当前可见的修会报价。
- id: trade_collector
  agent_label: 收藏家交易
  summary: 在沙龙卖出或谈价
  description: 把东西卖给收藏家，换更高的价钱和更高的怀疑。
  entry_conditions:
  - actor.alive
  - location.tag.collector
  estimated_minutes: 5
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: trade_offer
    parameters:
      entry_id: context.entry_id
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - trade
  drive_tags:
  - purpose
  catalog: trade_offers
  agent_parameters:
    entry_id:
      type: string
      required: true
      max_length: 160
      description: 选择一个当前可见的收藏家报价。
- id: pay_debt_1
  agent_label: 还第一笔债
  summary: 把 60 枚金币交给港务局
  description: 第一笔债在第 7 夜到期；还清才能谈以后。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night >= 7
  - world.debt_stage == 0
  - actor.inventory.coin >= 60
  estimated_minutes: 30
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: pay_debt_1
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: pay_debt_2
  agent_label: 还第二笔债
  summary: 把 90 枚金币交给港务局
  description: 第二笔债在第 14 夜到期；还清才能撑到审计。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night >= 14
  - world.debt_stage == 1
  - actor.inventory.coin >= 90
  estimated_minutes: 30
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: pay_debt_2
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: pay_debt_3
  agent_label: 还最后一笔债
  summary: 把 140 枚金币交给港务局
  description: 最后一笔债在第 21 夜到期；还清才有资格选择结局。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night >= 21
  - world.debt_stage == 2
  - actor.inventory.coin >= 140
  estimated_minutes: 30
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: pay_debt_3
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: upgrade_ledger_1
  agent_label: 换厚账本
  summary: 花 40 金币，每夜多一个行动
  description: 账本越厚，能同时处理的客人越多。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.ledger_level == 0
  - actor.inventory.coin >= 40
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: upgrade_ledger_1
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - craft
  drive_tags:
  - purpose
- id: upgrade_ledger_2
  agent_label: 换活页账本
  summary: 花 80 金币，每夜再多一个行动
  description: 活页账本能同时夹住更多当票，也更容易被抽查。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.ledger_level == 1
  - actor.inventory.coin >= 80
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: upgrade_ledger_2
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - craft
  drive_tags:
  - purpose
- id: upgrade_appraisal_2
  agent_label: 装黄铜放大镜
  summary: 花 60 金币，鉴定台升级
  description: 纸纤维里的旧水印，只有放大镜看得清。
  entry_conditions:
  - actor.alive
  - location.tag.appraisal
  - world.appraisal_level == 1
  - actor.inventory.coin >= 60
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: upgrade_appraisal_2
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - craft
  drive_tags:
  - purpose
- id: upgrade_safe_1
  agent_label: 加一层暗格
  summary: 花 35 金币，减少搜查损失
  description: 柜台下多一层暗格，搜查时至少能保住时间。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.safe_level == 0
  - actor.inventory.coin >= 35
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: upgrade_safe_1
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - craft
  drive_tags:
  - purpose
- id: upgrade_safe_2
  agent_label: 扩墙里暗格
  summary: 花 70 金币，搜查不再损失时间
  description: 墙里的暗格足够放下整本账。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.safe_level == 1
  - actor.inventory.coin >= 70
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
