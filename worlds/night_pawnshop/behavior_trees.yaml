- id: pact_collector
  agent_label: 和收藏家签约
  summary: 第 10 夜后三选一
  description: 收下银票，替他们留一件“有门”的东西。
  entry_conditions:
  - actor.alive
  - location.tag.collector
  - world.night >= 10
  - world.faction_pact == 0
  - world.collector_rep >= 0.2
  estimated_minutes: 30
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: pact_collector
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: read_aunt_ledger
  agent_label: 读姑妈的账本
  summary: 7 条线索后读缺页账本
  description: 缺页账本里藏着姑妈最后一句交代。
  entry_conditions:
  - actor.alive
  - location.tag.appraisal
  - world.clues >= 7
  - world.aunt_ledger_read < 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: read_aunt_ledger
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - public
  drive_tags:
  - purpose
- id: open_sea_gate
  agent_label: 打开海门
  summary: 第 21 夜，持钥匙和 10 条线索
  description: 铜钥匙不是用来锁门的，是用来放人走的。
  entry_conditions:
  - actor.alive
  - location.tag.pier
  - world.night >= 21
  - world.clues >= 10
  - world.aunt_ledger_read >= 1
  - world.sea_gate_open < 1
  - actor.inventory.brass_key >= 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: open_sea_gate
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: finish_campaign
  agent_label: 关店，迎接审计
  summary: 结束这一季，进入章节结局
  description: 把账本、钥匙和这一夜的灯一起摆上柜台。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night >= 21
  - world.campaign_over < 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
