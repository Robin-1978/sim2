- id: close_night_ledger2
  agent_label: 关店，等天亮
  summary: 结束今晚，活页账本恢复 5 个行动
  description: 灯灭之后，新案子会在明天出现；旧案子会过期。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.night < 21
  - world.ledger_level == 2
  - world.campaign_over < 1
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: close_night_ledger2
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - autonomy
- id: bribe_watch
  agent_label: 打点港务局
  summary: 花 30 金币，降低怀疑
  description: 值夜书吏收钱办事；但一晚只能打点一次。
  entry_conditions:
  - actor.alive
  - location.tag.watch
  - world.bribe_used < 1
  - world.suspicion >= 0.2
  - actor.inventory.coin >= 30
  estimated_minutes: 20
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: bribe_watch
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: odd_job
  agent_label: 在夜市做短工
  summary: 花 1 个行动换 6 金币
  description: 当铺没生意时，夜市还有搬货、修锁和写信的活。
  entry_conditions:
  - actor.alive
  - location.tag.work
  - world.night_actions >= 1
  estimated_minutes: 120
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: odd_job
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - trade
  drive_tags:
  - autonomy
- id: pact_watch
  agent_label: 和港务局签约
  summary: 第 10 夜后三选一
  description: 用一点自由换一点喘息；港务局会记住这份人情。
  entry_conditions:
  - actor.alive
  - location.tag.watch
  - world.night >= 10
  - world.faction_pact == 0
  - world.watch_rep >= 0.2
  estimated_minutes: 30
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: pact_watch
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: pact_chapel
  agent_label: 和灰袍修会签约
  summary: 第 10 夜后三选一
  description: 把后门借给病人；修会会记住这盏灯。
  entry_conditions:
  - actor.alive
  - location.tag.chapel
  - world.night >= 10
  - world.faction_pact == 0
  - world.chapel_rep >= 0.2
  estimated_minutes: 30
  cooldown_minutes: 0
