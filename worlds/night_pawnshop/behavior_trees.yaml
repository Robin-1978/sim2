    action_id: finish_campaign
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: begin_next_season
  agent_label: 开始下一季
  summary: 保留当铺、客人和账本，开始新一季
  description: 审计只是章节，不是世界末日。新一季的债务会重新压在柜台上。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - world.campaign_over >= 1
  - world.season < 99
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: begin_next_season
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - decision
  drive_tags:
  - purpose
- id: rest_at_shop
  agent_label: 在柜台后休息
  summary: 恢复精力
  description: 靠一会儿，听外面的雨。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  estimated_minutes: 60
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: rest_at_shop
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
  - recovery
  drive_tags:
  - safety
- id: tea_at_stall
  agent_label: 在夜市喝茶
  summary: 花 2 金币恢复水分和饱食
  description: 热茶和咸饼是雾港夜里最便宜的一点安慰。
  entry_conditions:
  - actor.alive
  - location.tag.food
  - actor.inventory.coin >= 2
  estimated_minutes: 15
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: tea_at_stall
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
