- id: linger_at_counter
  agent_label: 在柜台前等候
  summary: 坐在当铺长凳上等下一个客人
  description: 客人抱着东西，安静地等柜台后的灯抬起来。
  entry_conditions:
  - actor.alive
  - location.tag.pawnshop
  - actor.role == "裁缝" or actor.role == "码头工" or actor.role == "修会医士" or actor.role == "走私掮客" or actor.role == "失势书吏" or actor.role == "守塔人之女" or actor.role == "蒙面收藏家"
  estimated_minutes: 120
  cooldown_minutes: 0
  nodes:
  - type: action
    action_id: linger
    parameters: {}
  success_results: *id001
  failure_results: *id002
  goal_tags:
