actions:
- id: travel_to
  verb: move
  version: 1
  description: 沿雾港的石板路移动到目标地点。
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  duration:
    minutes: 10
  costs:
    reserve: {}
    per_minute:
      stamina: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.alive
    result: arrived
  failure:
    condition: actor.incapacitated
    result: route_unknown
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
- id: appraise_item
  verb: appraise
  version: 1
  description: 在账房鉴定一件客人带来的东西，读出它的真实价值和来历。
  parameters:
    entry_id: string
  preconditions:
  - actor.alive
  - location.tag.appraisal
  duration:
    minutes: 20
  costs:
    reserve: {}
    per_minute:
      stamina: 0.03
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: catalog_action
    catalog: appraise
    entry: context.entry_id
  success:
    condition: actor.alive
    result: appraised
  failure:
    condition: actor.incapacitated
    result: action_failed
  interrupt_policy: cancel
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: case.appraised
    summary: 鉴定镜下的刻字和纸边，比客人的说法更可靠。
    result: appraised
- id: trade_offer
  verb: trade
  version: 1
  description: 在当铺或阵营地点选择一个可见的买卖报价。
