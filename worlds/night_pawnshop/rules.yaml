progression:
- id: first_case
  label: 第一夜：柜台前的人
  summary: 七位客人已经带着东西来了。先听一个人说完，再决定收不收，或者让他把东西带回去。
  priority: 0.99
  audience:
  - player
  visible_when: world.night <= 3
  target_behaviors:
  - trade_pawnshop
  - appraise_item
  support_behaviors: []
  complete_when:
    event_type: case.resolved
    count: 1
- id: first_debt
  label: 第一笔债
  summary: 第 7 夜前把 60 枚金币放到港务局的账台上；别让第一张催缴单变成违约记录。
  priority: 0.96
  audience:
  - player
  visible_when: world.night >= 4 and world.debt_stage < 1
  target_behaviors:
  - pay_debt_1
  support_behaviors:
  - trade_pawnshop
  complete_when:
    event_type: debt.paid
    count: 1
- id: faction_pact
  label: 三方都在等
  summary: 第 10 夜后选一个阵营签约；港务局、修会、收藏家，你只能欠一个人情。
  priority: 0.94
  audience:
  - player
  visible_when: world.night >= 8 and world.faction_pact == 0
  target_behaviors:
  - pact_watch
  - pact_chapel
  - pact_collector
  support_behaviors:
  - trade_pawnshop
  complete_when:
    event_type: faction.pact
    count: 1
- id: aunt_ledger
  label: 缺页账本
  summary: 收集 7 条线索，翻开姑妈留下的缺页账本；最后一页会告诉你钥匙是做什么的。
  priority: 0.93
  audience:
  - player
  visible_when: world.clues >= 3 and world.aunt_ledger_read < 1
  target_behaviors:
  - appraise_item
  - read_aunt_ledger
  support_behaviors:
  - trade_pawnshop
  complete_when:
    event_type: aunt.ledger_read
    count: 1
- id: final_audit
  label: 第 21 夜
  summary: 还清最后一笔债，决定钥匙和海门。审计官已经在门外。
  priority: 0.99
  audience:
  - player
  visible_when: world.night >= 19
  target_behaviors:
  - pay_debt_3
  - open_sea_gate
  - finish_campaign
  support_behaviors:
  - trade_pawnshop
  complete_when:
    event_type: campaign.closed
    count: 1
