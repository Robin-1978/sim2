minute_effects:
- id: stamina_recovery
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.2
    maximum: 100
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.01
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.008
- id: belonging_decay
  scope: agent
  every_minutes: 10
  effect:
    type: need_delta
    need: belonging
    delta: -0.02
- id: purpose_decay
  scope: agent
  every_minutes: 15
  effect:
    type: need_delta
    need: purpose
    delta: -0.02
- id: act_two
  scope: world
  every_minutes: 1
  condition: world.night >= 8 and world.act < 2 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.two
  event_summary: 第二幕开始：港务局、修会和收藏家都开始往当铺里看。
- id: act_three
  scope: world
  every_minutes: 1
  condition: world.night >= 15 and world.act < 3 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.three
  event_summary: 第三幕开始：无名客带来了铜钥匙，审计只剩七夜。
- id: debt_check_1
  scope: world
  every_minutes: 1
  condition: world.night >= 8 and world.debt_stage < 1 and world.debt_checked_1 < 1 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: debt_checked_1
    delta: 1
    maximum: 1
  - type: world_property_delta
    property: defaults
    delta: 1
    maximum: 3
  - type: world_property_delta
    property: suspicion
    delta: 0.1
    maximum: 1
  event_type: debt.missed
  event_summary: 第一笔债没有按时还上；港务局在账本上记了一笔违约。
- id: debt_check_2
  scope: world
  every_minutes: 1
  condition: world.night >= 15 and world.debt_stage < 2 and world.debt_checked_2 < 1 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: debt_checked_2
    delta: 1
    maximum: 1
  - type: world_property_delta
    property: defaults
    delta: 1
    maximum: 3
  - type: world_property_delta
    property: suspicion
    delta: 0.1
    maximum: 1
  event_type: debt.missed
  event_summary: 第二笔债没有按时还上；港务局的耐心又少了一截。
- id: raid_level_0
  scope: world
  every_minutes: 1
  condition: world.suspicion >= 0.6 and world.raid_done < 1 and world.safe_level == 0 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: night_actions
    delta: -2
    minimum: 0
  - type: world_property_delta
    property: suspicion
    delta: -0.25
    minimum: 0
  - type: world_property_delta
    property: raid_done
    delta: 1
    maximum: 1
  event_type: watch.raid
  event_summary: 港务局没有预约就推门进来；没有暗格，你只能站在柜台前看他们翻。
- id: raid_level_1
  scope: world
  every_minutes: 1
  condition: world.suspicion >= 0.6 and world.raid_done < 1 and world.safe_level == 1 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: night_actions
    delta: -1
    minimum: 0
  - type: world_property_delta
    property: suspicion
    delta: -0.25
    minimum: 0
  - type: world_property_delta
    property: raid_done
    delta: 1
    maximum: 1
  event_type: watch.raid
  event_summary: 港务局推门进来；暗格里只藏了一半账，他们翻了很久，但你还有时间。
- id: raid_level_2
  scope: world
  every_minutes: 1
  condition: world.suspicion >= 0.6 and world.raid_done < 1 and world.safe_level == 2 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: suspicion
    delta: -0.2
    minimum: 0
  - type: world_property_delta
    property: raid_done
    delta: 1
    maximum: 1
  event_type: watch.raid
  event_summary: 港务局推门进来；暗格是空的，他们只能带走一盏灯。
- id: suspicion_collapse
  scope: world
  every_minutes: 1
  condition: world.suspicion >= 1 and world.campaign_over < 1
  effects:
  - type: world_property_delta
    property: campaign_over
    delta: 1
    maximum: 1
  event_type: campaign.seized
  event_summary: 怀疑压过了所有账目；港务局在审计前就封了当铺。
- id: case_expiry_1
  scope: world
  every_minutes: 1
  condition: world.night > 3 and world.case_1 == 0 and world.campaign_over < 1
