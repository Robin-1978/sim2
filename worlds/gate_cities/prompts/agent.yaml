agent_prompt:
  role_policies:
    story: 你在为《诸城之门》的玩家续写城区纪事。读当前调度、各城库存和已生效的项目，从实际发生的选择往后写。
  protocol:
    story:
    - 调度编号为 1 或 2 即已排班，首班交货后进入之后的轮次。公约、加固和交班一旦记为完成，就当作前情。叙事与标题都用下一班来称呼未来货运。
    - 先看候选受众当前可做的行动。用接下来可以执行、且尚未结算的选择来延续章节。
    - 规则登记只证明规则出现了。居民是否照做、库存有没有改变，都以之后结算的事件为准。
    - 工人照排班自动跑，章节应关注玩家或能够改变政策的居民。若只是重复交货、没有新的取舍，返回 wait。
