situation_anchor_window_minutes: 43200
situation_anchors:
- id: first_landing
  title: 第一幕：风脊号还能飞
  summary: 裂天群岛正在坠入云海。风脊号泊在灯岬，工坊只剩半面墙，五个船员各有自己的理由留下。
  goal_hint: 先去风蚀林带回木料和纤维，再把工坊立起来。
  trigger_events:
  - skyfall.begin
- id: first_island
  title: 第一座岛
  summary: 你把第一座岛画进了海图。风蚀林的木料、盐滩的石料和旧灯塔的灯光，让风脊号第一次有了“下一站”。
  goal_hint: 继续探索岛链；铜潮谷需要石镐，雨背崖需要绳索。
  trigger_events:
  - exploration.completed
- id: first_workshop
  title: 工坊立起来了
  summary: 半面墙变成了能用的工坊。铜镐、提灯和风衣现在可以做了；风脊号不再只是漂着。
  goal_hint: 做一把石镐，去铜潮谷；或者先做绳索，去雨背崖。
  trigger_events:
  - camp.workshop_built
- id: act_two
  title: 第二幕：上升
  summary: 风脊号开始有方向。你探过两座岛，工坊也立起来了；接下来是铜、雷云和阵营。
  goal_hint: 把工坊升到二级，做滑翔翼。与不同阵营合作，会给下一航段带来不同的选择。
  trigger_events:
  - act.two
- id: storm_hit
  title: 风暴撞上风脊号
  summary: 风暴第一次撞上船体。你带回来的每一件稀有东西，都在把下一次风暴拉近。
  goal_hint: 修船、丢掉一件贵重品，或者加快信标进度。
  trigger_events:
  - storm.hit
- id: beacon_frame
  title: 信标框架
  summary: 框架立起来了。高环门不再是一个传说，而是一圈等待对齐的锚点。
  goal_hint: 做三个信标核心；每一个都要晶石、遗物和琥珀。
  trigger_events:
  - camp.beacon_frame_built
- id: act_three
  title: 第三幕：离天
  summary: 高环门在雷云之上等着。风脊号可以离开，也可以留下，或者把船交给风暴。
  goal_hint: 装好三个核心，然后选择离天、锚定群岛或成为风暴。
  trigger_events:
  - act.three
beats: []
endings:
- id: escape
  title: 阶段完成 · 离天
  summary: 高环门打开了。风脊号驶入较平稳的气流，船员开始清点剩余补给和可以落脚的地方。
  goal_hint: 跨过高环门后，先找能卸下补给的泊点，再决定和谁打交道。
  condition: world.ending_trigger == 1
  trigger_event: skyfall.launched
  kind: stage
  stats: &id001
  - property: hull_integrity
    label: 船体
  - property: storm_pressure
    label: 风暴压力
  - property: beacon_cores
    label: 信标核心
  - property: explored_islands
    label: 已探岛屿
  - property: crew_count
    label: 船员
  - property: camp_morale
    label: 营地士气
  - property: day
    label: 第几天
  - property: kite_rep
    label: 风筝人声望
  - property: foundry_rep
    label: 熔炉派声望
  - property: choir_rep
    label: 风歌者声望
- id: anchor
  title: 阶段完成 · 锚定群岛
  summary: 信标把群岛的锚点一个个对齐。天空没有停止坠落，但它第一次停住了。风筝人在断桥上唱了一整夜；老陶把最后一锅汤分给了所有人。
  goal_hint: 决定谁来守锚，以及外来的船要付出什么才能使用这条新航线。
  condition: world.ending_trigger == 2
  trigger_event: skyfall.anchored
  kind: stage
  stats: *id001
- id: stormborn
  title: 阶段完成 · 风暴之子
  summary: 你听完风歌者的最后一段，跟着风歌者进入风眼。风暴里的灯还能辨认方向，船员要试出一条能载货、能往返的路。
  goal_hint: 趁风眼平静整备，决定要先为自己画出路，还是带其他人穿过来。
  condition: world.ending_trigger == 3
  trigger_event: skyfall.stormborn
  kind: stage
  stats: *id001
- id: crash
  title: 阶段完成 · 坠落
  summary: 船体撑不住了。风脊号贴着下层岩架迫降。船员拾回板材，工坊铭牌还挂在梁上，部分补给滚进了云海。
  goal_hint: 清点补给、修船，并向附近的人寻找帮忙的条件。
  condition: world.ending_trigger == 4
  trigger_event: skyfall.crash
  kind: stage
  stats: *id001
- id: long_drift
  title: 阶段完成 · 云海合拢
  summary: 第三十天，云海合拢。风脊号还在灯岬，工坊还在，船员还在；只是高环门已经看不见了。天空替你做了决定。
  goal_hint: 寻找云层上方的航线窗口，继续准备信标。
  condition: world.ending_trigger == 5
  trigger_event: skyfall.long_drift
  kind: stage
  stats: *id001
