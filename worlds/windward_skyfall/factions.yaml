factions:
- id: kite_folk
  name: 风筝人
  description: 把群岛用绳索和风筝线系在一起的人。他们相信天空可以修，只要有人愿意留下。
  leader_id: ke
- id: foundry
  name: 熔炉派
  description: 拆岛取引擎的捞客。他们相信离开才是活路，带走的东西越多越好。
  leader_id: forge_master
- id: choir
  name: 风歌者
  description: 在旧灯塔下听风暴的人。他们不修天空，也不离开；他们想让天空重新呼吸。
  leader_id: choir_keeper
