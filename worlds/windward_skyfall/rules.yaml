minute_effects:
- id: dawn_salvage_expired
  scope: world
  every_minutes: 1
  condition: context.calendar_day == 1 and context.minute_of_day == 480 and world.dawn_salvage == 0 and world.ending_trigger == 0
  effect: {type: world_property_set, property: dawn_salvage, value: 3}
  event_type: skyfall.dawn_salvage
  event_data: {choice: expired}
  event_summary: 上午八点，拉紧的缆绳从绞盘上崩脱。铜料和求救灯都消失在云海里。
- id: emergency_plates_used
  scope: world
  every_minutes: 1
  condition: world.supply_spare_plates > 0 and world.hull_integrity < 0.9
  effects:
  - {type: world_property_set, property: supply_spare_plates, value: 0}
  - {type: world_property_delta, property: hull_integrity, delta: 0.12, maximum: 1}
  event_type: supply.plates_used
  event_summary: 阿岚用先前留在船上的应急铜板补住了风暴撕开的裂口。
- id: supply_window_countdown
  scope: world
  every_minutes: 1
  condition: world.supply_consultation == 1 and world.supply_minutes > 0
  effect:
    type: world_property_delta
    property: supply_minutes
    delta: -1
    minimum: 0
    maximum: 250
- id: supply_window_expiry
  scope: world
  every_minutes: 1
  condition: world.supply_consultation == 1 and world.supply_minutes <= 0
  effects:
  - type: world_property_set
    property: supply_consultation
    value: 4
  - type: world_property_set
    property: supply_relief_due
    value: 1
  - type: world_property_delta
    property: camp_morale
    delta: -0.03
    minimum: 0
    maximum: 1
  event_type: supply.decision_expired
  event_summary: 双方在配给窗口内没有达成分配。断桥的人等不到铜料，下一批物资必须先履约。
- id: supply_window_open
  scope: world
  every_minutes: 720
  condition: world.supply_consultation != 1 and world.ending_trigger == 0
  effects:
  - type: world_resource_delta
    resource_id: emergency_copper_cache
    delta: 3
    maximum: 3
  - type: world_property_set
    property: supply_consultation
    value: 1
  - type: world_property_set
    property: supply_minutes
    value: 250
  event_type: supply.claims_opened
  event_data:
    resource_id: emergency_copper_cache
    units: 3
    claimants: [alan, ke]
    audience: [alan]
    deadline_minutes: 250
    active_when: world.supply_consultation == 1
    miss_cost: 营地士气下降，下一批物资必须先偿还断桥配给。
  event_summary: 航队只交付三份铜料。阿岚要补强船体，断桥信使申请同一批铜料。
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.012
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.016
- id: starvation_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 4
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: dehydration_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.hydration <= 4
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: stamina_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.5
- id: night_exposure
  scope: agent
  every_minutes: 60
  condition: context.day_phase == night and location.tag.exposed
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
- id: storm_exposure
  scope: agent
  every_minutes: 60
  condition: world.storm_stage >= 2 and location.tag.exposed and actor.inventory.storm_cloak < 1
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: day_clock
  scope: world
  every_minutes: 1
  condition: context.calendar_day != world.day
  effects:
  - type: world_property_set
    property: day
    value: context.calendar_day
  event_type: day.started
  event_summary: 新的一天从云海下面升起来。
- id: storm_daily
  scope: world
  every_minutes: 1
  condition: context.minute_of_day == 0
  effects:
  - type: world_property_delta
    property: storm_pressure
    delta: 1
    maximum: 100
- id: storm_stage_1
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 35 and world.storm_stage < 1
  effects:
  - type: world_property_delta
    property: storm_stage
    delta: 1
    maximum: 3
  - type: world_property_delta
    property: storm_warning_seen
    delta: 1
    maximum: 1
  event_type: storm.warning
  event_summary: 远处的云层开始朝灯岬压过来；风暴季提前了。
- id: act_two
  scope: world
  every_minutes: 1
  condition: world.workshop_level >= 1 and world.explored_islands >= 2 and world.act < 2 and world.ending_trigger == 0
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.two
  event_summary: 第二幕开始：风脊号不再只是漂着，它开始有方向。
- id: act_three
  scope: world
  every_minutes: 1
  condition: world.beacon_frame >= 1 and world.act < 3 and world.ending_trigger == 0
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.three
  event_summary: 第三幕开始：信标框架立起来了，高环门不再是传说。
- id: crash_check
  scope: world
  every_minutes: 1
  condition: world.hull_integrity <= 0 and world.ending_trigger == 0
  effects:
  - type: world_property_set
    property: ending_trigger
    value: 4
  - type: world_property_delta
    property: crash_seen
    delta: 1
    maximum: 1
  event_type: skyfall.crash
  event_summary: 风脊号撑不住了；云海从船体的裂缝里涌进来。
- id: long_drift
  scope: world
  every_minutes: 1
  condition: world.day >= 30 and world.ending_trigger == 0 and world.long_drift_seen == 0
  effects:
  - {type: world_property_set, property: long_drift_seen, value: 1}
  - {type: world_property_delta, property: storm_pressure, delta: 8, maximum: 100}
  event_type: skyfall.long_drift
  event_summary: 第三十天，云涌盖过低处的航线。船员重新画图，准备从高处寻找窗口。
- id: voyage_after_departure
  scope: world
  every_minutes: 1
  condition: world.voyage_phase == 1 and world.ending_trigger == 1
  effects:
  - {type: world_property_set, property: voyage_phase, value: 2}
  - {type: world_property_delta, property: storm_pressure, delta: -35, minimum: 0}
  event_type: skyfall.next_voyage_started
  event_data: {outcome: departure}
  event_summary: 风脊号穿过高环门后跑进一段较平稳的气流。船员要决定先在哪里卸补给、联系谁。
- id: voyage_after_anchoring
  scope: world
  every_minutes: 1
  condition: world.voyage_phase == 1 and world.ending_trigger == 2
  effects:
  - {type: world_property_set, property: voyage_phase, value: 2}
  - {type: world_property_delta, property: storm_pressure, delta: -20, minimum: 0}
  event_type: skyfall.next_voyage_started
  event_data: {outcome: anchoring}
  event_summary: 锚线暂时撑住群岛。靠近断桥的船员开始商量谁来守锚，谁能使用稳定下来的航线。
- id: voyage_through_storm
  scope: world
  every_minutes: 1
  condition: world.voyage_phase == 1 and world.ending_trigger == 3
  effects:
  - {type: world_property_set, property: voyage_phase, value: 2}
  - {type: world_property_delta, property: storm_pressure, delta: -45, minimum: 0}
  event_type: skyfall.next_voyage_started
  event_data: {outcome: storm_eye}
  event_summary: 风歌者领风脊号切进风眼。这里暂时平静，但船员还需要找到能反复通行的路。
- id: voyage_after_crash
  scope: world
  every_minutes: 1
  condition: world.voyage_phase == 1 and world.ending_trigger == 4
  effects:
  - {type: world_property_set, property: voyage_phase, value: 2}
  - {type: world_property_delta, property: hull_integrity, delta: 0, minimum: 0.25}
  - {type: world_property_delta, property: storm_pressure, delta: -30, minimum: 0}
  - {type: world_resource_delta, resource_id: ration, delta: -4, minimum: 0}
  - {type: world_resource_delta, resource_id: water, delta: -4, minimum: 0}
  event_type: skyfall.next_voyage_started
  event_data: {outcome: forced_landing}
  event_summary: 船员迫降后把散架的船体固定在岩架上。部分补给落进云海，临时固定的船体需要尽快修补。
- id: voyage_after_old_deadline
  scope: world
  every_minutes: 1
  condition: world.voyage_phase == 1 and world.ending_trigger == 5
  effects:
  - {type: world_property_set, property: ending_trigger, value: 0}
  - {type: world_property_set, property: long_drift_seen, value: 1}
  event_type: skyfall.navigation_resumed
  event_summary: 高处的云层露出缺口，船员重新开始寻找穿过高环门的机会。
- id: voyage_later_forced_landing
  scope: world
  every_minutes: 1
  condition: world.voyage_phase >= 2 and world.hull_integrity <= 0
  effects:
  - {type: world_property_delta, property: voyage_phase, delta: 1}
  - {type: world_property_set, property: hull_integrity, value: 0.25}
  - {type: world_property_delta, property: storm_pressure, delta: -30, minimum: 0}
  - {type: world_resource_delta, resource_id: ration, delta: -4, minimum: 0}
  - {type: world_resource_delta, resource_id: water, delta: -4, minimum: 0}
  event_type: skyfall.next_voyage_started
  event_data: {outcome: forced_landing}
  event_summary: 风脊号再度贴着岩架迫降。船员开始清点掉落的补给和可以修回的船板。
- id: garden_harvest
  scope: world
  every_minutes: 720
  condition: world.garden_level >= 1
  effects:
  - {type: world_resource_delta, resource_id: ration, delta: 2, maximum: 16}
  - {type: world_resource_delta, resource_id: camp_herbs, delta: 2, maximum: 8}
- id: garden_harvest_expanded
  scope: world
  every_minutes: 720
  condition: world.garden_level >= 2
  effects:
  - {type: world_resource_delta, resource_id: ration, delta: 2, maximum: 16}
  - {type: world_resource_delta, resource_id: camp_herbs, delta: 2, maximum: 8}
- id: catch_camp_dew
  scope: world
  every_minutes: 360
  condition: world.cistern_level < 1 and world.water < 24
  effect: {type: world_resource_delta, resource_id: water, delta: 3, maximum: 24}
  event_type: camp.water_collected
  event_summary: 接露槽把帆布上的露水收进了淡水箱。
- id: catch_camp_mist
  scope: world
  every_minutes: 360
  condition: world.cistern_level >= 1 and world.water < 36
  effect: {type: world_resource_delta, resource_id: water, delta: 6, maximum: 36}
  event_type: camp.water_collected
  event_summary: 集水帆拦住穿过甲板的云雾，淡水顺着导流槽流进水箱。
- id: storm_stage_2
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 65 and world.storm_stage < 2
  effect:
    type: world_property_set
    property: storm_stage
    value: 2
- id: storm_stage_3
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 90 and world.storm_stage < 3
  effect:
    type: world_property_set
    property: storm_stage
    value: 3
- id: storm_eased_to_0
  scope: world
  every_minutes: 1
  condition: world.storm_pressure < 35 and world.storm_stage > 0
  effect:
    type: world_property_set
    property: storm_stage
    value: 0
  event_type: storm.eased
  event_summary: 风暴暂时退去，群岛又露出了轮廓。
- id: storm_eased_to_1
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 35 and world.storm_pressure < 65 and world.storm_stage > 1
  effect:
    type: world_property_set
    property: storm_stage
    value: 1
  event_type: storm.eased
  event_summary: 风暴暂时退去，群岛又露出了轮廓。
- id: storm_eased_to_2
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 65 and world.storm_pressure < 90 and world.storm_stage > 2
  effect:
    type: world_property_set
    property: storm_stage
    value: 2
  event_type: storm.eased
  event_summary: 风暴暂时退去，群岛又露出了轮廓。
- id: storm_first_hit_hull0
  scope: world
  every_minutes: 1
  condition: world.storm_stage >= 2 and world.storm_hit_seen == 0 and world.hull_level == 0
  effects:
  - type: world_property_delta
    property: hull_integrity
    delta: -0.12
    minimum: 0
    maximum: 1
  - type: world_property_delta
    property: storm_hit_seen
    delta: 1
    maximum: 1
  event_type: storm.hit
  event_summary: 风暴第一次撞上风脊号；船体发出不祥的响声。
- id: storm_first_critical_hull0
  scope: world
  every_minutes: 1
  condition: world.storm_stage >= 3 and world.storm_critical_seen == 0 and world.hull_level == 0
  effects:
  - type: world_property_delta
    property: hull_integrity
    delta: -0.2
    minimum: 0
    maximum: 1
  - type: world_property_delta
    property: storm_critical_seen
    delta: 1
    maximum: 1
  event_type: storm.critical
  event_summary: 天空压到桅杆上了；现在只能回船、补船，或者做最后的决定。
- id: storm_damage_2_hull0
  scope: world
  every_minutes: 360
  condition: world.storm_stage >= 2 and world.hull_integrity > 0 and world.hull_level == 0
  effects:
  - type: world_property_delta
    property: hull_integrity
    delta: -0.03
