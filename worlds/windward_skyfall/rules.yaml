world_property_labels:
  day:
    label: 第几天
    unit: amount
    max: 30
    group: 天空
    group_order: 1
    order: 1
    prompt: 云海合拢前的第几天；第 30 天仍未选择会触发保底结局。
  act:
    label: 幕次
    unit: amount
    max: 3
    hidden: true
  storm_pressure:
    label: 风暴压力
    unit: amount
    max: 100
    group: 风暴
    group_order: 2
    order: 1
    alert: true
    prompt: 稀有物资和探索会推高压力；35/65/90 是三道风暴阈值。
  storm_stage:
    label: 风暴阶段
    unit: amount
    max: 3
    group: 风暴
    group_order: 2
    order: 2
    hidden: true
  hull_integrity:
    label: 船体
    unit: percent
    max: 1
    group: 天空
    group_order: 1
    order: 2
    alert: true
    prompt: 船体归零会坠入云海；木材和铜可以修补。
  hull_level:
    label: 船体加固
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 0
    prompt: 两级船体加固降低风暴伤害。
  workshop_level:
    label: 工坊
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 1
    prompt: 工坊解锁铜镐、提灯、风衣、滑翔翼和晶锯。
  galley_level:
    label: 厨房
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 2
    prompt: 厨房让船员做饭，也让你带走更多口粮。
  garden_level:
    label: 花园
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 3
    prompt: 花园每天补口粮；二级花园是锚定结局的条件。
  infirmary_level:
    label: 药棚
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 4
    prompt: 药棚让船员治疗，也让你做出药膏。
  camp_morale:
    label: 营地士气
    unit: percent
    max: 1
    group: 营地
    group_order: 3
    order: 5
    alert: true
    prompt: 士气来自热饭、花园、观星和阵营互动；太低会让结局更冷。
  beacon_frame:
    label: 信标框架
    unit: amount
    max: 1
    group: 信标
    group_order: 4
    order: 1
    prompt: 框架立起来后，高环门才有东西可以对齐。
  beacon_cores:
    label: 信标核心
    unit: amount
    max: 3
    group: 信标
    group_order: 4
    order: 2
    alert: true
    prompt: 三个核心才能离天；两个核心可以走风暴路线。
  explored_islands:
    label: 已探岛屿
    unit: amount
    max: 9
    group: 探索
    group_order: 5
    order: 1
    prompt: 探索会解锁新的资源和航线。
  crew_count:
    label: 船员
    unit: amount
    max: 8
    group: 探索
    group_order: 5
    order: 2
    prompt: 船员决定结局里谁和你一起走。
  ration:
    label: 营地口粮
    unit: amount
    max: 16
    group: 营地
    group_order: 3
    order: 6
    hidden: false
  water:
    label: 营地蓄水
    unit: amount
    max: 24
    group: 营地
    group_order: 3
    order: 7
    hidden: false
  kite_rep:
    label: 风筝人声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 1
    prompt: 40% 可以走锚定结局。
  foundry_rep:
    label: 熔炉派声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 2
    prompt: 熔炉派愿意用透镜换铜。
  choir_rep:
    label: 风歌者声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 3
    prompt: 40% 可以走风暴之子结局。
  ending_trigger:
    label: 结局
    unit: amount
    max: 5
    hidden: true
  storm_warning_seen:
    label: 风暴预警
    unit: amount
    max: 1
    hidden: true
  storm_hit_seen:
    label: 风暴命中
    unit: amount
    max: 1
    hidden: true
  storm_critical_seen:
    label: 风暴临界
    unit: amount
    max: 1
    hidden: true
  crash_seen:
    label: 坠落
    unit: amount
    max: 1
    hidden: true
