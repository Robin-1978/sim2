onboarding:
- id: first_landing
  title: 先去风蚀林
  body: 风脊号的工坊只剩半面墙。风蚀林有木料和纤维，先去把第一间工坊的材料找回来。
  action_ref: behavior:travel_windworn
  complete_when:
    event_type: exploration.completed
    match:
      area_id: windworn_woods
    count: 1
- id: first_materials
  title: 带回 5 木材和 3 石块
  body: 工坊需要木料和石料。风蚀林有木材，碎盐滩有石块；在夜里之前回船。
  action_ref: behavior:travel_windworn
  done_when: actor.inventory.wood >= 5 and actor.inventory.stone >= 3
- id: build_workshop
  title: 把工坊立起来
  body: 有了工坊，铜镐、提灯和风衣才会出现在你的行动列表里。
  action_ref: behavior:build_workshop_1
  done_when: world.workshop_level >= 1
- id: first_tool
  title: 做一把石镐
  body: 石镐能让你在铜潮谷敲下铜矿；铜镐又会打开浮鲸墓场和雷云工坊。
  action_ref: behavior:craft_stone_pick
  done_when: actor.inventory.stone_pick >= 1
- id: chart_three
  title: 把航线画到第三座岛
  body: 探索三座岛，Director 和 Story 才会开始把你的选择长成新的内容。
  action_ref: behavior:travel_copper_tide
  done_when: world.explored_islands >= 3
progression:
- id: make_shipshape
  label: 让风脊号像个家
  summary: 搭起工坊和厨房：一个让你能做工具，一个让船员有热饭。
  priority: 0.99
  audience:
  - player
  visible_when: world.act == 1
  target_behaviors:
  - build_workshop_1
  - build_galley_1
  support_behaviors:
  - gather_wood
  - gather_stone
  - gather_fiber
  complete_when:
    event_type: camp.galley_built
    count: 1
- id: chart_the_chain
  label: 把岛链画出来
  summary: 探索三座不同的岛；每一次探索都会把一座新岛、一种新资源或一条新路放进海图。
  priority: 0.95
  audience:
  - player
  visible_when: world.explored_islands >= 1
  target_behaviors:
  - explore_windworn
  - explore_saltbreak
  - explore_lighthouse
  - explore_copper_tide
  - explore_rainshade
  support_behaviors:
  - travel_windworn
  - travel_saltbreak
  - travel_copper_tide
  - travel_rainshade
  complete_when:
    event_type: exploration.completed
    distinct_by:
    - area_id
    count: 3
- id: raise_beacon
  label: 把信标立起来
  summary: 工坊升到二级，做出三个信标核心，装进框架。
  priority: 0.93
  audience:
  - player
  visible_when: world.act >= 2
  target_behaviors:
  - build_beacon_frame
  - craft_beacon_core
  - install_beacon_core
  support_behaviors:
  - mine_crystal
  - salvage_relic
  - harvest_amber
  complete_when:
    event_type: beacon.core_installed
    count: 3
- id: leave_the_sky
  label: 离天
  summary: 三个核心对准高环门，带风脊号离开裂天群岛。
  priority: 0.99
  audience:
  - player
  visible_when: world.beacon_cores >= 3
  target_behaviors:
  - launch_escape
  support_behaviors:
  - repair_hull
  complete_when:
    event_type: skyfall.launched
    count: 1
- id: anchor_the_sky
  label: 锚定群岛
  summary: 二级花园和风筝人的信任，让天空重新系在一起。
  priority: 0.98
  audience:
  - player
  visible_when: world.beacon_cores >= 3 and world.kite_rep >= 0.2
  target_behaviors:
  - anchor_islands
  - aid_kite
  - build_garden_2
  support_behaviors:
  - gather_fiber
  - travel_broken_span
  complete_when:
    event_type: skyfall.anchored
    count: 1
- id: become_the_storm
  label: 成为风暴
  summary: 风暴压力 90、两个核心、风歌者的信任；把船交给天空。
  priority: 0.96
  audience:
  - player
  visible_when: world.storm_pressure >= 70 and world.choir_rep >= 0.2
  target_behaviors:
  - become_storm
  - listen_choir
  support_behaviors:
  - jettison_relic
  - jettison_amber
  complete_when:
    event_type: skyfall.stormborn
    count: 1
