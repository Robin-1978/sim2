action_catalogs: {}
onboarding_window_minutes: 4320
onboarding:
- id: first_landing
  title: 先去风蚀林
  body: 风脊号的工坊只剩半面墙。风蚀林有木料和纤维，先去把第一间工坊的材料找回来。
  action_ref: behavior:travel_windworn
  complete_when:
    event_type: exploration.completed
    match:
      area_id: windworn_woods
    count: 1
- id: first_materials
  title: 带回 5 木材和 3 石块
  body: 工坊需要木料和石料。风蚀林有木材，碎盐滩有石块；在夜里之前回船。
  action_ref: behavior:travel_windworn
  done_when: actor.inventory.wood >= 5 and actor.inventory.stone >= 3
- id: build_workshop
  title: 把工坊立起来
  body: 有了工坊，铜镐、提灯和风衣才会出现在你的行动列表里。
  action_ref: behavior:build_workshop_1
  done_when: world.workshop_level >= 1
- id: first_tool
  title: 做一把石镐
  body: 石镐能在铜潮谷采铜和煤。铜镐采矿更快，也能采晶石。
  action_ref: behavior:craft_stone_pick
  done_when: actor.inventory.stone_pick >= 1 or actor.inventory.copper_pick >= 1
- id: chart_three
  title: 把航线画到第三座岛
  body: 探索三座岛，Director 和 Story 才会开始把你的选择长成新的内容。
  action_ref: behavior:travel_copper_tide
  done_when: world.explored_islands >= 3
progression:
- id: dawn_salvage
  label: 云海里的求救灯
  summary: 风筝人的斥候和一箱铜料挂在两根缆绳上。绞盘快散架了，只够再拉一次。
  priority: 2
  audience: [player]
  visible_when: world.day == 1 and context.day_phase == 'dawn' and world.dawn_salvage == 0 and world.ending_trigger == 0
  target_behaviors: [rescue_kite_scout, salvage_dawn_copper]
  complete_when: {event_type: skyfall.dawn_salvage}
- id: prepare_expedition
  label: 给下一趟出航装件设备
  summary: 侧风信标引你飞到雨背崖，铜制打捞架能走铜潮谷的低空通道。两件都可以装，随时也能走平常的航线。
  priority: 1.6
  audience: [player]
  visible_when: world.day <= 2 and world.ending_trigger == 0 and (world.crosswind_beacon == 0 or world.copper_tow_rig == 0)
  target_behaviors: [fit_crosswind_beacon, fit_copper_tow_rig]
- id: rainshade_expedition
  label: 雨背崖的守望人
  summary: 从风蚀林沿信标标出的侧风绕到雨背崖。带一份口粮去，守望人那里留着药草。
  priority: 1.7
  audience: [player]
  visible_when: world.crosswind_beacon == 1 and world.rainshade_lookout_supplied == 0 and world.day <= 2 and world.ending_trigger == 0
  target_behaviors: [supply_rainshade_lookout, travel_rainshade, travel_windworn]
- id: copper_tide_expedition
  label: 谷口有一卷旧铜线
  summary: 从碎盐滩借低空通道进入铜潮谷。拖走线圈能补足制作材料，也会招来雷云。
  priority: 1.7
  audience: [player]
  visible_when: world.copper_tow_rig == 1 and world.copper_tide_haul_taken == 0 and world.day <= 2 and world.ending_trigger == 0
  target_behaviors: [salvage_copper_tide_haul, travel_copper_tide, travel_saltbreak]
- id: emergency_copper_dispatch
  label: 这批铜，交给谁？
  summary: 阿岚要补船，断桥的人在等支援。这一批只够一边用。
  priority: 1.9
  audience: [player]
  visible_when: world.supply_consultation == 1 and world.supply_minutes > 0 and world.supply_relief_due == 0 and world.ending_trigger == 0
  target_behaviors: [allocate_emergency_stock_defense, allocate_emergency_stock_relief]
- id: emergency_copper_repayment
  label: 断桥来领欠下的铜
  summary: 上一批没送到断桥。这一批要先履约，才能恢复自由分配。
  priority: 1.9
  audience: [player]
  visible_when: world.supply_consultation == 1 and world.supply_minutes > 0 and world.supply_relief_due > 0 and world.ending_trigger == 0
  target_behaviors: [allocate_emergency_stock_relief]
- id: make_shipshape
  label: 让风脊号像个家
  summary: 搭起工坊和厨房：一个让你能做工具，一个让船员有热饭。
  priority: 0.99
  audience:
  - player
  visible_when: world.act == 1
  target_behaviors:
  - build_workshop_1
  - build_galley_1
  support_behaviors:
  - gather_wood
  - gather_stone
  - gather_fiber
  complete_when:
    event_type: camp.galley_built
    count: 1
- id: chart_the_chain
  label: 把岛链画出来
  summary: 探索三座不同的岛；每一次探索都会把一座新岛、一种新资源或一条新路放进海图。
  priority: 0.95
  audience:
  - player
  visible_when: world.explored_islands >= 1
  target_behaviors:
  - explore_windworn
  - explore_saltbreak
  - explore_lighthouse
  - explore_copper_tide
  - explore_rainshade
  support_behaviors:
  - travel_windworn
  - travel_saltbreak
  - travel_copper_tide
  - travel_rainshade
  complete_when:
    event_type: exploration.completed
    distinct_by:
    - area_id
    count: 3
- id: raise_beacon
  label: 把信标立起来
  summary: 工坊升到二级，做出三个信标核心，装进框架。
  priority: 0.93
  audience:
  - player
  visible_when: world.act >= 2
  target_behaviors:
  - build_beacon_frame
  - craft_beacon_core
  - install_beacon_core
  support_behaviors:
  - mine_crystal
  - salvage_relic
  - harvest_amber
  complete_when:
    event_type: beacon.core_installed
    count: 3
- id: leave_the_sky
  label: 离天
  summary: 三个核心对准高环门，带风脊号离开裂天群岛。
  priority: 0.99
  audience:
  - player
  visible_when: world.ending_trigger == 0 and world.beacon_cores >= 3
  target_behaviors:
  - launch_escape
  support_behaviors:
  - repair_hull
  complete_when:
    event_type: skyfall.launched
    count: 1
- id: anchor_the_sky
  label: 锚定群岛
  summary: 两枚核心、四份锚索纤维、二级花园和风筝人的信任，能让群岛重新系在一起。
  priority: 0.98
  audience:
  - player
  visible_when: world.ending_trigger == 0 and world.beacon_cores >= 2 and world.kite_rep >= 0.2
  target_behaviors:
  - anchor_islands
  - aid_kite
  - build_garden_2
  support_behaviors:
  - gather_fiber
  - travel_broken_span
  complete_when:
    event_type: skyfall.anchored
    count: 1
- id: become_the_storm
  label: 成为风暴
  summary: 风暴压力 90、两个核心、风歌者的信任；把船交给天空。
  priority: 0.96
  audience:
  - player
  visible_when: world.ending_trigger == 0 and world.storm_pressure >= 70 and world.choir_rep >= 0.2
  target_behaviors:
  - become_storm
  - listen_choir
  support_behaviors:
  - jettison_relic
  - jettison_amber
  complete_when:
    event_type: skyfall.stormborn
    count: 1
