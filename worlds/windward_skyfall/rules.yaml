world_property_labels:
  dawn_salvage: {label: 首航回收结果, hidden: true}
  crosswind_beacon: {label: 侧风信标, hidden: true}
  copper_tow_rig: {label: 铜制打捞架, hidden: true}
  rainshade_lookout_supplied: {label: 守望人补给, hidden: true}
  copper_tide_haul_taken: {label: 谷口线圈已回收, hidden: true}
  supply_consultation: {label: 配给状态, hidden: true}
  supply_relief_due: {label: 配给履约, hidden: true}
  supply_spare_plates: {label: 应急铜板, unit: amount, max: 1, group: 船体}
  emergency_stock: {label: 应急铜料, unit: amount, max: 3}
  supply_minutes: {label: 配给窗口剩余分钟, unit: minutes, max: 250}
  day:
    label: 第几天
    unit: amount
    group: 天空
    group_order: 1
    order: 1
    prompt: 航行至今的天数。第 30 天到来的云涌会改变处境。
  act:
    label: 幕次
    unit: amount
    max: 3
    hidden: true
  storm_pressure:
    label: 风暴压力
    unit: amount
    max: 100
    group: 风暴
    group_order: 2
    order: 1
    alert: true
    prompt: 稀有物资和探索会推高压力；35/65/90 是三道风暴阈值。
  storm_stage:
    label: 风暴阶段
    unit: amount
    max: 3
    group: 风暴
    group_order: 2
    order: 2
    hidden: true
  hull_integrity:
    label: 船体
    unit: percent
    max: 1
    group: 天空
    group_order: 1
    order: 2
    alert: true
    prompt: 船体归零会坠入云海；木材和铜可以修补。
  hull_level:
    label: 船体加固
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 0
    prompt: 两级船体加固降低风暴伤害。
  workshop_level:
    label: 工坊
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 1
    prompt: 工坊解锁铜镐、提灯、风衣、滑翔翼和晶锯。
  galley_level:
    label: 厨房
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 2
    prompt: 花两份浆果和一份盐做一锅热饭，为公共口粮箱补六份。
  garden_level:
    label: 花园
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 3
    prompt: 花园每十二小时出一批口粮和药草。二级花园加倍生产，并可为群岛锚线提供持续补给。
  infirmary_level:
    label: 药棚
    unit: amount
    max: 2
    group: 营地
    group_order: 3
    order: 4
    prompt: 药棚让船员治疗，也让你做出药膏。
  camp_morale:
    label: 营地士气
    unit: percent
    max: 1
    group: 营地
    group_order: 3
    order: 5
    alert: true
    prompt: 热饭、花园、观星和互助都会影响船上士气。
  beacon_frame:
    label: 信标框架
    unit: amount
    max: 1
    group: 信标
    group_order: 4
    order: 1
    prompt: 框架立起来后，高环门才有东西可以对齐。
  beacon_cores:
    label: 信标核心
    unit: amount
    max: 3
    group: 信标
    group_order: 4
    order: 2
    alert: true
    prompt: 三个核心才能离天；两个核心可以走风暴路线。
  explored_islands:
    label: 已探岛屿
    unit: amount
    max: 9
    group: 探索
    group_order: 5
    order: 1
    prompt: 探索会解锁新的资源和航线。
  crew_count:
    label: 船员
    unit: amount
    max: 8
    group: 探索
    group_order: 5
    order: 2
    prompt: 风脊号名册上的船员。
  ration:
    label: 营地口粮
    unit: amount
    max: 16
    group: 营地
    group_order: 3
    order: 6
    hidden: false
  water:
    label: 营地蓄水
    unit: amount
    max: 36
    group: 营地
    group_order: 3
    order: 7
    prompt: 船上的接露槽每六小时收三份淡水，造好集水帆后翻倍。
  cistern_level:
    label: 集水帆
    unit: amount
    max: 1
    group: 营地
    group_order: 3
    order: 8
  camp_herbs:
    label: 药园待采药草
    unit: amount
    max: 8
    group: 营地
    group_order: 3
    order: 9
    hidden: false
  kite_rep:
    label: 风筝人声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 1
    prompt: 达到 40% 可请风筝人一起守锚。
  foundry_rep:
    label: 熔炉派声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 2
    prompt: 熔炉派愿意用透镜换铜。
  choir_rep:
    label: 风歌者声望
    unit: percent
    max: 1
    group: 阵营
    group_order: 6
    order: 3
    prompt: 达到 40% 可请风歌者带路进入风眼。
  ending_trigger:
    label: 裂天阶段结果
    unit: amount
    max: 5
    hidden: true
  voyage_phase:
    label: 航行阶段
    unit: amount
    group: 探索
    group_order: 5
    order: 0
    prompt: 第一阶段面对裂天群岛危机。阶段结算后，船员继续在同一世界生活。
  long_drift_seen:
    label: 已遇长漂云涌
    hidden: true
  storm_warning_seen:
    label: 风暴预警
    unit: amount
    max: 1
    hidden: true
  storm_hit_seen:
    label: 风暴命中
    unit: amount
    max: 1
    hidden: true
  storm_critical_seen:
    label: 风暴临界
    unit: amount
    max: 1
    hidden: true
  crash_seen:
    label: 坠落
    unit: amount
    max: 1
    hidden: true
