minute_effects:
- id: satiety_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: satiety
    delta: -0.012
- id: hydration_decay
  scope: agent
  every_minutes: 1
  effect:
    type: need_delta
    need: hydration
    delta: -0.016
- id: starvation_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.satiety <= 4
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: dehydration_damage
  scope: agent
  every_minutes: 60
  condition: actor.need.hydration <= 4
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: stamina_recovery_idle
  scope: agent
  every_minutes: 1
  condition: action.none
  effect:
    type: attribute_delta
    attribute: stamina
    delta: 0.5
- id: night_exposure
  scope: agent
  every_minutes: 60
  condition: context.day_phase == night and location.tag.exposed
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -1
- id: storm_exposure
  scope: agent
  every_minutes: 60
  condition: world.storm_stage >= 2 and location.tag.exposed and actor.inventory.storm_cloak < 1
  effect:
    type: attribute_delta
    attribute: integrity
    delta: -2
- id: day_clock
  scope: world
  every_minutes: 1440
  effects:
  - type: world_property_delta
    property: day
    delta: 1
    maximum: 30
  event_type: day.started
  event_summary: 新的一天从云海下面升起来。
- id: storm_daily
  scope: world
  every_minutes: 1440
  effects:
  - type: world_property_delta
    property: storm_pressure
    delta: 1
    maximum: 100
- id: storm_stage_1
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 35 and world.storm_stage < 1 and world.ending_trigger == 0
  effects:
  - type: world_property_delta
    property: storm_stage
    delta: 1
    maximum: 3
  - type: world_property_delta
    property: storm_warning_seen
    delta: 1
    maximum: 1
  event_type: storm.warning
  event_summary: 远处的云层开始朝灯岬压过来；风暴季提前了。
- id: act_two
  scope: world
  every_minutes: 1
  condition: world.workshop_level >= 1 and world.explored_islands >= 2 and world.act < 2 and world.ending_trigger == 0
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.two
  event_summary: 第二幕开始：风脊号不再只是漂着，它开始有方向。
- id: act_three
  scope: world
  every_minutes: 1
  condition: world.beacon_frame >= 1 and world.act < 3 and world.ending_trigger == 0
  effects:
  - type: world_property_delta
    property: act
    delta: 1
    maximum: 3
  event_type: act.three
  event_summary: 第三幕开始：信标框架立起来了，高环门不再是传说。
- id: crash_check
  scope: world
  every_minutes: 1
  condition: world.hull_integrity <= 0 and world.ending_trigger == 0
  effects:
  - type: world_property_set
    property: ending_trigger
    value: 4
  - type: world_property_delta
    property: crash_seen
    delta: 1
    maximum: 1
  event_type: skyfall.crash
  event_summary: 风脊号撑不住了；云海从船体的裂缝里涌进来。
- id: long_drift
  scope: world
  every_minutes: 1440
  condition: world.day >= 30 and world.ending_trigger == 0
  effects:
  - type: world_property_set
    property: ending_trigger
    value: 5
  event_type: skyfall.long_drift
  event_summary: 第三十天，云海合拢；天空替你做了决定。
- id: camp_supply
  scope: world
  every_minutes: 720
  condition: world.galley_level >= 1 or world.garden_level >= 1
  effects:
  - type: world_resource_delta
    resource_id: ration
    delta: 2
    maximum: 16
- id: camp_water
  scope: world
  every_minutes: 720
  effects:
  - type: world_resource_delta
    resource_id: water
    delta: 2
    maximum: 24
- id: storm_stage_2_hull0
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 65 and world.storm_stage < 2 and world.ending_trigger == 0 and world.hull_level == 0
  effects:
  - type: world_property_delta
    property: storm_stage
    delta: 1
    maximum: 3
  - type: world_property_delta
    property: hull_integrity
    delta: -0.12
    minimum: 0
    maximum: 1
  - type: world_property_delta
    property: storm_hit_seen
    delta: 1
    maximum: 1
  event_type: storm.hit
  event_summary: 风暴第一次撞上风脊号；船体发出不祥的响声。
- id: storm_stage_3_hull0
  scope: world
  every_minutes: 1
  condition: world.storm_pressure >= 90 and world.storm_stage < 3 and world.ending_trigger == 0 and world.hull_level == 0
