- id: storm_damage_2_hull1
  scope: world
  every_minutes: 360
  condition: world.storm_stage >= 2 and world.hull_integrity > 0 and world.hull_level == 1
  effects:
  - type: world_property_delta
    property: hull_integrity
    delta: -0.02
    minimum: 0
