ui_text:
  travel_choice: 前往 {name}
  travel_summary: 沿着岛链飞向 {name}。
  travel_purpose: 换一座岛，找新的材料或人
  travel_time: 约 {minutes} 分钟
  travel_impact: 抵达目的地
  world_label: 裂天群岛
