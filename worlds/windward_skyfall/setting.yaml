    faction_traded: 和熔炉派交易
    storm_calmed: 风暴被安抚
    cargo_jettisoned: 货物已抛弃
    beacon_frame_built: 信标框架立起
    beacon_core_installed: 核心已安装
    hull_patched: 船体临时补好
    worked: 干完活了
    tool_crafted: 工具做好
    recipe_completed: 制作完成
    crafting_failed: 制作失败
    infirmary_upgraded: 药棚扩建
    hull_repaired: 船体修补
    hull_upgraded: 船体加固
    meal_cooked: 热饭上桌
    launched: 风脊号离天
    anchored: 群岛重新系紧
    stormborn: 你成为风暴
    crashed: 风脊号坠落
