name: 风脊号
premise: 裂天群岛正在下沉。带上五名船员，在风暴合拢前找到让群岛留下、或让风脊号离开的办法。
genre: 群岛求生 · 探索与抉择
locale: zh-CN
ui:
  player_summary_attributes: [integrity, stamina, hydration, satiety]
  player_recovery:
    stamina: {below: 25, behaviors: [rest_at_camp, rest_rough]}
    hydration: {below: 30, behaviors: [drink_at_camp, drink_water, fill_water, forage_supplies]}
    satiety: {below: 30, behaviors: [eat_at_camp, eat_stew, eat_ration, take_ration, forage_supplies]}
    integrity: {below: 30, behaviors: [use_salve, dress_wounds, rest_at_camp, rest_rough]}
  cover_art: assets/dawn.webp
  scene_art:
    lantern_cape: assets/lantern-cape.webp
  entry_action: 登上风脊号
  spotlights:
    dawn_salvage:
      deadline_clock_minute: 480
    prepare_expedition: {}
    rainshade_expedition: {}
    copper_tide_expedition: {}
    emergency_copper_dispatch:
      deadline_property: supply_minutes
    emergency_copper_repayment:
      deadline_property: supply_minutes
  crisis_metrics:
  - property: hull_integrity
    label: 船体
    format: percent
    max: 1
    danger_below: 0.35
    warning_below: 0.65
    hint: 船体归零会坠入云海
  - property: storm_pressure
    label: 风暴压力
    format: amount
    max: 100
    warning_at_or_above: 35
    danger_at_or_above: 65
    hint: 稀有物资会推高风暴
  - property: beacon_cores
    label: 信标核心
    format: amount
    max: 3
    hint: 三个核心才能离天
  - property: camp_morale
    label: 营地士气
    format: percent
    max: 1
    danger_below: 0.3
    warning_below: 0.5
    hint: 热饭、观星和互助能提振士气
  tagline: 天快塌了。绞盘只能再拉一次。
  cast_order:
  - alan
  - yanqiu
  - laotao
  - baique
  - xiaoman
  - ke
  - forge_master
  - choir_keeper
  event_kinds:
    exploration:
    - exploration.
    - island.
    camp:
    - supply.
    - camp.
    - beacon.
    storm:
    - storm.
    - skyfall.
    faction:
    - faction.
    crew:
    - crew.
    - camp.stargazing
    story:
    - story.
    - act.
  event_titles:
    exploration: 群岛与遗迹
    camp: 营地与信标
    storm: 风暴与天空
    faction: 阵营
    crew: 船员
    story: 世界剧情
  pulse_prefixes:
  - supply.
  - exploration.
  - camp.
  - beacon.
  - storm.
  - faction.
  - crew.
  - story.
  - act.
  - skyfall.
  recap_event_types:
  - exploration.
  - camp.
  - beacon.
  - storm.
  - faction.
  - crew.
  - story.
  - act.
  - skyfall.
  result_labels:
    dawn_scout_rescued: 斥候获救。风筝人愿意教你布置信标，提早去雨背崖。
    dawn_copper_salvaged: 铜料上船。阿岚留下补船板，余下的铜够装一副打捞架。
    dawn_salvage_closed: 错过了最后一次回收
    crosswind_beacon_fitted: 侧风信标已装好。从风蚀林可以绕到雨背崖。
    copper_tow_rig_fitted: 打捞架已装好。从碎盐滩可以走低空通道进铜潮谷。
    rainshade_lookout_supplied: 守望人收下了口粮。你带回两束药草，也多了愿意帮忙的人。
    copper_tide_haul_secured: 线圈收上来了。铜和煤进了仓，风暴压力升高 8。
    expedition_unavailable: 这次行动已经错过时机。
    arrived: 已抵达
    resource_gathered: 采集完成
    resource_collected: 采集完成
    gathering_failed: 没有采到
    exploration_completed: 探索完成
    workshop_built: 工坊立起来了
    workshop_upgraded: 工坊升级
    galley_built: 厨房开火
    galley_upgraded: 厨房扩建
    garden_built: 花园种下
    garden_upgraded: 花园扩建
    infirmary_built: 药棚搭好
