cadence:
  reflection: 1d
  innovation: 3d
stagnation:
  window: 3d
  max_interval: 10d
  growth: structural
  progress_event_types:
  - exploration.completed
  - camp.workshop_built
  - camp.galley_built
  - camp.beacon_frame_built
  - beacon.core_installed
  - storm.warning
  - storm.hit
  - faction.kite_aided
  - faction.foundry_traded
  - faction.choir_listened
  - skyfall.launched
  - skyfall.anchored
limits:
  max_ready_god_tasks: 1
  continue_during_cooldown: true
director:
  cadence: 2d
  window: 7d
  targets:
  - verb
  policy: deterministic
  behavior_action: dynamic_salvage
  max_cell_units: 8
  kickoff: true
  context_properties:
  - day
  - act
  - storm_pressure
  - hull_integrity
  - explored_islands
  - beacon_cores
  - crew_count
  - kite_rep
  - foundry_rep
  - choir_rep
  - supply_consultation
  - supply_relief_due
contracts:
  god_structural:
    tools:
    - query_history
    - query_world_index
    - propose_definition
    - wait
    required_definition_type: behavior
    assign_to:
    - ke
    max_proposals: 1
    max_tool_calls: 12
    required_content:
      growth_cell: true
    behavior_constraints:
      action_id: dynamic_salvage
      parameters:
        item: [wood, fiber, stone, salt, clay, glass_sand, copper_ore, coal, herb, mushroom, oil, bone, amber, crystal, relic]
        amount: [2]
        location_id: [broken_span]
      entry_conditions: [actor.alive, location.tag.salvage]
      cooldown_minutes: 1440
    purpose: 按 Director 的 plan，在既有群岛里长出一个新的打捞行为：风筝人斥候阿筝可以在断桥群岛打捞现有材料。
    result: 读取 season_plan、world_growth_ledger 和最近的探索/风暴事件。只提交一个 definition_type=behavior，assign_to ["ke"]，definition.id 写 dyn_salvage_N，agent_label 写“打捞<地点><材料>”，deferred 设为 true，cooldown_minutes 写 1440，entry_conditions 用 ["actor.alive", "location.tag.salvage"]，nodes 用 [{"type":"action","action_id":"dynamic_salvage","parameters":{"item":"<一个现有材料 id>","amount":2,"location_id":"<现有外岛 id>"}}]。item 只能从 wood、fiber、stone、salt、clay、glass_sand、copper_ore、coal、herb、mushroom、oil、bone、amber、crystal、relic 里选；location_id 固定为 broken_span。不要创建新 Action、新岛、新资源、新物品或新 NPC；不要使用 followup_behavior；所有数量变化由 Platform 结算；证据不足时 wait。
wakes:
- id: story_after_expedition
  'on': [skyfall.expedition_completed]
  for: story
  every: 6h
  tools: [query_history, propose_story_beat, wait]
  external: true
  purpose: 用此次出航已结算的补给、风筝人声望或风暴压力，指出一个接下来可以验证的航线或船员安排。
- id: story_after_supply_decision
  'on': [supply.claims_opened, supply.reserved, supply.shared, supply.decision_expired]
  for: story
  tools: [query_history, propose_story_beat, wait]
  external: true
  purpose: 根据配给后的实际资源和关系解释谁付出了代价，并留下可执行的后续选择。
- id: god_after_stagnation
  'on': world.stagnation
  for: god
  task: god_structural
- id: story_after_exploration
  'on':
  - exploration.completed
  for: story
  count: 1
  every: 6h
  tools:
  - query_history
  - record_world_progress
  - propose_story_beat
  - wait
  external: true
  purpose: 玩家刚刚探索了一座岛；把新资源、新路线或旧名字变成下一拍，而不是复述“探索完成”。
- id: story_after_camp
  'on':
  - camp.workshop_built
  - camp.galley_built
  - camp.beacon_frame_built
  - beacon.core_installed
  for: story
  count: 1
  every: 6h
  tools:
  - query_history
  - record_world_progress
  - propose_story_beat
  - wait
  external: true
  purpose: 营地或信标向前一步；让船员对“我们真的要离开/留下”给出一个具体反应。
- id: story_after_storm
  'on':
  - storm.warning
  - storm.hit
  - storm.critical
  - storm.eased
  for: story
  count: 1
  every: 6h
  tools:
  - query_history
  - record_world_progress
  - propose_story_beat
  - wait
  external: true
  purpose: 风暴阶段改变；把船体、货物和船员的选择写成下一拍，不要直接宣布结局。
- id: story_after_faction
  'on':
  - faction.kite_aided
  - faction.foundry_traded
  - faction.choir_listened
  for: story
  count: 1
  every: 6h
  tools:
  - query_history
  - record_world_progress
  - propose_story_beat
  - wait
  external: true
  purpose: 阵营关系改变；让一个具体的人提出代价，而不是给一个抽象的声望数字。
- id: story_after_ending
  'on':
  - skyfall.launched
  - skyfall.anchored
  - skyfall.stormborn
  - skyfall.crash
  - skyfall.long_drift
  for: story
  count: 1
  every: 1h
  tools:
  - query_history
  - record_world_progress
  - propose_story_beat
  - wait
  external: true
  purpose: 本轮已经收束；只写一个余波或下一轮的钩子，不要改写结局条件。
