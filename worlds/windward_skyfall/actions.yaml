  - actor.alive
  - location.tag.salvage
  - context.amount == 2
  - context.item in ['wood', 'fiber', 'stone', 'salt', 'clay', 'glass_sand', 'copper_ore', 'coal', 'herb', 'mushroom', 'oil', 'bone', 'amber', 'crystal', 'relic']
