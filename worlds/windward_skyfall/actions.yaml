actions:
- id: travel_to
  verb: move
  version: 1
  description: 沿岛链飞向目标地点。
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  duration:
    minutes: 10
  costs:
    reserve: {}
    per_minute:
      stamina: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.alive
    result: arrived
  failure:
    condition: actor.incapacitated
    result: route_unknown
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  requires_destination: true
- id: explore_area
  verb: explore
  version: 1
  description: 花时间勘察一处岛屿，记录资源、遗迹和可以继续走的路。
  parameters:
    area_id: string
  preconditions:
  - actor.can_explore
  - actor.alive
  - route.known
  - area.not_fully_mapped
  duration:
    minutes: 120
  costs:
    reserve: {}
    per_minute:
      stamina: 0.18
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: need_delta
    need: purpose
    delta: 4
  - type: world_property_delta
    property: explored_islands
    delta: 1
    maximum: 9
    label: 已探岛屿
  - type: world_property_delta
    property: storm_pressure
    delta: 1
    maximum: 100
    label: 风暴压力
  success:
    condition: area.survey_complete
    result: exploration_completed
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: exploration.completed
    summary: 你把这座岛的地形、资源和能走的路记进了海图。
    area_parameter: area_id
    result: exploration_completed
- id: gather_resource
  verb: gather
  version: 1
  description: 从可见的资源节点采集两份材料。
  parameters:
    resource_tag: string
    location_id: string
  preconditions:
  - actor.can_gather
  - actor.alive
  - location.resource_node
  duration:
    minutes: 60
  costs:
    reserve:
      resource_parameter: resource_tag
      resource_amount: 2
    per_minute:
      stamina: 0.15
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: context.resource_tag
    quantity: 2
  success:
    condition: resource.collected
    result: resource_gathered
  failure:
    condition: resource.empty or actor.incapacitated
    result: gathering_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
