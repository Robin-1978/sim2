actions:
- id: rescue_kite_scout
  verb: rescue
  version: 1
  description: 拉回风筝人的斥候，赢得风筝人的信任。另一根缆绳上的铜料会坠入云海。
  preconditions:
  - actor.alive
  - actor.role == 'player'
  - location.tag.camp
  - world.day == 1
  - context.day_phase == 'dawn'
  - world.dawn_salvage == 0
  - world.ending_trigger == 0
  duration: {minutes: 6}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: dawn_salvage, value: 1}
  - {type: world_property_delta, property: kite_rep, delta: 0.25, maximum: 1}
  - type: public_event
    event: skyfall.dawn_salvage
    data: {choice: rescue}
    summary: 斥候被拉上甲板。另一根缆绳从铜箱上脱落，整箱铜料沉入云海。风筝人看见了船员的选择。
  failure:
    condition: actor.incapacitated or world.dawn_salvage != 0 or context.day_phase != 'dawn' or world.ending_trigger != 0
    result: dawn_salvage_closed
  success: {condition: actor.alive, result: dawn_scout_rescued}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: salvage_dawn_copper
  verb: salvage
  version: 1
  description: 获得两份铜矿和一块自动补船的铜板。斥候的求救灯会消失在云里。
  preconditions:
  - actor.alive
  - actor.role == 'player'
  - location.tag.camp
  - world.day == 1
  - context.day_phase == 'dawn'
  - world.dawn_salvage == 0
  - world.ending_trigger == 0
  duration: {minutes: 6}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: dawn_salvage, value: 2}
  - {type: world_property_set, property: supply_spare_plates, value: 1}
  - {type: inventory_add, item: copper_ore, quantity: 2}
  - type: public_event
    event: skyfall.dawn_salvage
    data: {choice: copper}
    summary: 铜箱落上甲板。阿岚收起应急铜板，留下两份铜矿。船员再向舷外看时，云里已经没有灯光。
  failure:
    condition: actor.incapacitated or world.dawn_salvage != 0 or context.day_phase != 'dawn' or world.ending_trigger != 0
    result: dawn_salvage_closed
  success: {condition: actor.alive, result: dawn_copper_salvaged}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: fit_crosswind_beacon
  verb: build
  version: 1
  description: 用两份木材安装信标。风筝人的手势能引你从风蚀林绕到雨背崖。
  preconditions:
  - actor.alive
  - location.tag.camp
  - world.kite_rep >= 0.3
  - world.crosswind_beacon == 0
  - actor.inventory.wood >= 2
  - world.ending_trigger == 0
  duration: {minutes: 12}
  costs: {reserve: {wood: 2}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: crosswind_beacon, value: 1}
  - {type: public_event, event: camp.crosswind_beacon_fitted, summary: 信标亮了。风蚀林上空的侧风有了可以辨认的引航标记。}
  failure:
    condition: actor.incapacitated or world.crosswind_beacon != 0 or world.ending_trigger != 0
    result: expedition_unavailable
  success: {condition: actor.alive, result: crosswind_beacon_fitted}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: fit_copper_tow_rig
  verb: build
  version: 1
  description: 用两份铜矿装一副打捞架，能沿碎盐滩的低空通道拖货进入铜潮谷。
  preconditions:
  - actor.alive
  - location.tag.camp
  - world.copper_tow_rig == 0
  - actor.inventory.copper_ore >= 2
  - world.ending_trigger == 0
  duration: {minutes: 12}
  costs: {reserve: {copper_ore: 2}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: copper_tow_rig, value: 1}
  - {type: public_event, event: camp.copper_tow_rig_fitted, summary: 阿岚把铜制打捞架扣在船舷。碎盐滩下方的低空通道现在能用来拖货。}
  failure:
    condition: actor.incapacitated or world.copper_tow_rig != 0 or world.ending_trigger != 0
    result: expedition_unavailable
  success: {condition: actor.alive, result: copper_tow_rig_fitted}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: supply_rainshade_lookout
  verb: supply
  version: 1
  description: 留下一份口粮，换两束药草。雨背崖的守望人会把这份援助记在风筝人的账上。
  preconditions:
  - actor.alive
  - location.tag.cliff
  - world.crosswind_beacon == 1
  - world.rainshade_lookout_supplied == 0
  - actor.inventory.ration >= 1
  - world.ending_trigger == 0
  duration: {minutes: 14}
  costs: {reserve: {ration: 1}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: rainshade_lookout_supplied, value: 1}
  - {type: world_property_delta, property: kite_rep, delta: 0.08, maximum: 1}
  - {type: world_property_delta, property: camp_morale, delta: 0.04, maximum: 1}
  - {type: inventory_add, item: herb, quantity: 2}
  - type: public_event
    event: skyfall.expedition_completed
    data: {location_id: rainshade_cliff, expedition: lookout_supply}
    summary: 雨背崖的守望人收下口粮，递来两束药草。他们答应把风脊号的名字带回断桥。
  failure:
    condition: actor.incapacitated or world.rainshade_lookout_supplied != 0 or world.ending_trigger != 0
    result: expedition_unavailable
  success: {condition: actor.alive, result: rainshade_lookout_supplied}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: salvage_copper_tide_haul
  verb: salvage
  version: 1
  description: 用打捞架拖起谷口的旧线圈，得三份铜料和一份煤，风暴压力增加 8。
  preconditions:
  - actor.alive
  - location.tag.copper
  - world.copper_tow_rig == 1
  - world.copper_tide_haul_taken == 0
  - world.storm_stage < 2
  - world.ending_trigger == 0
  duration: {minutes: 14}
  costs: {reserve: {}, per_minute: {}, on_success: {}, on_failure: {}, refund: {}}
  effects:
  - {type: world_property_set, property: copper_tide_haul_taken, value: 1}
  - {type: inventory_add, item: copper_ore, quantity: 3}
  - {type: inventory_add, item: coal, quantity: 1}
  - {type: world_property_delta, property: storm_pressure, delta: 8, maximum: 100}
  - type: public_event
    event: skyfall.expedition_completed
    data: {location_id: copper_tide, expedition: valley_salvage}
    summary: 线圈拖出谷口，拆出了铜料和煤。谷底的雷声跟着负重的风脊号向外滚。
  failure:
    condition: actor.incapacitated or world.copper_tide_haul_taken != 0 or world.storm_stage >= 2 or world.ending_trigger != 0
    result: expedition_unavailable
  success: {condition: actor.alive, result: copper_tide_haul_secured}
  kind: atomic
  executor: effect_pipeline
  interrupt_policy: cancel
  interaction_policy: allow
- id: travel_to
  verb: move
  version: 1
  description: 沿岛链飞向目标地点。
  parameters:
    location_id: string
  preconditions:
  - route.known
  - actor.mobile
  - destination.reachable
  duration:
    minutes: 10
  costs:
    reserve: {}
    per_minute:
      stamina: 0.1
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: location_set
    location_id: context.location_id
  success:
    condition: actor.alive
    result: arrived
  failure:
    condition: actor.incapacitated
    result: route_unknown
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  requires_destination: true
- id: explore_area
  verb: explore
  version: 1
  description: 花时间勘察一处岛屿，记录资源、遗迹和可以继续走的路。
  parameters:
    area_id: string
  preconditions:
  - actor.can_explore
  - actor.alive
  - route.known
  - area.not_fully_mapped
  duration:
    minutes: 120
  costs:
    reserve: {}
    per_minute:
      stamina: 0.18
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: need_delta
    need: purpose
    delta: 4
  - type: world_property_delta
    property: explored_islands
    delta: 1
    maximum: 9
    label: 已探岛屿
  - type: world_property_delta
    property: storm_pressure
    delta: 1
    maximum: 100
    label: 风暴压力
  success:
    condition: area.survey_complete
    result: exploration_completed
  failure:
    condition: actor.incapacitated
    result: failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
  information:
    event_type: exploration.completed
    configured: true
    summary: 你把这座岛的地形、资源和能走的路记进了海图。
    area_parameter: area_id
    result: exploration_completed
- id: gather_resource
  verb: gather
  version: 1
  description: 从可见的资源节点采集两份材料。
  parameters:
    resource_tag: string
    location_id: string
  preconditions:
  - actor.can_gather
  - actor.alive
  - location.resource_node
  duration:
    minutes: 60
    tool_bonuses:
    - {item: stone_axe, multiplier: 0.75, resource_tags: [wood, fiber]}
    - {item: stone_knife, multiplier: 0.65, resource_tags: [fiber, berries, herb, mushroom]}
    - {item: stone_pick, multiplier: 0.75, resource_tags: [stone, clay, glass_sand, salt]}
    - {item: copper_pick, multiplier: 0.60, resource_tags: [stone, clay, glass_sand, salt]}
  costs:
    reserve:
      resource_parameter: resource_tag
      resource_amount: 2
    per_minute:
      stamina: 0.15
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: inventory_add
    item: context.resource_tag
    quantity: 2
  success:
    condition: resource.collected
    result: resource_gathered
  failure:
    condition: resource.empty or actor.incapacitated
    result: gathering_failed
  interrupt_policy: pause
  interaction_policy: allow
  kind: atomic
  executor: effect_pipeline
