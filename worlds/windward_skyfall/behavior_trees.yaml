behavior_trees:
- id: rescue_kite_scout
  agent_label: 拉回斥候
  summary: 赢得风筝人的信任，可以搭信标提早到雨背崖。铜料会沉入云海。
  description: 拉回风筝人的斥候，赢得风筝人的信任。铜料会坠入云海。
  estimated_minutes: 6
  nodes:
  - {type: action, action_id: rescue_kite_scout, parameters: {}}
  success_results: [dawn_scout_rescued]
  failure_results: [dawn_salvage_closed]
  goal_tags: [decision]
- id: salvage_dawn_copper
  agent_label: 吊起铜料
  summary: 得补船板和一副打捞架所需的铜矿。斥候的灯会消失。
  description: 得两份铜矿和一块应急铜板。斥候的灯会消失。
  estimated_minutes: 6
  nodes:
  - {type: action, action_id: salvage_dawn_copper, parameters: {}}
  success_results: [dawn_copper_salvaged]
  failure_results: [dawn_salvage_closed]
  goal_tags: [decision]
- id: fit_crosswind_beacon
  agent_label: 装侧风信标
  description: 花两份木材，借风筝人的引航从风蚀林绕到雨背崖。
  estimated_minutes: 12
  nodes:
  - {type: action, action_id: fit_crosswind_beacon, parameters: {}}
  success_results: [crosswind_beacon_fitted]
  failure_results: [expedition_unavailable]
  goal_tags: [craft]
- id: fit_copper_tow_rig
  agent_label: 装铜制打捞架
  description: 花两份铜矿，打开从碎盐滩进入铜潮谷的低空通道。
  estimated_minutes: 12
  nodes:
  - {type: action, action_id: fit_copper_tow_rig, parameters: {}}
  success_results: [copper_tow_rig_fitted]
  failure_results: [expedition_unavailable]
  goal_tags: [craft]
- id: supply_rainshade_lookout
  agent_label: 给守望人送口粮
  description: 留一份口粮，带回两束药草，并得到风筝人的信任。
  estimated_minutes: 14
  nodes:
  - {type: action, action_id: supply_rainshade_lookout, parameters: {}}
  success_results: [rainshade_lookout_supplied]
  failure_results: [expedition_unavailable]
  goal_tags: [social, decision]
- id: salvage_copper_tide_haul
  agent_label: 拖出谷口线圈
  description: 带回三份铜矿和一份煤，风暴压力升高 8。
  estimated_minutes: 14
  nodes:
  - {type: action, action_id: salvage_copper_tide_haul, parameters: {}}
  success_results: [copper_tide_haul_secured]
  failure_results: [expedition_unavailable]
  goal_tags: [gather]
