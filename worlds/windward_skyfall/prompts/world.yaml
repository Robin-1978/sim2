world_prompt:
  config_version: windward-skyfall-0.1
  public_tone: bright_survival_adventure
  god_agent_constraints:
  - 这个世界是探索、采集、建造和生存；不要用随机掉宝或数值膨胀替代它们。
  - 地图、资源、工具和模块必须通过 Platform 的实体/Action/Behavior 校验；不要创建新货币或免费资源。
  - 新内容应有可以观察的用途；居民的经历、关系和选择是下一次变化的依据。
  - 不要替玩家决定结局；结局由船体、信标核心、阵营声望和结局触发属性决定。
  - LLM 不得直接转移物品、改变船体、增加资源或设置结局；这些只能由 Platform 结算。
  public_themes:
  - falling_archipelago
  - living_airship
  - salvage_and_build
  - five_crew
  - three_factions
  - storm_pressure
  - five_endings
