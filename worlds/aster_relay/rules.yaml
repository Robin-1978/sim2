vital_attribute: integrity
capacity_attribute: charge
research_default_required: 2
incapacitation:
  recovery:
    after_minutes: 720
    vital_fraction: 0.25
fallback_behavior_ids:
- study_source
- inspect_archive
needs:
- id: focus
  target: 75
  minimum: 0
  gamma: 1.3
  critical_threshold: 0.4
  critical_gain: 1.0
motivation_model:
  family: hybrid_need_utility_appraisal
  no_fixed_hierarchy: true
  dimensions:
  - safety_and_uncertainty
  - competence
  - meaning_and_goal_progress
minute_effects:
- id: charge_recovery
  scope: agent
  every_minutes: 1
  effect:
    type: attribute_delta
    attribute: charge
    delta: 0.05
    maximum: 100
resource_entity_types:
- resource
- material
resource_property_projections:
  energy_reserve: energy_reserve
world_rules:
- id: relay_stability_review
  condition: world.relay_stability >= 0.55
  effect: relay.stability_review
  event_type: relay.stability_review
  wake:
  - god
  description: Repeated archive inspections have raised relay stability enough to
    justify a new world-level review.
context_values: {}
decision_policy:
  wait_backoff_minutes:
  - 5
  - 10
  - 20
  empty_catalog_retry_minutes: 15
  wake_events:
  - definition.registered
  - story.beat.activated
capability_progression:
  research:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
  stewardship:
    minimum_completed_outcomes: 2
    max_delta: 0.08
    max_value: 1.0
