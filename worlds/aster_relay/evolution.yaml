# Without a cadence or a stagnation window this world could only evolve while
# Mira keeps producing wake events; both keep God reachable once research ends.
cadence:
  reflection: 1d
  god: 3d
stagnation:
  window: 1d
  max_interval: 7d
wakes:
- id: research_synthesis
  'on':
  - research.progressed
  - research.completed
  for: god
  count: 2
  every: 1
  external: true
  tools:
  - propose_entity
  - propose_definition
  - wait
  purpose: Two verified research work outcomes justify one new unanswered relay question
    or a concrete structure that lets the next study happen.
  result: Create at most one genuinely new source or executable continuation when
    the accumulated evidence leaves a distinct unanswered question. If every current
    source is exhausted, derive a distinct causal dimension such as effect, risk,
    intervention, provenance, or application from the verified result and use a new
    novelty key; do not wait merely because the words overlap, and do not rename the
    same question. Otherwise wait. The new source must yield at least 2 verified
    research outcomes (its number of stages times its research_required must be at
    least 2) because this world wakes you again only after 2 verified research
    outcomes.
- id: resource_safety
  'on': resource.safety_low
  for: god
  count: 1
  every: 1
  external: true
  require_story_outcome: true
  tools:
  - propose_definition
  - wait
  purpose: The public energy reserve is below its floor and Mira carries a real source
    item.
  result: Create one conserved supply Action and bound behavior when a real carried
    source exists; the behavior must wake Story after execution. Never mint public
    stock.
- id: relay_stability_review
  'on': relay.stability_review
  for: god
  count: 1
  every: 1
  external: true
  tools:
  - propose_entity
  - wait
  purpose: Repeated verified archive inspections have raised relay stability enough
    for a new world-level research question.
  result: Create one genuinely new research source only if the stability evidence
    supports a distinct unanswered question; otherwise wait. The new source must
    yield at least 2 verified research outcomes (its number of stages times its
    research_required must be at least 2) because this world wakes you again only
    after 2 verified research outcomes.
- 'on': research.completed
  for: story
- 'on': resource.replenished
  for: story
- 'on': entity.created
  for: story
- id: god_on_stagnation
  'on': world.stagnation
  for: god
  tools:
  - query_history
  - query_knowledge_gaps
  - propose_entity
  - propose_definition
  - wait
  purpose: Mira gained no new executable option for a full window, so the relay may be repeating a closed loop.
  result: Create one genuinely new research source or executable continuation that is reachable from her current state, or wait only when the diagnostics show none is justified.
