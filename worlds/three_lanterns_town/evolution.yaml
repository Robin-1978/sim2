cadence:
  reflection: 1d
  god: 1d
stagnation:
  window: 1d
  max_interval: 1w
  progress_event_types:
  - research.progressed
  - research.completed
  - exploration.completed
  - institution.revised
triggers:
- id: town_security_milestone
  when: world.town_security >= 0.8
  invoke: [god_local]
- id: cistern_review_threshold
  when: world.cistern_reviews >= 3
  invoke: [god_local]
  agent_contract:
    allowed_tools: [propose_institution, wait]
    purpose: Repeated verified cistern reviews justify deciding whether a public allocation institution is needed.
    required_result: Create one evidence-backed institution proposal, or wait only when the persisted evidence is insufficient.
    evidence_sources:
    - event_types: [cistern.reviewed]
      behavior_ids: [inspect_cistern]
    minimum_evidence: 3
wakes:
- id: research_synthesis
  "on": research.completed
  for: god
  count: 2
  every: 1d
  distinct_by: [source_id, stage_id]
  tools: [propose_entity, propose_definition, wait]
  purpose: A research stage was completed. Researchers need a grounded executable continuation once their open stages run out, such as a newly assigned source with declarative stages or a genuinely new capability.
  result: If no assigned source has an open stage, create at most one genuinely new research source for a new unanswered question with research_novelty_key, research_question, research_discoveries, research_required or stage required values, and research_assignees naming a character who can already perform research with the existing generic research behavior. Do not create a new page, ledger, draft, continuation or copy of an existing question; Platform rejects near-duplicate research focus. Otherwise wait because an open stage already is the researchers' next step.
- id: gathering_synthesis
  "on": resource.gathered
  for: god
  count: 3
  every: 1d
  tools: [propose_entity, propose_definition, wait]
  purpose: Three verified resource-gathering outcomes are evidence that the town has a usable material flow; choose a grounded next use such as a research source, storage or trade structure, or a recipe once a registered Action can craft it.
  result: Reuse the generic research, recipe, trade or production mechanism when it already fits. Create one distinct configured entity or definition only when the gathered material and recorded outcomes justify it; do not create another behavior that merely repeats the same action.
- id: institution_ledger_review
  "on": institution.ledger_entry
  for: god
  count: 3
  every: 1w
  tools: [propose_definition, wait]
  definition_type: behavior
  assign_to: [梅岚]
  purpose: Three verified ledger entries require God to create the next executable settlement behavior for the active institution.
  result: Propose one validated behavior using the registered institution allocation Action, or wait only when the ledger evidence is insufficient.
- id: institution_outcome_review
  "on": institution.allocation_completed
  for: god
  count: 3
  every: 1d
  tools: [propose_definition, propose_entity, revise_institution, wait]
  purpose: Review repeated allocation outcomes and create the next structural improvement when the reserve trend or institution results justify it.
  result: Compare the institution's current terms with the recorded allocations and ledger totals. Revise the terms of the active institution when the results show they no longer fit (for example a minimum the pool can never cover, or a ledger that credits too little or too much work); otherwise propose one new capability, production behavior, research source or structural entity when the verified trend supports progress; wait only when no grounded improvement is justified.
- {"on": civilization.milestone, for: god}
- id: option_stagnation
  "on": world.stagnation
  for: god
  tools: [inspect_entity, query_history, propose_entity, propose_definition, propose_institution, revise_institution, propose_world_change, wait]
  purpose: No character has gained a new executable option for a full window, so the town has stopped evolving on its own. The evidence lists what each character can do now and which listed conditions block the rest.
  result: Pick a blocked item whose listed reason you can change and change it with the matching tool. A research source assigned to a character who can already research fits when no open stage remains, a behavior assigned to a character who meets its entry conditions fits a missing behavior, and revise_institution fits when the reason names an institution allocation minimum or ledger that the current pool or work cannot meet. Check the listed conditions before assigning content, and do not repeat content the history shows was created and left unused. Wait only when the evidence shows that nothing grounded can be added.
- id: institution_proposal_review
  "on": institution.proposed
  for: god
  count: 1
  tools: [approve_institution, wait]
  purpose: Review the persisted institution proposal and activate it when its evidence and policy are sufficient for the verified public problem.
  result: Activate one pending institution or wait when the proposal is not yet justified; do not replace activation with a duplicate rule or narrative event.
- id: institution_activation_followup
  "on": institution.activated
  for: god
  count: 1
  tools: [propose_definition, wait]
  definition_type: behavior
  assign_to: [梅岚]
  purpose: Turn the activated institution into one executable settlement behavior for the configured resource pool and assigned character.
  result: Register one reusable behavior from the existing settlement Action and assign it to the configured character, or wait only when the active institution already has an executable settlement behavior.
- {"on": entity.created, for: god}
- {"on": definition.registered, for: god}
- id: resource_safety
  "on": resource.safety_low
  for: god
  count: 1
  every: 1d
  external: true
  tools: [revise_institution, propose_entity, propose_definition, wait]
  purpose: A configured reserve crossed its safety floor; review the institution and supply path against the observed runway before another allocation.
  result: Revise the active institution when its minimum or cadence cannot preserve the configured reserve floor. Propose a supply or recovery path only when the current world already has a real source entity and a registered Action that can consume or recover it; otherwise wait for evidence. Never invent an Action whose only effect is changing a resource quantity, and do not create a new research document for a stock shortage.
- {"on": institution.activated, for: story}
- {"on": institution.allocation_completed, for: story, manual_only: true}
