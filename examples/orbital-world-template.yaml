template_version: orbital-lab-1
world:
  id: orbital_lab
  title: Kepler Relay
  premise: An orbital relay must survive a radiation storm.
  genre: science_fiction
  properties:
    reactor_stability: 0.4
    solar_flux: 0.8
  random_seed: 17
attributes:
- id: integrity
  kind: state
  label: Integrity
  unit: '%'
  min: 0
  max: 100
  default: 80
  vital: true
  cost_mode: decrease
  prompt: Higher means the chassis is intact; zero means disabled.
- id: charge
  kind: state
  label: Charge
  unit: '%'
  min: 0
  max: 100
  default: 100
  capacity: true
  cost_mode: decrease
  prompt: Higher means more electrical energy is available.
- id: signal_clarity
  kind: need
  label: Signal clarity
  unit: '%'
  min: 0
  max: 100
  default: 55
  prompt: Higher means communication is clear and reliable.
locations:
- id: docking_ring
  name: Docking Ring
  public: true
  safe: true
  tags:
  - entry
  routes:
  - reactor_bay
- id: reactor_bay
  name: Reactor Bay
  public: true
  tags:
  - engineering
  routes:
  - docking_ring
objects:
- id: fusion_core
  type: machine
  name: Fusion Core
  initial_state:
    location_id: reactor_bay
    status: unstable
capabilities:
- id: systems_engineering
  name: Systems engineering
  description: Diagnose and stabilize station machinery.
actions:
- id: stabilize_reactor
  version: 1
  description: Tune the field coils and stabilize the fusion core.
  parameters: {}
  preconditions:
  - actor.alive
  duration:
    minutes: 4
  costs:
    reserve: {}
    per_minute:
      charge: 2
    on_success: {}
    on_failure: {}
    refund: {}
  effects:
  - type: world_property_delta
    property: reactor_stability
    delta: 0.1
    maximum: 1.0
  success:
    condition: actor.alive
    result: reactor_stabilized
  failure:
    condition: actor.incapacitated
    result: unit_disabled
  kind: atomic
  executor: effect_pipeline
behavior_trees:
- id: stabilize_reactor
  version: 1
  agent_label: Stabilize Reactor
  summary: Stabilize the orbital relay reactor.
  entry_conditions:
  - actor.alive
  estimated_minutes: 4
  success_results:
  - reactor_stabilized
  failure_results:
  - unit_disabled
  nodes:
  - type: action
    action_id: stabilize_reactor
    parameters: {}
agents:
- id: unit_seven
  name: Unit Seven
  role: maintenance_synthetic
  ultimate_goal: Keep Kepler Relay operational through the storm.
  traits:
    methodical: 0.9
  beliefs: []
  needs:
    signal_clarity: 55
  capabilities:
    systems_engineering: 0.8
  initial_bt_ids:
  - stabilize_reactor
  initial_state:
    location_id: reactor_bay
    status: idle
    integrity: 82
    charge: 100
  inventory: {}
rules:
  vital_attribute: integrity
  capacity_attribute: charge
  perception:
    visible_fields: [role, type, summary, description, public]
    visible_state_fields: [status]
    global:
      fields: [role, type, summary, description, public]
      state_fields: [status, location_id]
  fallback_behavior_ids: []
  needs:
  - id: signal_clarity
    target: 80
    minimum: 0
    gamma: 1.3
    critical_threshold: 0.7
    critical_gain: 1.0
  motivation_model:
    family: hybrid_need_utility_appraisal
    no_fixed_hierarchy: true
    dimensions:
    - system_integrity
    - mission_progress
  minute_effects:
  - id: signal_noise
    scope: agent
    every_minutes: 1
    effect:
      type: need_delta
      need: signal_clarity
      delta: -0.01
  memory_quality:
    semantic_similarity:
      enabled: false
evolution: {}
story: {}
player_template: {}
initial_events:
- id: storm_arrival
  type: storm.detected
  world_minute: 0
  payload:
    summary: A radiation storm reaches the relay.
